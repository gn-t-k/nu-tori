<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>入力欄</title>
<link rel="stylesheet" href="../_base.css">
<style>
/* タイムラインの一部（入力欄の置き場を示すため） */
.nav .r .person{width:30px;height:30px;border-radius:50%;background:var(--fill);color:var(--tint);display:grid;place-items:center}
.band{display:flex;justify-content:space-between;padding:4px 16px 12px;border-bottom:.5px solid var(--sep);flex:none;background:var(--bg)}
.band .day{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:var(--t-cap2);color:var(--ink2);padding:3px 4px;border-radius:10px}
.band .day.sel{background:var(--fill);color:var(--ink);font-weight:600}
.band .day.future{opacity:.45}
.pending{margin:12px 16px 0;display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:36px;padding:8px 16px;border-radius:999px;background:var(--surface);font-size:var(--t-foot);box-shadow:0 0 0 .5px var(--sep);flex:none}
.pending span:last-child{color:var(--tint);font-weight:600}
.tl{flex:1;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;gap:12px;padding:12px 16px}
.tl > *{flex:none}
/* 自分が送ったもの（食事・体重）は右に寄せ、薄いアクセントの地を敷く。返ってくる発言は左の地の上、アプリの知らせは全幅の白いカード */
.tl > .row,.tl > .meal{align-self:flex-end;width:86%;background:color-mix(in srgb,var(--tint) 10%,var(--surface))}
.dayh{text-align:center;font-size:var(--t-cap);color:var(--ink2);font-weight:600}
.row{display:flex;align-items:center;gap:12px;min-height:44px;background:var(--surface);border-radius:12px;padding:12px 16px;font-size:var(--t-sub)}
.row .tm{color:var(--ink2);font-size:var(--t-foot);width:36px;flex:none}
.row .grow{flex:1}
.row .val{font-variant-numeric:tabular-nums}
.row .disc{color:var(--ink3)}
.meal{background:var(--surface);border-radius:12px;display:flex;gap:12px;padding:12px 16px 12px 12px;align-items:center}
.meal .ph{width:64px;height:64px;border-radius:8px;flex:none;background:linear-gradient(135deg,#c79a63,#8a6238 55%,#e6d2ac)}
.meal .ph.c{background:linear-gradient(135deg,#9bb07a,#e0c8a0 50%,#c26a3a)}
.meal .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.meal .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:var(--t-sub)}
.meal .top b{font-weight:600}
.meal .top .k{font-variant-numeric:tabular-nums;font-size:var(--t-foot);color:var(--ink2)}
.meal .pfc{display:flex;flex-wrap:wrap;gap:2px 8px;font-size:var(--t-cap);color:var(--ink2);font-variant-numeric:tabular-nums}
.meal .pfc b{color:var(--ink);font-weight:600}
.meal .pfc > *{white-space:nowrap}
.meal .disc{color:var(--ink3);font-size:18px;flex:none}
.me{align-self:flex-end;max-width:80%;background:var(--me);color:var(--on-me);border-radius:18px;padding:8px 12px;font-size:var(--t-sub)}
.reply{font-size:var(--t-sub);max-width:92%;line-height:1.4}

/* 入力欄 */
.chips{display:flex;gap:8px;padding:8px 16px 0;overflow:hidden;flex:none;background:var(--bg)}
.chips span{white-space:nowrap;font-size:var(--t-foot);height:32px;display:flex;align-items:center;padding:0 12px;border-radius:999px;background:var(--surface);box-shadow:0 0 0 .5px var(--sep)}
.comp{display:flex;align-items:flex-end;gap:12px;padding:8px 16px;flex:none;background:var(--bg)}
.comp .cam{width:44px;height:44px;border-radius:50%;background:var(--tint);color:var(--on-tint);display:grid;place-items:center;flex:none}
.comp .wt{width:44px;height:44px;border-radius:50%;background:var(--fill);color:var(--tint);display:grid;place-items:center;flex:none}
.comp .wt.hot{background:var(--tint);color:var(--on-tint)}
.comp .in{flex:1;min-height:36px;border-radius:18px;background:var(--surface);box-shadow:0 0 0 .5px var(--sep);color:var(--ink3);font-size:var(--t-body);display:flex;align-items:flex-end;gap:8px;padding:7px 4px 4px 16px;min-width:0;margin-bottom:4px}
.comp .in .tx{flex:1;min-width:0;padding-bottom:3px;line-height:1.3}
.comp .in.typing{color:var(--ink);box-shadow:0 0 0 .5px var(--sep)}
.comp .in .caret{display:inline-block;width:2px;height:1.1em;background:var(--tint);vertical-align:-3px;margin-left:1px}
.comp .send{width:28px;height:28px;border-radius:50%;background:var(--tint);color:var(--on-tint);display:grid;place-items:center;flex:none}

/* キーボード（iOS の日本語かな） */
.kb{flex:none;background:var(--surface2);border-top:.5px solid var(--sep);padding:6px 4px 4px;display:flex;flex-direction:column;gap:6px}
.kb .cand{display:flex;gap:16px;padding:2px 10px 4px;font-size:var(--t-body);color:var(--ink);border-bottom:.5px solid var(--sep)}
.kb .cand span:first-child{font-weight:600}
.kb .rows{display:grid;grid-template-columns:1fr 1.3fr 1.3fr 1.3fr 1fr;gap:6px}
.kb .k{height:36px;border-radius:6px;background:var(--surface);color:var(--ink);display:grid;place-items:center;font-size:18px;box-shadow:0 1px 0 var(--ink3)}
.kb .k.fn{background:var(--fill);font-size:var(--t-foot)}
.kb .k.go{background:var(--tint);color:var(--on-tint);font-size:var(--t-foot)}

/* カメラ（全画面。ファインダーは写真と同じく固定の絵） */
.camera{flex:1;display:flex;flex-direction:column;color:var(--on-tint);background:linear-gradient(#0d0d0d,#0d0d0d)}
.camera .top{height:44px;display:flex;align-items:center;padding:0 16px;font-size:var(--t-body);flex:none}
.camera .finder{flex:1;position:relative;background:radial-gradient(ellipse at 50% 55%,#e9d8b8 0 26%,#c79a63 27% 34%,#6f5134 35% 60%,#3a2c20 61%)}
.camera .finder::after{content:"";position:absolute;left:50%;top:50%;width:90px;height:90px;transform:translate(-50%,-50%);border:1px solid rgb(255 214 10 / .9);border-radius:4px}
.camera .bottom{height:150px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 28px;flex:none}
.camera .roll{width:44px;height:44px;border-radius:8px;background:linear-gradient(135deg,#9bb07a,#e0c8a0 50%,#c26a3a);justify-self:start}
.camera .shutter{width:72px;height:72px;border-radius:50%;border:4px solid currentColor;display:grid;place-items:center}
.camera .shutter i{width:58px;height:58px;border-radius:50%;background:currentColor}
</style>
</head>
<body>
<header class="page-head">
  <h1>入力欄</h1>
  <p>タイムラインの下に固定し、シートにしない。上にプリセット、左から「撮る」（カメラのアイコン）と「体重」（体重計のアイコン）、書く欄、「送る」。撮るは開いた画面から1つ押せばカメラに入り、シャッターの1つで撮れる。</p>
</header>

<div class="states">

<figure>
  <div class="phone">
    <div class="status"></div>
    <div class="nav"><span></span><span class="t">9月24日（木）</span><span class="r"><span class="person" aria-label="アカウント"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7z"/></svg></span></span></div>
    <div class="band" data-band="weighed"></div>
    <div class="tl">
      <div class="dayh">今日 9月24日（木）</div>
      <div class="row"><span class="tm">7:12</span><span class="grow">体重</span><span class="val">72.4 kg</span><span class="disc">›</span></div>
      <div class="meal"><span class="ph"></span><div class="body"><div class="top"><b>トースト・ゆで卵</b><span class="k">7:40</span></div><div class="pfc"><b>358 kcal</b><span>P 17 g</span><span>F 14 g</span><span>C 40 g</span></div></div><span class="disc">›</span></div>
      <div class="me">昼はコンビニになりそう。何を選べばいい？</div>
      <div class="reply">朝のたんぱく質が 17 g なので、サラダチキンかゆで卵を足すと目安に近づきます。おにぎりは1つなら残りの炭水化物に収まります。</div>
      <div class="meal"><span class="ph c"></span><div class="body"><div class="top"><b>サラダチキン・おにぎり 2個</b><span class="k">12:20</span></div><div class="pfc"><b>510 kcal</b><span>P 32 g</span><span>F 6 g</span><span>C 78 g</span></div></div><span class="disc">›</span></div>
    </div>
    <div class="chips"><span>ここまでの食事を見て</span><span>次の食事のアドバイス</span></div>
    <div class="comp"><span class="cam" aria-label="撮る"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg></span><span class="wt" aria-label="体重"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="4"/><path d="M8 9.5a5 5 0 0 1 8 0"/><path d="M12 9.5l1.5-2"/></svg></span><span class="in"><span class="tx">書く</span></span></div>
    <div class="home"></div>
  </div>
  <figcaption><b>ふだん。</b>「撮る」はカメラ、「体重」は体重計のアイコンだけで示し、VoiceOver では「撮る」「体重」と読む。今日の体重は記録済みなので、体重のボタンは灰色の地にアクセントの色のアイコン。「送る」は書いた文字があるときだけ欄の中に出る。プリセットは押すとそのまま送る。</figcaption>
</figure>

<figure>
  <div class="phone">
    <div class="status"></div>
    <div class="nav"><span></span><span class="t">9月24日（木）</span><span class="r"><span class="person" aria-label="アカウント"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7z"/></svg></span></span></div>
    <div class="band" data-band="noweight"></div>
    <div class="pending"><span>今朝の体重がまだです</span><span>↑ 見る</span></div>
    <div class="tl">
      <div class="meal"><span class="ph"></span><div class="body"><div class="top"><b>トースト・ゆで卵</b><span class="k">7:40</span></div><div class="pfc"><b>358 kcal</b><span>P 17 g</span><span>F 14 g</span><span>C 40 g</span></div></div><span class="disc">›</span></div>
      <div class="me">昼はコンビニになりそう。何を選べばいい？</div>
      <div class="reply">朝のたんぱく質が 17 g なので、サラダチキンかゆで卵を足すと目安に近づきます。おにぎりは1つなら残りの炭水化物に収まります。</div>
      <div class="meal"><span class="ph c"></span><div class="body"><div class="top"><b>サラダチキン・おにぎり 2個</b><span class="k">12:20</span></div><div class="pfc"><b>510 kcal</b><span>P 32 g</span><span>F 6 g</span><span>C 78 g</span></div></div><span class="disc">›</span></div>
    </div>
    <div class="chips"><span>ここまでの食事を見て</span><span>次の食事のアドバイス</span></div>
    <div class="comp"><span class="cam" aria-label="撮る"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg></span><span class="wt hot" aria-label="体重"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="4"/><path d="M8 9.5a5 5 0 0 1 8 0"/><path d="M12 9.5l1.5-2"/></svg></span><span class="in"><span class="tx">書く</span></span></div>
    <div class="home"></div>
  </div>
  <figcaption><b>今日の体重がまだ。</b>その日の体重を記録するまで体重のボタンをアクセントの色で塗って目立たせる。今日の丸には体重の印がまだない。押すと体重の入力のシートが開き、記録すると灰色に戻る。</figcaption>
</figure>

<figure>
  <div class="phone">
    <div class="status"></div>
    <div class="nav"><span></span><span class="t">9月24日（木）</span><span class="r"><span class="person" aria-label="アカウント"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7z"/></svg></span></span></div>
    <div class="band" data-band="weighed"></div>
    <div class="tl">
      <div class="meal"><span class="ph c"></span><div class="body"><div class="top"><b>サラダチキン・おにぎり 2個</b><span class="k">12:20</span></div><div class="pfc"><b>510 kcal</b><span>P 32 g</span><span>F 6 g</span><span>C 78 g</span></div></div><span class="disc">›</span></div>
      <div class="me">夜は外で食べる予定</div>
      <div class="reply">ここまでで 868 kcal なので、夜は 980 kcal ほど残っています。</div>
    </div>
    <div class="chips"><span>ここまでの食事を見て</span><span>次の食事のアドバイス</span></div>
    <div class="comp"><span class="cam" aria-label="撮る"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg></span><span class="in typing"><span class="tx">夜は定食屋で生姜焼き定食。ご飯は半分残して、味噌汁は全部飲んだ<span class="caret"></span></span><span class="send" aria-label="送る"><svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 12V2M2.5 6.5 7 2l4.5 4.5"/></svg></span></span></div>
    <div class="kb" aria-hidden="true">
      <div class="cand"><span>飲んだ</span><span>呑んだ</span><span>のんだ</span></div>
      <div class="rows">
        <span class="k fn">→</span><span class="k">あ</span><span class="k">か</span><span class="k">さ</span><span class="k fn">⌫</span>
        <span class="k fn">↺</span><span class="k">た</span><span class="k">な</span><span class="k">は</span><span class="k fn">空白</span>
        <span class="k fn">ABC</span><span class="k">ま</span><span class="k">や</span><span class="k">ら</span><span class="k go" style="grid-row:span 2;height:auto">改行</span>
        <span class="k fn">☺︎</span><span class="k">゛゜</span><span class="k">わ</span><span class="k">、。?!</span>
      </div>
    </div>
    <div class="home" style="background:var(--surface2)"></div>
  </div>
  <figcaption><b>書いているとき。</b>書いているあいだは体重のボタンを隠して、書く欄を広げる。カメラは残す（書きかけの文と写真を一緒に送れる）。欄は1行から始まり、書くと5行まで伸びる（これは3行）。文字が入ると欄の右端に「送る」が出る。タイムラインは入力欄とキーボードの上に押し上げられ、今日の一番新しい位置が見えたまま。送った文章が食事と読めたら、食事のカードとして返る。</figcaption>
</figure>

<figure>
  <div class="phone">
    <div class="status" style="background:#0d0d0d"></div>
    <div class="camera">
      <div class="top"><span>閉じる</span></div>
      <div class="finder" aria-label="ファインダー"></div>
      <div class="bottom">
        <span class="roll" aria-label="写真を選ぶ"></span>
        <span class="shutter" aria-label="撮る"><i></i></span>
        <span></span>
      </div>
    </div>
    <div class="home" style="background:#0d0d0d"></div>
  </div>
  <figcaption><b>カメラ。</b>入力欄の「撮る」で全画面に開く（ファインダーを大きく見せる）。シャッターを押すとすぐ閉じてタイムラインに戻り、写真と「推定しています…」のカードが入力欄のすぐ上に出る。左下で撮っておいた写真を選べ、食事には撮った時刻を使う。カメラはライトでもダークでも黒い地にする。</figcaption>
</figure>

</div>

<script src="../_ring.js"></script>
<script>
// 9月21日（月）〜27日（日）。月曜を左端にし、まだ来ていない日は薄い空の丸
const WEEK = [
  {d:'月', p:450,f:600,c:840, w:true},
  {d:'火', p:470,f:480,c:820, w:true},
  {d:'水', p:500,f:510,c:760, w:true},
  {d:'今日', p:196,f:180,c:472, w:true},
  {d:'金', future:true},
  {d:'土', future:true},
  {d:'日', future:true},
];
document.querySelectorAll('[data-band]').forEach(el => {
  const mode = el.dataset.band;
  el.innerHTML = WEEK.map(x => {
    const today = x.d === '今日';
    const o = x.future ? {size:28, stroke:4.5} : {size:28, stroke:4.5, p:x.p, f:x.f, c:x.c, goal:1850, weighed: today && mode==='noweight' ? false : x.w};
    return `<div class="day${today?' sel':''}${x.future?' future':''}">${nuRing.svg(o)}<span>${x.d}</span></div>`;
  }).join('');
});
</script>
</body>
