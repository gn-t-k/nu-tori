<style>
.wk{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;text-align:center}
.wk .arr{color:var(--tint);font-size:26px;line-height:1}
.wk .arr.off{color:var(--ink3)}
.wk b{font-size:var(--t-headline);font-weight:600;display:block}
.wk span.s{font-size:var(--t-foot);color:var(--ink2)}
.pace{background:var(--surface);border-radius:10px;padding:12px 16px;display:flex;flex-direction:column;gap:6px}
.pace b{font-size:var(--t-title3);font-weight:700}

.card{background:var(--surface);border-radius:10px;padding:16px 16px 12px}

.card .kv span:last-child{color:var(--ink2);white-space:nowrap}
.sec > .group-h{padding-left:16px}
.pfc .cell .n{font-variant-numeric:tabular-nums}
.pfc .cell .n small{color:var(--ink2);font-size:var(--t-foot)}
.pfc .key{margin-right:8px}
.days .cell{gap:12px;padding:8px 16px}
.days .cell .dt{width:104px;white-space:nowrap;flex:none;font-size:var(--t-sub);font-variant-numeric:tabular-nums}
.days .cell .dt small{color:var(--ink2);font-size:var(--t-foot)}
.days .cell .k{flex:1;font-variant-numeric:tabular-nums;font-size:var(--t-sub)}
.days .cell .k.none{color:var(--ink3)}
.days .cell .w{width:62px;text-align:right;color:var(--ink2);font-variant-numeric:tabular-nums;font-size:var(--t-sub)}
.next .cell{flex-direction:column;align-items:stretch;gap:6px;padding:12px 16px}
.next .top{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.next .top b{font-size:var(--t-title2);font-weight:700;font-variant-numeric:tabular-nums}
.next .top span{color:var(--ink2);font-variant-numeric:tabular-nums}
.next p{margin:0;font-size:var(--t-foot);color:var(--ink2)}
</style>

  <h1>週の振り返り</h1>
  <p>1日の目安が変わるまでの1週間をまとめる、プッシュで開く画面。一番上に期限に間に合うペースかを置き、体重、食べた量、P・F・C の平均、日ごと、次の週の1日の目安と続く。‹ › で週を送る。</p>
</header>
