<!-- @dsCard group="Views" -->
<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>サインイン</title>
<link rel="stylesheet" href="../_base.css">
<style>
.si{flex:1;display:flex;flex-direction:column;padding:0 16px 16px}
.si .hero{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center}
.si .icon{width:88px;height:88px;border-radius:20px;background:var(--tint);color:var(--on-tint);display:grid;place-items:center}
.si .name{font-size:28px;font-weight:700;letter-spacing:.01em}
.si .lead{font-size:var(--t-body);color:var(--ink2);line-height:1.45;margin:0}
.si .foot{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:24px;min-height:160px}
.si .err{font-size:var(--t-foot);color:var(--ink);text-align:center;margin:0 0 -12px;line-height:1.45}
/* Apple の標準のボタン（ライトは黒、ダークは白） */
.apple{width:100%;height:50px;border-radius:12px;background:var(--ink);color:var(--bg);display:flex;align-items:center;justify-content:center;gap:6px;font-size:var(--t-body);font-weight:600}
.si .pp{font-size:var(--t-foot);color:var(--tint);padding-bottom:8px}
</style>
</head>
<body>
<header class="page-head">
  <h1>サインイン</h1>
  <p>起動してサインインしていなければ全画面で出す。ナビゲーションバーは置かず、アプリの名前とひとことの説明、Apple の標準の「Apple でサインイン」ボタン、プライバシーポリシーだけを並べる。</p>
</header>

<div class="states">

<figure>
  <div class="phone">
    <div class="status"></div>
    <div class="si">
      <div class="hero">
        <span class="icon" aria-hidden="true"><svg width="44" height="44" viewBox="0 0 44 44" aria-hidden="true"><circle cx="22" cy="22" r="14" fill="none" stroke="currentColor" stroke-width="5" stroke-dasharray="60 88" transform="rotate(-90 22 22)"/><circle cx="22" cy="22" r="4" fill="currentColor"/></svg></span>
        <div class="name">nu-tori</div>
        <p class="lead">毎朝の体重と、食事の写真だけ。<br>目標までの1日の目安は nu-tori が決めます。</p>
      </div>
      <div class="foot">
        <span class="apple"><svg width="16" height="19" viewBox="0 0 16 19" fill="currentColor" aria-hidden="true"><path d="M13.2 10.1c0-2.3 1.9-3.4 2-3.5-1.1-1.6-2.8-1.8-3.4-1.8-1.4-.1-2.8.9-3.5.9s-1.9-.8-3.1-.8C3.6 4.9 2.1 5.8 1.3 7.2c-1.7 2.9-.4 7.2 1.2 9.6.8 1.1 1.7 2.4 2.9 2.3 1.2 0 1.6-.7 3-.7s1.8.7 3 .7c1.3 0 2.1-1.1 2.8-2.3.9-1.3 1.3-2.6 1.3-2.7-.1 0-2.3-.9-2.3-4zM10.9 3.3c.6-.8 1.1-1.8 1-2.9-.9 0-2.1.6-2.7 1.4-.6.7-1.1 1.7-1 2.8 1 .1 2.1-.5 2.7-1.3z"/></svg>Apple でサインイン</span>
        <span class="pp">プライバシーポリシー ↗</span>
      </div>
    </div>
    <div class="home"></div>
  </div>
  <figcaption><b>初め。</b>名前とメールアドレスは求めない。ボタンを押すと iPhone の「Apple でサインイン」の画面が出る。済むとタイムラインに置き換わって戻れず、目標を立てる知らせと入力欄の「撮る」が待っている。iPhone の画面を閉じてやめたときは、何も出さずこの画面に戻る。</figcaption>
</figure>

<figure>
  <div class="phone">
    <div class="status"></div>
    <div class="si">
      <div class="hero">
        <span class="icon" aria-hidden="true"><svg width="44" height="44" viewBox="0 0 44 44" aria-hidden="true"><circle cx="22" cy="22" r="14" fill="none" stroke="currentColor" stroke-width="5" stroke-dasharray="60 88" transform="rotate(-90 22 22)"/><circle cx="22" cy="22" r="4" fill="currentColor"/></svg></span>
        <div class="name">nu-tori</div>
        <p class="lead">毎朝の体重と、食事の写真だけ。<br>目標までの1日の目安は nu-tori が決めます。</p>
      </div>
      <div class="foot">
        <p class="err" role="status">サインインできませんでした。<br>通信を確かめて、もう一度押してください。</p>
        <span class="apple"><svg width="16" height="19" viewBox="0 0 16 19" fill="currentColor" aria-hidden="true"><path d="M13.2 10.1c0-2.3 1.9-3.4 2-3.5-1.1-1.6-2.8-1.8-3.4-1.8-1.4-.1-2.8.9-3.5.9s-1.9-.8-3.1-.8C3.6 4.9 2.1 5.8 1.3 7.2c-1.7 2.9-.4 7.2 1.2 9.6.8 1.1 1.7 2.4 2.9 2.3 1.2 0 1.6-.7 3-.7s1.8.7 3 .7c1.3 0 2.1-1.1 2.8-2.3.9-1.3 1.3-2.6 1.3-2.7-.1 0-2.3-.9-2.3-4zM10.9 3.3c.6-.8 1.1-1.8 1-2.9-.9 0-2.1.6-2.7 1.4-.6.7-1.1 1.7-1 2.8 1 .1 2.1-.5 2.7-1.3z"/></svg>Apple でサインイン</span>
        <span class="pp">プライバシーポリシー ↗</span>
      </div>
    </div>
    <div class="home"></div>
  </div>
  <figcaption><b>失敗したとき。</b>アラートにせず、ボタンのすぐ上に理由を出し、同じボタンでやり直す。色は使わず文で示す（色は P・F・C、破壊的な操作、アクセントだけ）。上の名前と説明の位置は動かさない。</figcaption>
</figure>

</div>
</body>
</html>
