<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>体重</title>
<link rel="stylesheet" href="../_base.css">
<style>
/* 体重の画面 */
.today{display:flex;align-items:flex-start;gap:12px;padding:12px 16px}
.today .grow{flex:1;display:flex;flex-direction:column;gap:4px}
.today .d{font-size:var(--t-foot);color:var(--ink2)}
.today .v{font-size:var(--t-title2);font-weight:600;font-variant-numeric:tabular-nums}
.today .v small{font-size:var(--t-sub);font-weight:400;color:var(--ink2);margin-left:3px}
.today .src{font-size:var(--t-foot);color:var(--ink2)}
.today .fix{color:var(--tint);font-size:var(--t-body)}
.today .field{margin-top:4px;width:150px;font-size:var(--t-title2);font-weight:600;padding:6px 12px;font-variant-numeric:tabular-nums}
.today .field small{font-size:var(--t-sub);font-weight:400;color:var(--ink2);align-self:flex-end;margin-bottom:3px}
.today .caret{display:inline-block;width:2px;height:22px;background:var(--tint);vertical-align:-3px;margin-left:1px}
.chart-cell{padding:16px 16px 12px}
.cell .num.edit{font-variant-numeric:tabular-nums}
.cell .sub2{color:var(--ink2);font-size:var(--t-foot);margin-left:6px}
.nogoal-card{padding:16px;display:flex;flex-direction:column;gap:8px}
.nogoal-card b{font-size:var(--t-headline);font-weight:600}
.nogoal-card p{margin:0;font-size:var(--t-foot);color:var(--ink2)}
.nogoal-card .btn{align-self:flex-start;margin-top:4px}
/* 数字のキーボード（decimalPad）と、上の「完了」 */
.kbbar{flex:none;display:flex;justify-content:flex-end;padding:9px 16px;background:var(--chrome);border-top:.5px solid var(--sep);color:var(--tint);font-weight:600;font-size:var(--t-body)}
.kb{flex:none;display:grid;grid-template-columns:repeat(3,1fr);gap:7px;padding:7px 6px 6px;background:color-mix(in srgb,var(--ink) 9%,var(--bg))}
.kb span{height:44px;border-radius:6px;background:color-mix(in srgb,var(--surface) 55%,var(--surface2));display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:24px;line-height:1;color:var(--ink)}
.kb span i{font-style:normal;font-size:9px;letter-spacing:1.5px;color:var(--ink);margin-top:2px}
.kb span.fn{background:transparent}
.kb-home{height:22px;flex:none;background:color-mix(in srgb,var(--ink) 9%,var(--bg))}
/* 後ろのタイムライン（体重の入力の地） */
.band{display:flex;justify-content:space-between;padding:4px 16px 12px;border-bottom:.5px solid var(--sep);flex:none;background:var(--bg)}
.band .day{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:var(--t-cap2);color:var(--ink2);padding:3px 4px;border-radius:10px}
.band .day.sel{background:var(--fill);color:var(--ink);font-weight:600}
.band .day.future{opacity:.45}
.nav .r .person{width:30px;height:30px;border-radius:50%;background:var(--fill);color:var(--tint);display:grid;place-items:center}
.tl{flex:1;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;gap:12px;padding:12px 16px}
.tl > *{flex:none}
/* 自分が送ったもの（食事・体重）は右に寄せ、薄いアクセントの地を敷く。返ってくる発言は左の地の上、アプリの知らせは全幅の白いカード */
.tl > .trow{align-self:flex-end;width:86%;background:color-mix(in srgb,var(--tint) 10%,var(--surface))}
.dayh{text-align:center;font-size:var(--t-cap);color:var(--ink2);font-weight:600}
.trow{display:flex;align-items:center;gap:12px;min-height:44px;background:var(--surface);border-radius:12px;padding:12px 16px;font-size:var(--t-sub)}
.trow .tm{color:var(--ink2);font-size:var(--t-foot);width:36px;flex:none}
.trow .grow{flex:1}
.trow .disc{color:var(--ink3)}
.comp{display:flex;align-items:center;gap:12px;padding:8px 16px;flex:none;background:var(--bg)}
.comp .cam{width:44px;height:44px;border-radius:50%;background:var(--tint);color:var(--on-tint);display:grid;place-items:center;flex:none}
.comp .wt{width:44px;height:44px;border-radius:50%;background:var(--fill);color:var(--tint);display:grid;place-items:center;flex:none}
.comp .wt.hot{background:var(--tint);color:var(--on-tint)}
.comp .in{flex:1;height:36px;border-radius:999px;background:var(--surface);box-shadow:0 0 0 .5px var(--sep);color:var(--ink3);display:flex;align-items:center;padding:0 16px}
/* 体重の入力のシート */
.phone > .scrim{top:0}
.wsheet{padding-bottom:0}
.wsheet .nav{background:transparent}
.wsheet .body{padding:16px 16px 24px;display:flex;flex-direction:column;gap:12px}
.wsheet .stepper .v{font-size:34px}
.wsheet .prev{text-align:center;font-size:var(--t-foot);color:var(--ink2);margin:0}
.wsheet .typed{display:flex;justify-content:center;align-items:baseline;gap:4px;font-size:34px;font-weight:600;font-variant-numeric:tabular-nums;background:var(--surface);border-radius:12px;padding:8px 16px;box-shadow:0 0 0 2px var(--tint) inset}
.wsheet .typed small{font-size:var(--t-sub);font-weight:400;color:var(--ink2)}
.wsheet .typed .caret{display:inline-block;width:2px;height:30px;background:var(--tint);align-self:center}
.warn{display:flex;gap:8px;align-items:flex-start;font-size:var(--t-foot);color:var(--ink);background:var(--surface);border-radius:10px;padding:12px}
.warn svg{flex:none;margin-top:1px}
.sheet-home{height:22px;flex:none}
</style>
</head>

<script src="../_ring.js"></script>
<script>
// 帯（体重の入力の後ろのタイムライン）。月曜を左端に今の週（9月21日〜27日）を並べ、まだ来ていない日は空の丸。今日の体重はまだ
const WEEK = [
  {d:'月', p:450,f:600,c:840, w:true},
  {d:'火', p:470,f:480,c:820, w:true},
  {d:'水', p:500,f:510,c:760, w:true},
  {d:'今日', p:0,f:0,c:0, w:false},
  {d:'金', future:true},
  {d:'土', future:true},
  {d:'日', future:true},
];
document.querySelectorAll('[data-band]').forEach(el => {
  el.innerHTML = WEEK.map(x => `<div class="day${x.d==='今日'?' sel':''}${x.future?' future':''}">${nuRing.svg(x.future?{size:28,stroke:4.5}:{size:28,stroke:4.5,p:x.p,f:x.f,c:x.c,goal:1850,weighed:x.w})}<span>${x.d}</span></div>`).join('');
});

// 数字のキーボード（decimalPad）
const KEYS = [['1',''],['2','ABC'],['3','DEF'],['4','GHI'],['5','JKL'],['6','MNO'],['7','PQRS'],['8','TUV'],['9','WXYZ'],['.',''],['0',''],['⌫','']];
document.querySelectorAll('[data-kb]').forEach(el => {
  el.innerHTML = KEYS.map(([k,s]) => `<span${k==='.'||k==='⌫'?' class="fn"':''}>${k}${s?`<i>${s}</i>`:''}</span>`).join('');
});

// 最近4週の体重（8月28日〜9月24日。[月, 日, 曜日, kg]）。9月7日〜20日の値は週の振り返りと同じ。
// 日曜は測っていない。9月7日〜13日の週は記録が 2 日だけ
const W = [
  [8,28,'金',74.3],[8,29,'土',74.5],[8,31,'月',74.2],
  [9,1,'火',74.0],[9,2,'水',74.1],[9,3,'木',73.8],[9,5,'土',73.6],
  [9,9,'水',73.5],[9,12,'土',73.4],
  [9,14,'月',73.4],[9,15,'火',73.3],[9,16,'水',73.1],[9,17,'木',73.2],[9,18,'金',73.0],[9,19,'土',72.9],
  [9,21,'月',72.8],[9,22,'火',72.7],[9,23,'水',72.6],[9,24,'木',72.4],
];
const dayIndex = (m,d) => m===8 ? d-28 : d+3; // 8月28日を 0 とする

document.querySelectorAll('[data-wchart]').forEach(el => {
  const o = JSON.parse(el.dataset.wchart);
  const pts = W.map(([m,d,,v],i) => [dayIndex(m,d), i===W.length-1 && o.last ? o.last : v]);
  const W0=320, H0=180, L=34, R=W0-8, T=10, B=H0-22;
  const lo = o.goal ? 69.5 : 72, hi = 75;
  const x = i => L + (R-L) * i/27, y = v => B - (B-T) * (v-lo)/(hi-lo);
  let g = '';
  for (let v = Math.ceil(lo); v <= hi; v++) {
    g += `<line x1="${L}" x2="${R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--grid)" stroke-width="1" fill="none"/>`;
    g += `<text x="${L-6}" y="${y(v)+3.5}" text-anchor="end">${v}</text>`;
  }
  [[0,'8月28日'],[9,'9月6日'],[18,'9月15日'],[27,'9月24日']].forEach(([i,t],k,a) =>
    g += `<text x="${x(i)}" y="${H0-6}" text-anchor="${k===0?'start':k===a.length-1?'end':'middle'}">${t}</text>`);
  if (o.goal) {
    g += `<line x1="${L}" x2="${R}" y1="${y(o.goal)}" y2="${y(o.goal)}" stroke="var(--guide)" stroke-width="1.5" stroke-dasharray="4 3" fill="none"/>`;
    g += `<text x="${R}" y="${y(o.goal)-5}" text-anchor="end">目標 70.0 kg</text>`;
  }
  // 傾向の線（最小二乗の直線）
  const n = pts.length, sx = pts.reduce((s,p)=>s+p[0],0), sy = pts.reduce((s,p)=>s+p[1],0);
  const sxx = pts.reduce((s,p)=>s+p[0]*p[0],0), sxy = pts.reduce((s,p)=>s+p[0]*p[1],0);
  const b = (n*sxy - sx*sy)/(n*sxx - sx*sx), a = (sy - b*sx)/n;
  pts.forEach(([i,v]) => g += `<circle cx="${x(i)}" cy="${y(v)}" r="3" fill="var(--series)" fill-opacity=".4"/>`);
  g += `<line x1="${x(0)}" y1="${y(a)}" x2="${x(27)}" y2="${y(a+b*27)}" stroke="var(--series)" stroke-width="2.5" stroke-linecap="round" fill="none"/>`;
  const [li, lv] = pts[n-1];
  g += `<circle cx="${x(li)}" cy="${y(lv)}" r="4" fill="var(--series)" stroke="var(--surface)" stroke-width="1.5"/>`;
  el.innerHTML = `<svg viewBox="0 0 ${W0} ${H0}" role="img" aria-label="最近4週の体重。${W[0][3]} kg から ${lv} kg へ下がる傾向">${g}</svg>`;
});

// 最近の記録（新しい順）
document.querySelectorAll('[data-records]').forEach(el => {
  const k = +el.dataset.records || 8;
  el.innerHTML = W.slice().reverse().slice(0,k).map(([m,dd,d,v]) => {
    return `<div class="cell"><span class="grow">${m}月${dd}日（${d}）</span><span class="edit num">${v.toFixed(1)} kg</span></div>`;
  }).join('');
});
</script>
</body>
</html>
