<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>目標の設定のレイアウト</title>
<style>
:root{--line:#8a9199;--soft:#e6e9ec;--fg:#22272d;--muted:#6b737c;--bg:#f4f5f7;--phone:#fff;--scrim:rgb(0 0 0 / .25);color-scheme:light}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--line:#7d858e;--soft:#2a3036;--fg:#e2e6ea;--muted:#9aa3ad;--bg:#121518;--phone:#1b1f23;--scrim:rgb(0 0 0 / .5);color-scheme:dark}}
:root[data-theme="dark"]{--line:#7d858e;--soft:#2a3036;--fg:#e2e6ea;--muted:#9aa3ad;--bg:#121518;--phone:#1b1f23;--scrim:rgb(0 0 0 / .5);color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;padding:16px;background:var(--bg);color:var(--fg);font:13px/1.5 system-ui,-apple-system,"Hiragino Sans",sans-serif}
h1{font-size:15px;margin:0 0 4px}
p.note{margin:0 0 16px;color:var(--muted);max-width:760px}
.row{display:flex;flex-wrap:wrap;gap:16px}
figure{margin:0;width:min(300px,100%)}
figcaption{color:var(--muted);font-size:12px;margin:6px 2px 0}
.phone{position:relative;height:600px;background:var(--phone);border:2px solid var(--line);border-radius:26px;overflow:hidden;display:flex;flex-direction:column}
.bar{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line)}
.bar b{flex:1;text-align:center}
.bar span{min-width:56px}
.body{flex:1;padding:10px;display:flex;flex-direction:column;gap:8px;overflow:hidden}
.card{border:1.5px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px}
.card.dash{border-style:dashed}
.hd{display:flex;justify-content:space-between;align-items:center;gap:6px}
.hd .t{font-weight:700}
.muted{color:var(--muted)}
.dots{display:flex;gap:4px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--soft);border:1px solid var(--line)}
.dots i.on{background:var(--fg);border-color:var(--fg)}
.q{font-weight:700}
.ch{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.ch div,.opt{border:1px solid var(--line);border-radius:8px;padding:6px 4px;text-align:center}
.facts{border:1px solid var(--line);border-radius:8px}
.facts div{display:flex;justify-content:space-between;padding:5px 8px;border-top:1px solid var(--soft)}
.facts div:first-child{border-top:0}
.facts .need{background:var(--soft)}
.plan{border:1px solid var(--line);border-radius:8px;padding:6px 8px;display:grid;grid-template-columns:1fr auto;font-size:12px}
.plan .d{grid-column:1/-1;color:var(--muted)}
.plan.rec{border-width:2px}
.btn{border:1.5px solid var(--fg);border-radius:8px;padding:6px;text-align:center;font-weight:700}
.btn.off{opacity:.4}
.sum{border:1px solid var(--soft);border-radius:6px;padding:4px 6px;font-size:11px;color:var(--muted);display:flex;justify-content:space-between}
.sum span:last-child{white-space:nowrap;margin-left:6px}
.finder{flex:1;min-height:80px;border:1px dashed var(--line);border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--muted)}
.tl{border-top:1px solid var(--soft);padding-top:6px;color:var(--muted);font-size:12px}
.sys{position:absolute;inset:0;background:var(--scrim);display:flex;align-items:flex-end}
.sys .p{width:100%;height:78%;background:var(--soft);border-radius:14px 14px 0 0;padding:12px;display:flex;flex-direction:column;gap:8px}
.sys .l{background:var(--phone);border-radius:8px}
.sys .l div{padding:6px 8px;border-top:1px solid var(--soft)}
.sys .l div:first-child{border-top:0}
.meters{display:grid;grid-template-columns:auto 1fr;gap:3px 6px;align-items:center;font-size:11px}
.meters i{height:6px;border:1px solid var(--line);border-radius:3px}
</style>
</head>
<body>
<h1>目標の設定（中忠実度レイアウト）</h1>
<p class="note">タイムラインの一番上のカードをその場で広げ、1ページに1つの問いで進める。「閉じる」は右上、「戻る」は左下、進み具合は右上の「n/全体」と押せない点。例は Tさん（身長と生年月日がない、歩数は取れる）。文言は⑦で決める。決めたことは <code>06-layout.md</code> の「目標の設定の流れ」。</p>
<div class="row">

<figure><div class="phone">
  <div class="bar"><span></span><b>タイムライン</b><span class="muted">アカウント</span></div>
  <div class="body">
    <div class="card"><div class="hd"><span class="t">目標を立てる</span><span class="muted">1/3　閉じる</span></div>
      <div class="dots"><i class="on"></i><i></i><i></i></div>
      <div class="q">何を目指しますか</div>
      <div class="ch"><div>減量</div><div>維持</div><div>増量</div></div>
    </div>
    <div class="muted">今朝の体重　72.4 kg</div>
    <div class="finder">ファインダー</div>
    <div class="tl">今日の食事…</div>
  </div></div><figcaption>ページ1 向き。選ぶと次へ進む</figcaption></figure>

<figure><div class="phone">
  <div class="bar"><span></span><b>タイムライン</b><span class="muted">アカウント</span></div>
  <div class="body"><div class="card"><div class="hd"><span class="t">目標を立てる</span><span class="muted">閉じる</span></div><div class="muted">減量</div></div><div class="finder">ファインダー</div></div>
  <div class="sys"><div class="p">
    <div class="muted" style="text-align:center;font-size:11px">iPhone（ヘルスケア）の画面</div>
    <b style="text-align:center">ヘルスケアへのアクセス</b>
    <div class="muted" style="font-size:11px;text-align:center">使用目的の文（1日の目安の見積もりに使う）</div>
    <div class="l"><div>身長</div><div>生年月日</div><div>性別</div><div>歩数</div></div>
    <div style="margin-top:auto" class="btn">許可</div><div class="muted" style="text-align:center">許可しない</div>
  </div></div></div><figcaption>向きを選んだ直後。まだ求めていない種類があるときだけ。自前の説明画面は置かない</figcaption></figure>

<figure><div class="phone">
  <div class="bar"><span></span><b>タイムライン</b><span class="muted">アカウント</span></div>
  <div class="body">
    <div class="card"><div class="hd"><span class="t">目標を立てる</span><span class="muted">2/3　閉じる</span></div>
      <div class="dots"><i></i><i class="on"></i><i></i></div>
      <div class="q">足りない値</div>
      <div class="facts"><div class="need"><span>身長</span><span>［　　］cm</span></div><div class="need"><span>生年月日の年</span><span>［　　］年</span></div><div><span>性別</span><span class="muted">ヘルスケアから</span></div><div><span>今の体重</span><span class="muted">今朝の記録</span></div><div><span>活動量</span><span class="muted">歩数から</span></div></div>
      <div class="btn off">次へ</div>
      <div class="muted">‹ 戻る</div>
    </div>
    <div class="finder">ファインダー</div>
  </div></div><figcaption>ページ2 足りない値だけ入力欄。全部取れた人には出ない（総数は2になる）</figcaption></figure>

<figure><div class="phone">
  <div class="bar"><span></span><b>タイムライン</b><span class="muted">アカウント</span></div>
  <div class="body">
    <div class="card"><div class="hd"><span class="t">目標を立てる</span><span class="muted">3/3　閉じる</span></div>
      <div class="dots"><i></i><i></i><i class="on"></i></div>
      <div class="sum"><span>170cm・32歳・男性・72.4kg・歩数から</span><span>変える</span></div>
      <div class="q">難易度</div>
      <div class="plan"><b>ゆるめ</b><span>1日 2,050 kcal</span><span class="d">期限・目標体重</span><span class="d">大変さのひとこと</span></div>
      <div class="plan rec"><b>標準（おすすめ）</b><span>1日 1,850 kcal</span><span class="d">期限・目標体重</span><span class="d">大変さのひとこと</span></div>
      <div class="plan"><b>ハード</b><span>1日 1,600 kcal</span><span class="d">期限・目標体重</span><span class="d">大変さのひとこと</span></div>
      <div class="muted">期限と目標体重を自分で決める</div>
      <div class="muted">‹ 戻る</div>
    </div>
  </div></div><figcaption>ページ3 押した時点で決まる。確認のページはない。維持なら案の代わりに「今の体重を保つ」1枚</figcaption></figure>

<figure><div class="phone">
  <div class="bar"><span></span><b>タイムライン</b><span class="muted">アカウント</span></div>
  <div class="body">
    <div class="card dash"><div class="hd"><span class="t">目標を立てる</span><span class="muted">途中から続ける</span></div></div>
    <div class="muted">今朝の体重　72.4 kg</div>
    <div class="finder">ファインダー</div>
    <div class="tl">今日の食事…</div>
  </div></div><figcaption>途中で閉じたとき。答えは残り、開くと同じページから</figcaption></figure>

<figure><div class="phone">
  <div class="bar"><span></span><b>タイムライン</b><span class="muted">アカウント</span></div>
  <div class="body">
    <div class="card"><div class="hd"><span class="t">減量</span><span class="muted">目標 ›</span></div>
      <div>あと 4.0 kg・あと 70 日・間に合うペース</div></div>
    <div class="meters"><span>kcal</span><i></i><span>P</span><i></i><span>F</span><i></i><span>C</span><i></i></div>
    <div class="muted">今朝の体重　72.4 kg</div>
    <div class="finder">ファインダー</div>
  </div></div><figcaption>決まったあと。カードが目標の要約に変わり、1日の目安との比較が始まる</figcaption></figure>

</div>
</body>
</html>
