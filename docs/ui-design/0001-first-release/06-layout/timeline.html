<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>タイムラインのレイアウト</title>
<style>
:root{--line:#8a9199;--soft:#e6e9ec;--fg:#22272d;--muted:#6b737c;--bg:#f4f5f7;--phone:#fff;--scrim:rgb(0 0 0 / .25);color-scheme:light}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--line:#7d858e;--soft:#2a3036;--fg:#e2e6ea;--muted:#9aa3ad;--bg:#121518;--phone:#1b1f23;--scrim:rgb(0 0 0 / .5);color-scheme:dark}}
:root[data-theme="dark"]{--line:#7d858e;--soft:#2a3036;--fg:#e2e6ea;--muted:#9aa3ad;--bg:#121518;--phone:#1b1f23;--scrim:rgb(0 0 0 / .5);color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;padding:16px;background:var(--bg);color:var(--fg);font:13px/1.5 system-ui,-apple-system,"Hiragino Sans",sans-serif}
h1{font-size:15px;margin:0 0 4px}
p.note{margin:0 0 16px;color:var(--muted);max-width:760px}
.row{display:flex;flex-wrap:wrap;gap:16px}
figure{margin:0;width:min(300px,100%)}
figcaption{color:var(--muted);font-size:12px;margin:6px 2px 0}
.phone{position:relative;height:600px;background:var(--phone);border:2px solid var(--line);border-radius:26px;overflow:hidden;display:flex;flex-direction:column}
.bar{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line)}
.bar b{flex:1;text-align:center}
.bar span{min-width:56px}
.body{flex:1;padding:10px;display:flex;flex-direction:column;justify-content:flex-end;gap:8px;overflow:hidden}
.card{border:1.5px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px}
.card.dash{border-style:dashed}
.hd{display:flex;justify-content:space-between;align-items:center;gap:6px}
.hd .t{font-weight:700}
.muted{color:var(--muted)}
.dots{display:flex;gap:4px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--soft);border:1px solid var(--line)}
.dots i.on{background:var(--fg);border-color:var(--fg)}
.q{font-weight:700}
.ch{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.ch div,.opt{border:1px solid var(--line);border-radius:8px;padding:6px 4px;text-align:center}
.facts{border:1px solid var(--line);border-radius:8px}
.facts div{display:flex;justify-content:space-between;padding:5px 8px;border-top:1px solid var(--soft)}
.facts div:first-child{border-top:0}
.facts .need{background:var(--soft)}
.plan{border:1px solid var(--line);border-radius:8px;padding:6px 8px;display:grid;grid-template-columns:1fr auto;font-size:12px}
.plan .d{grid-column:1/-1;color:var(--muted)}
.plan.rec{border-width:2px}
.btn{border:1.5px solid var(--fg);border-radius:8px;padding:6px;text-align:center;font-weight:700}
.btn.off{opacity:.4}
.sum{border:1px solid var(--soft);border-radius:6px;padding:4px 6px;font-size:11px;color:var(--muted);display:flex;justify-content:space-between}
.sum span:last-child{white-space:nowrap;margin-left:6px}
.finder{flex:1;min-height:80px;border:1px dashed var(--line);border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--muted)}
.tl{border-top:1px solid var(--soft);padding-top:6px;color:var(--muted);font-size:12px}
.sys{position:absolute;inset:0;background:var(--scrim);display:flex;align-items:flex-end}
.sys .p{width:100%;height:78%;background:var(--soft);border-radius:14px 14px 0 0;padding:12px;display:flex;flex-direction:column;gap:8px}
.sys .l{background:var(--phone);border-radius:8px}
.sys .l div{padding:6px 8px;border-top:1px solid var(--soft)}
.sys .l div:first-child{border-top:0}
.meters{display:grid;grid-template-columns:auto 1fr;gap:3px 6px;align-items:center;font-size:11px}
.meters i{height:6px;border:1px solid var(--line);border-radius:3px}
.band{display:flex;align-items:center;gap:4px;padding:8px 10px;border-bottom:1px solid var(--line)}
.band{justify-content:space-between}
.band i{width:22px;height:22px;border-radius:50%;border:3px solid var(--line);display:flex;align-items:center;justify-content:center;font-style:normal;font-size:10px;font-weight:700}
.band i.w::after{content:"✓"}
.comp{border-top:1px solid var(--line);padding:6px 8px 10px;display:flex;gap:6px;align-items:center;font-size:11px;color:var(--muted)}
.comp b{border:1px solid var(--line);border-radius:999px;padding:3px 8px;font-weight:400}
.comp .in{flex:1;border:1px solid var(--line);border-radius:999px;padding:3px 8px}
.ev{color:var(--muted);font-size:12px;border-top:1px solid var(--soft);padding-top:6px}
.nudge{margin:6px 10px 0;border:1px solid var(--fg);border-radius:999px;padding:3px 10px;font-size:11px;display:flex;justify-content:space-between}
.band i.sel{outline:2px solid var(--fg);outline-offset:2px}
.band label{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:9px;color:var(--muted)}
.me{align-self:flex-end;max-width:80%;background:var(--soft);border-radius:12px;padding:5px 8px;font-size:12px}
.photo{align-self:flex-end;width:110px;height:80px;border-radius:10px;background:var(--soft);border:1px solid var(--line)}
.mealc{border:1px solid var(--line);border-radius:10px;padding:6px 8px;font-size:12px;display:flex;justify-content:space-between;gap:6px}
.app{border-left:2px solid var(--line);padding-left:8px;font-size:12px}
.dayh{text-align:center;color:var(--muted);font-size:11px}
.comp .hot{border:2px solid var(--fg);color:var(--fg);font-weight:700}
.chips{padding:6px 8px 0;display:flex;gap:4px;font-size:10px;color:var(--muted)}
.chips span{border:1px solid var(--line);border-radius:999px;padding:2px 6px;white-space:nowrap}
.cam{flex:1;background:#2b3036;color:#d9dee3;display:flex;flex-direction:column;justify-content:space-between;padding:12px}
.cam .r{display:flex;justify-content:space-between;align-items:center;font-size:11px}
.cam .sh{width:48px;height:48px;border-radius:50%;border:3px solid #d9dee3}
.big{display:flex;gap:10px;align-items:center}
.big i{width:90px;height:90px;border-radius:50%;border:12px solid var(--line);display:flex;align-items:center;justify-content:center;font-style:normal;font-size:20px;font-weight:700}
</style>
</head>
<body>
<h1>タイムライン（中忠実度レイアウト）</h1>
<p class="note">新しいものが下に来る。上から、題を空にしたナビゲーションバー（右端にアカウント）、1日の丸の帯（7日分、体重を記録した日は丸の中に印、選んでいる日を囲む、丸の下に曜日）、時系列、入力欄（プリセット、撮る、体重、書く、送る）。例は Tさんの木曜の昼。文言と色は⑦で決める。決めたことは <code>06-layout.md</code> の「タイムラインの並べ方と、1日の丸」。単位ビュー「タイムライン」「入力欄」「日のまとめ」と、体重の画面を描く。</p>
<div class="row">
<figure><div class="phone"><div class="bar"><span></span><b></b><span class="muted" style="text-align:right">アカウント</span></div><div class="band"><label><i class="w "></i>金</label><label><i class="w "></i>土</label><label><i class=""></i>日</label><label><i class="w "></i>月</label><label><i class="w "></i>火</label><label><i class="w "></i>水</label><label><i class="sel"></i>今日</label></div><div class="body"><div class="dayh">昨日 9/23（水）</div><div class="mealc"><span>焼き鳥・ビール 2杯</span><span>840 kcal ›</span></div><div class="dayh">今日 9/24（木）</div><div class="me" style="align-self:flex-end">体重 72.4 kg ›</div><div class="photo"></div><div class="mealc"><span>トースト・ゆで卵</span><span>358 kcal ›</span></div><div class="me">昼はコンビニになりそう。何を選べばいい？</div><div class="app">朝のたんぱく質が 18 g なので…（AI の発言）</div><div class="photo"></div><div class="mealc"><span>サラダチキン・おにぎり 2個</span><span>510 kcal ›</span></div></div><div class="chips"><span>ここまでの食事のフィードバック</span><span>次の食事のアドバイス</span></div><div class="comp"><b>撮る</b><b class="">体重</b><span class="in">書く</span><b>送る</b></div></div><figcaption>開いたところ。今日の一番新しい位置にいる。「体重 72.4 kg ›」の行を押すと体重の画面へ潜る</figcaption></figure>
<figure><div class="phone"><div class="bar"><span></span><b></b><span class="muted" style="text-align:right">アカウント</span></div><div class="band"><label><i class="w "></i>金</label><label><i class="w "></i>土</label><label><i class=""></i>日</label><label><i class="w "></i>月</label><label><i class="w "></i>火</label><label><i class="w "></i>水</label><label><i class="sel"></i>今日</label></div><div class="nudge" style="margin-bottom:6px"><span>今日の体重がまだです</span><span>↑</span></div><div class="body"><div class="photo"></div><div class="mealc"><span>トースト・ゆで卵</span><span>358 kcal ›</span></div><div class="me">昼はコンビニになりそう。何を選べばいい？</div><div class="app">朝のたんぱく質が 18 g なので…（AI の発言）</div><div class="photo"></div><div class="mealc"><span>サラダチキン・おにぎり 2個</span><span>510 kcal ›</span></div></div><div class="chips"><span>ここまでの食事のフィードバック</span><span>次の食事のアドバイス</span></div><div class="comp"><b>撮る</b><b class="hot">体重</b><span class="in">書く</span><b>送る</b></div></div><figcaption>9:00 の体重の知らせが、答えないまま上へ流れたとき。帯の下に1行で出し、押すと知らせまで戻る。知らせの中で、その場で体重を入れられる</figcaption></figure>
<figure><div class="phone"><div class="cam"><div class="r"><span>閉じる</span><span></span></div><div style="text-align:center;font-size:12px">ファインダー</div><div class="r"><span>写真を選ぶ</span><span class="sh"></span><span style="min-width:48px"></span></div></div></div><figcaption>入力欄の「撮る」で全画面のカメラを開く。撮るとすぐ閉じてタイムラインに戻る。撮っておいた写真はここから選ぶ</figcaption></figure>
<figure><div class="phone"><div class="bar"><span></span><b></b><span class="muted" style="text-align:right">アカウント</span></div><div class="band"><label><i class="w "></i>金</label><label><i class="w "></i>土</label><label><i class=""></i>日</label><label><i class="w "></i>月</label><label><i class="w "></i>火</label><label><i class="w "></i>水</label><label><i class="w sel"></i>今日</label></div><div class="body"><div class="dayh">今日 9/24（木）</div><div class="me" style="align-self:flex-end">体重 72.4 kg ›</div><div class="photo"></div><div class="mealc"><span>トースト・ゆで卵</span><span>358 kcal ›</span></div><div class="me">昼はコンビニになりそう。何を選べばいい？</div><div class="app">朝のたんぱく質が 18 g なので…（AI の発言）</div><div class="photo"></div><div class="mealc"><span>サラダチキン・おにぎり 2個</span><span>510 kcal ›</span></div><div class="photo"></div><div class="mealc"><span class="muted">推定しています…</span><span></span></div></div><div class="chips"><span>ここまでの食事のフィードバック</span><span>次の食事のアドバイス</span></div><div class="comp"><b>撮る</b><b class="">体重</b><span class="in">書く</span><b>送る</b></div></div><figcaption>撮った直後。写真と推定中の食事が入力欄のすぐ上に出る。推定が済むと今日の丸が伸びる（体重は記録済みで印が付いている）</figcaption></figure>
<figure><div class="phone"><div class="bar"><span></span><b></b><span class="muted" style="text-align:right">アカウント</span></div><div class="band"><label><i class="w "></i>金</label><label><i class="w "></i>土</label><label><i class=""></i>日</label><label><i class="w "></i>月</label><label><i class="w "></i>火</label><label><i class="w "></i>水</label><label><i class="w sel"></i>今日</label></div><div class="body"><div class="dayh">今日 9/24（木）</div><div class="me" style="align-self:flex-end">体重 72.4 kg ›</div><div class="photo"></div><div class="mealc"><span>トースト・ゆで卵</span><span>358 kcal ›</span></div><div class="me">昼はコンビニになりそう。何を選べばいい？</div><div class="app">朝のたんぱく質が 18 g なので…（AI の発言）</div><div class="photo"></div><div class="mealc"><span>サラダチキン・おにぎり 2個</span><span>510 kcal ›</span></div><div class="me">残りご飯と唐揚げ</div><div class="mealc"><span>残りご飯と唐揚げ<br><span class="muted">会話として送り直す</span></span><span>610 kcal ›</span></div></div><div class="chips"><span>ここまでの食事のフィードバック</span><span>次の食事のアドバイス</span></div><div class="comp"><b>撮る</b><b class="">体重</b><span class="in">書く</span><b>送る</b></div></div><figcaption>書いて送った文章を食事として読んだとき。「会話として送り直す」を添える。時刻は食事の画面で直せる</figcaption></figure>
<figure><div class="phone"><div class="bar"><span></span><b></b><span class="muted" style="text-align:right">アカウント</span></div><div class="band"><label><i class="w "></i>金</label><label><i class="w "></i>土</label><label><i class=""></i>日</label><label><i class="w "></i>月</label><label><i class="w "></i>火</label><label><i class="w "></i>水</label><label><i class="w sel"></i>今日</label></div><div class="body" style="justify-content:flex-start;opacity:.35"><div class="dayh">今日 9/24（木）</div><div class="me" style="align-self:flex-end">体重 72.4 kg ›</div><div class="photo"></div><div class="mealc"><span>トースト・ゆで卵</span><span>358 kcal ›</span></div><div class="me">昼はコンビニになりそう。何を選べばいい？</div><div class="app">朝のたんぱく質が 18 g なので…（AI の発言）</div><div class="photo"></div><div class="mealc"><span>サラダチキン・おにぎり 2個</span><span>510 kcal ›</span></div></div>
  <div class="sys"><div class="p" style="background:var(--phone);border:1.5px solid var(--line)">
    <div class="hd"><span class="muted">‹</span><b>今日 9/24（木）</b><span class="muted">›　完了</span></div>
    <div class="q">食事と栄養</div>
    <div class="big"><i>✓</i><div class="facts" style="flex:1"><div><span>kcal</span><span>1,388 / 1,850</span></div><div><span>P</span><span>52 / 130 g</span></div><div><span>F</span><span>30 / 50 g</span></div><div><span>C</span><span>180 / 200 g</span></div></div></div>
    <div class="q">体重と目標</div>
    <div class="card"><div class="hd"><span>減量　あと 3.2 kg・あと 58 日</span><span class="muted">目標 ›</span></div><div class="muted">間に合うペース・体重の傾向</div><div>この日の体重 72.4 kg</div></div>
    <div class="sum"><span>週の振り返り 9/15〜9/21</span><span>›</span></div>
    <div class="muted">タイムラインでこの日を見る</div>
  </div></div></div><figcaption>日のまとめ。丸を押すとシートで開く。kcal と P・F・C は、食べた量と1日の目安を並べる。‹ › で日を送る。目標と週の振り返りへは、シートを閉じてからプッシュで開く</figcaption></figure>
<figure><div class="phone"><div class="bar"><span class="muted">‹ 戻る</span><b>体重</b><span></span></div><div class="body" style="justify-content:flex-start">
  <div class="card"><div class="hd"><span class="muted">9/24（木）</span><span class="muted">直す</span></div><div class="hd"><b style="font-size:22px">72.4 kg</b><span class="muted">手で記録</span></div></div>
  <div class="q">最近4週の傾向</div>
  <div class="facts" style="height:110px;display:flex;align-items:center;justify-content:center;color:var(--muted)">点（測った体重）と線（傾向）、目標体重の点線</div>
  <div class="card"><div class="hd"><span>目標 69.0 kg まで あと 3.2 kg</span><span class="muted">目標 ›</span></div><div class="muted">間に合うペース</div></div>
  <div class="q">最近の記録</div>
  <div class="facts"><div class="need"><span>9/24（木）</span><span>72.4 kg</span></div><div><span>9/23（水）</span><span>72.6 kg</span></div><div><span>9/22（火）</span><span>73.7 kg</span></div></div>
</div></div><figcaption>タイムラインの体重の行を押すと、体重の画面へプッシュで潜る。押した日の値をその場で直せる。目標がなければ「目標までの道のり」の代わりに目標を立てる入口</figcaption></figure>
</div>
</body>
</html>
