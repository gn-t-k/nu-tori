<title>体重の入れ方</title>
<!--
  PROTOTYPE（捨てる前提）。⑥ の問い「体重の入力のシートで、前回の値からどう直させるか」に答えるためのもの。
  #A #B #C で切り替える。下の黒いバーか ← → キーでも切り替えられる。
  A: 数字のキーボード（前回の値を選んだ状態）  B: ステッパー（±0.1、長押しで連続。数字を押すとキーボード）  C: ホイール（kg と小数を回す）
  右の「今朝の体重計」で目標の値を選び、記録までの操作の数を数える。文言と見た目は⑦で決める。
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap">
<style>
:root{
  --ground:#e9ecef; --phone:#fbfcfd; --ink:#22272d; --muted:#69727c; --line:#c3c9d0; --soft:#eef1f4;
  --accent:#34597f; --pill:#15181b; --pill-ink:#f3f5f7; --scrim:rgb(0 0 0 / .28);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#121518; --phone:#1b1f23; --ink:#e2e6ea; --muted:#9aa3ad; --line:#3a4148; --soft:#242a30;
    --accent:#8fb2d8; --pill:#f3f5f7; --pill-ink:#15181b; --scrim:rgb(0 0 0 / .5); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ground:#121518; --phone:#1b1f23; --ink:#e2e6ea; --muted:#9aa3ad; --line:#3a4148; --soft:#242a30;
  --accent:#8fb2d8; --pill:#f3f5f7; --pill-ink:#15181b; --scrim:rgb(0 0 0 / .5); color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font:13px/1.5 "BIZ UDPGothic",system-ui,-apple-system,"Hiragino Sans",sans-serif;padding:16px 16px 96px;margin:0}
.wrap{display:flex;flex-wrap:wrap;justify-content:center;align-items:flex-start;gap:16px}
.col{display:flex;flex-direction:column;gap:10px;width:min(390px,100%)}
.lead{color:var(--muted);margin:0}
.lead b{color:var(--ink)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
button:disabled{opacity:.35;cursor:default}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
.phone{position:relative;width:100%;height:700px;background:var(--phone);border:2px solid var(--line);border-radius:30px;overflow:hidden;display:flex;flex-direction:column}
.tl{flex:1;display:flex;flex-direction:column;justify-content:flex-end;gap:8px;padding:14px}
.row{align-self:flex-end;background:var(--soft);border-radius:12px;padding:5px 10px}
.day{text-align:center;color:var(--muted);font-size:11px}
.comp{border-top:1px solid var(--line);padding:8px 12px 14px;display:flex;gap:6px;align-items:center;color:var(--muted);font-size:12px}
.comp span{border:1px solid var(--line);border-radius:999px;padding:4px 10px}
.comp .in{flex:1}
.comp .hot{border:2px solid var(--ink);color:var(--ink);font-weight:700}
.scrim{position:absolute;inset:0;background:var(--scrim)}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--phone);border-radius:16px 16px 0 0;display:flex;flex-direction:column}
.sb{display:flex;justify-content:space-between;align-items:center;padding:12px 14px}
.sb b{font-weight:700}
.sb button{color:var(--accent);min-width:70px}
.sb .rec{text-align:right;font-weight:700}
.val{display:flex;justify-content:center;align-items:baseline;gap:6px;padding:6px 0 2px}
.v{font-size:40px;font-weight:700;padding:0 6px;border-radius:6px}
.v.sel{background:color-mix(in srgb,var(--accent) 22%,transparent)}
.v.caret{border-bottom:2px solid var(--accent)}
.sub{text-align:center;font-size:11px;color:var(--muted);padding-bottom:12px}
.kb{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:8px;background:var(--soft)}
.kb button{background:var(--phone);border-radius:8px;height:44px;font-size:18px}
.step{display:flex;justify-content:center;align-items:center;gap:18px;padding:6px 0 4px}
.step button.pm{width:64px;height:48px;border:1.5px solid var(--line);border-radius:12px;font-size:24px;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.wheel{display:flex;justify-content:center;gap:4px;padding:6px 0 18px;position:relative}
.wheel .c{height:150px;width:84px;overflow-y:scroll;scroll-snap-type:y mandatory;scrollbar-width:none;text-align:center;font-size:22px;mask-image:linear-gradient(transparent,#000 35%,#000 65%,transparent)}
.wheel .c::-webkit-scrollbar{display:none}
.wheel .c div{height:40px;line-height:40px;scroll-snap-align:center}
.wheel .band{position:absolute;left:50%;transform:translateX(-50%);top:61px;width:220px;height:40px;border-radius:10px;background:var(--soft);pointer-events:none}
.wheel .c,.wheel .u{position:relative}
.wheel .u{align-self:center;font-size:18px}
.state{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--phone);display:flex;flex-direction:column;gap:6px}
.state>b{font-size:12px;letter-spacing:.06em;color:var(--muted)}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opts button{border:1px solid var(--line);border-radius:999px;padding:4px 10px}
.opts button[aria-pressed="true"]{background:var(--ink);color:var(--phone);border-color:var(--ink)}
.big{font-size:22px;font-weight:700}
table{border-collapse:collapse;width:100%}
td,th{border-top:1px solid var(--soft);padding:4px 2px;text-align:left;font-weight:400}
th{color:var(--muted);font-size:11px}
.dock{position:fixed;left:0;right:0;bottom:0;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;pointer-events:none}
.dock nav{pointer-events:auto;display:flex;gap:4px;background:var(--pill);color:var(--pill-ink);border-radius:999px;padding:5px}
.dock button{color:var(--pill-ink);padding:7px 14px;border-radius:999px}
.dock button[aria-pressed="true"]{background:var(--pill-ink);color:var(--pill)}
</style>

<div class="wrap">
  <div class="col">
    <p class="lead" id="lead"></p>
    <div class="phone" id="phone"></div>
  </div>
  <div class="col">
    <div class="state">
      <b>今朝の体重計</b>
      <div class="opts" id="targets"></div>
      <div class="muted" id="tnote"></div>
    </div>
    <div class="state">
      <b>いまの操作</b>
      <div><span class="big num" id="ops">0</span> 回（記録を含む）</div>
      <div class="muted" id="result"></div>
    </div>
    <div class="state">
      <b>記録した結果</b>
      <table class="num"><thead><tr><th>案</th><th>体重計</th><th>記録</th><th>操作</th></tr></thead><tbody id="log"><tr><td colspan="4" class="muted">まだありません</td></tr></tbody></table>
    </div>
    <p class="lead">前回の記録は 72.6 kg。入力欄の「体重」を押してシートを開き、右で選んだ体重計の値にして記録する。「体重」を押すのも1回に数える。B は長押しで 0.1 ずつ続けて動き、長押し1回を1回に数える。C は1回回すごとに1回に数える。</p>
  </div>
</div>
<div class="dock"><nav aria-label="案の切り替え"><button id="vA">A キーボード</button><button id="vB">B ステッパー</button><button id="vC">C ホイール</button></nav></div>

<script>
const PREV=72.6;
const targets=[[72.4,'前日から −0.2（ふつうの朝）'],[71.9,'前日から −0.7'],[73.8,'飲み会の翌朝、+1.2'],[70.9,'5日空いたあと、−1.7']];
const st={v:'A',open:false,val:PREV,typed:null,sel:true,kb:false,ops:0,target:72.4,log:[]};
const $=id=>document.getElementById(id);
const fmt=x=>x.toFixed(1);
function cur(){return st.typed!==null?st.typed:fmt(st.val)}
function valid(){const s=cur();return /^\d{2,3}(\.\d)?$/.test(s)}
function sheetHTML(){
  let body='';
  const showKb=st.v==='A'||st.kb;
  const vcls=showKb?(st.sel?'v sel':'v caret'):'v';
  if(st.v==='C'){
    body='<div class="wheel"><span class="band"></span><div class="c" id="wi"></div><div class="c" id="wd" style="width:60px"></div><span class="u">kg</span></div>';
  }else{
    const valEl=st.v==='B'&&!st.kb?'<button class="v num" id="tapv" aria-label="数字で入れる">'+cur()+'</button>':'<span class="'+vcls+' num">'+cur()+'</span>';
    body='<div class="val">'+valEl+'<span style="font-size:20px">kg</span></div>';
    if(st.v==='B'&&!st.kb) body='<div class="step"><button class="pm" id="minus" aria-label="0.1 kg 減らす">−</button>'+body.replace('class="val"','class="val" style="padding:0"')+'<button class="pm" id="plus" aria-label="0.1 kg 増やす">+</button></div>';
  }
  body+='<div class="sub">前回 9/23（水）72.6 kg'+(st.v==='B'&&!st.kb?'　数字を押すとキーボード':'')+'</div>';
  if(showKb&&st.v!=='C') body+='<div class="kb">'+['1','2','3','4','5','6','7','8','9','.','0','⌫'].map(k=>'<button data-k="'+k+'">'+k+'</button>').join('')+'</div>';
  else body+='<div style="height:24px"></div>';
  return '<div class="scrim" id="cancelScrim"></div><div class="sheet"><div class="sb"><button id="cancel" style="text-align:left">キャンセル</button><b>体重</b><button class="rec" id="rec"'+(valid()?'':' disabled')+'>記録</button></div>'+body+'</div>';
}
function render(){
  const recorded=st.log.filter(r=>r.v===st.v).length&&!st.open;
  $('phone').innerHTML='<div class="tl"><div class="day">昨日 9/23（水）</div><div class="row num">体重 72.6 kg ›</div><div class="day">今日 9/24（木）</div>'+(st.done?'<div class="row num">体重 '+st.done+' kg ›</div>':'')+'</div><div class="comp"><span>撮る</span><button id="open"><span class="'+(st.done?'':'hot')+'" style="display:inline-block;border-radius:999px;padding:4px 10px;'+(st.done?'border:1px solid var(--line)':'')+'">体重</span></button><span class="in">書く</span><span>送る</span></div>'+(st.open?sheetHTML():'');
  if(st.open&&st.v==='C') buildWheel();
  $('ops').textContent=st.ops;
  $('lead').innerHTML={A:'<b>A キーボード</b>　前回の値を選んだ状態で開き、数字のキーボードを出す。打つと置き換わる',B:'<b>B ステッパー</b>　前回の値の両側に − と +（0.1 kg ずつ、長押しで続けて）。数字を押すとキーボードに変わる',C:'<b>C ホイール</b>　kg と小数の2本のホイールを回す。初期位置は前回の値'}[st.v];
  $('targets').innerHTML=targets.map(([t,n])=>'<button aria-pressed="'+(st.target===t)+'" data-t="'+t+'" class="num">'+fmt(t)+' kg</button>').join('');
  $('tnote').textContent=targets.find(t=>t[0]===st.target)[1];
  ['A','B','C'].forEach(k=>$('v'+k).setAttribute('aria-pressed',st.v===k));
  $('log').innerHTML=st.log.length?st.log.map(r=>'<tr><td>'+r.v+'</td><td>'+fmt(r.t)+'</td><td>'+r.r+(Math.abs(+r.r-r.t)<0.05?'':' ✗')+'</td><td>'+r.o+'</td></tr>').join(''):'<tr><td colspan="4" class="muted">まだありません</td></tr>';
}
function buildWheel(){
  const wi=$('wi'),wd=$('wd');
  const ints=[];for(let i=40;i<=150;i++)ints.push(i);
  wi.innerHTML='<div></div>'+ints.map(i=>'<div>'+i+'</div>').join('')+'<div></div>';
  wd.innerHTML='<div></div>'+[...Array(10).keys()].map(d=>'<div>.'+d+'</div>').join('')+'<div></div>';
  const [ip,dp]=fmt(st.val).split('.');
  wi.scrollTop=(+ip-40)*40;wd.scrollTop=(+dp)*40;
  let t1,t2,moved1=false,moved2=false;
  const settle=()=>{st.val=(40+Math.round(wi.scrollTop/40))+Math.round(wd.scrollTop/40)/10;$('rec').disabled=false};
  setTimeout(()=>{
  wi.addEventListener('scroll',()=>{if(!moved1){moved1=true;st.ops++;$('ops').textContent=st.ops}clearTimeout(t1);t1=setTimeout(()=>{moved1=false;settle()},180)});
  wd.addEventListener('scroll',()=>{if(!moved2){moved2=true;st.ops++;$('ops').textContent=st.ops}clearTimeout(t2);t2=setTimeout(()=>{moved2=false;settle()},180)});
  },250);
}
function reset(){st.open=false;st.val=PREV;st.typed=null;st.sel=true;st.kb=false;st.ops=0;st.done=null}
let hold=null,holdMoved=false;
function stepBy(d){st.val=Math.round((st.val+d)*10)/10;const v=document.querySelector('.v');if(v)v.textContent=fmt(st.val)}
document.addEventListener('pointerdown',e=>{
  const b=e.target.closest('#minus,#plus');if(!b)return;
  const d=b.id==='plus'?0.1:-0.1;st.ops++;$('ops').textContent=st.ops;stepBy(d);
  hold=setTimeout(function rep(){stepBy(d);hold=setTimeout(rep,90)},450);
});
['pointerup','pointerleave','pointercancel'].forEach(ev=>document.addEventListener(ev,()=>{clearTimeout(hold);hold=null}));
document.addEventListener('click',e=>{
  const t=e.target;
  if(t.closest('[data-t]')){st.target=+t.closest('[data-t]').dataset.t;reset();render();return}
  if(t.closest('#open')&&!st.open){reset();st.open=true;st.ops=1;render();return}
  if(t.closest('#cancel')||t.closest('#cancelScrim')){st.open=false;render();return}
  if(t.closest('#tapv')){st.kb=true;st.sel=true;st.typed=null;st.ops++;render();return}
  const k=t.closest('[data-k]');
  if(k){st.ops++;const c=k.dataset.k;let s=st.sel?'':cur();st.sel=false;
    if(c==='⌫')s=s.slice(0,-1);else if(s.length<5&&!(c==='.'&&s.includes('.'))&&!(/\.\d$/.test(s)))s+=c;
    st.typed=s;render();return}
  if(t.closest('#rec')){st.ops++;const r=cur();st.log.unshift({v:st.v,t:st.target,r:(+r).toFixed(1),o:st.ops});const o=st.ops;st.open=false;st.done=(+r).toFixed(1);render();$('ops').textContent=o;$('result').textContent=Math.abs(+r-st.target)<0.05?'体重計どおりに記録できた':'体重計と違う値で記録した';return}
});
function setV(v){st.v=v;reset();$('result').textContent='';try{history.replaceState(null,'','#'+v)}catch(_){location.hash=v}render()}
$('vA').onclick=()=>setV('A');$('vB').onclick=()=>setV('B');$('vC').onclick=()=>setV('C');
document.addEventListener('keydown',e=>{const o=['A','B','C'];if(e.key==='ArrowRight')setV(o[(o.indexOf(st.v)+1)%3]);if(e.key==='ArrowLeft')setV(o[(o.indexOf(st.v)+2)%3])});
st.v=['#B','#C'].includes(location.hash)?location.hash[1]:'A';render();
</script>
