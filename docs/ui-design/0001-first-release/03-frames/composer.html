<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>入力欄</title><style>
:root{--line:#888;--fg:#222;--bg:#fff;--muted:#777}
@media (prefers-color-scheme: dark){:root{--line:#999;--fg:#ddd;--bg:#1a1a1a;--muted:#aaa}}
body{margin:0;padding:16px;font:13px/1.5 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
h1{font-size:15px;margin:0 0 4px}
p.note{margin:0 0 12px;color:var(--muted);max-width:390px}
.phone{width:min(390px,100%);height:760px;border:2px solid var(--line);border-radius:28px;display:flex;flex-direction:column;overflow:hidden;box-sizing:border-box}
.bar{border-bottom:1px solid var(--line);padding:10px 14px;display:flex;justify-content:space-between;gap:8px}
.body{flex:1;overflow:auto;padding:10px;display:flex;flex-direction:column;gap:8px}
.box{border:1px dashed var(--line);border-radius:8px;padding:8px}
.box .t{font-weight:600}
.box .d{color:var(--muted)}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.act{border:1px solid var(--line);border-radius:6px;padding:2px 8px}
.tabs{border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:10px 0}
.tabs .on{font-weight:700;text-decoration:underline}
.sheet{margin-top:auto;border-top:2px solid var(--line);border-radius:16px 16px 0 0;padding:10px;display:flex;flex-direction:column;gap:8px}
.dim{flex:1;border:1px dashed var(--line);margin:10px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--muted)}
</style></head><body>
<h1>入力欄（枠組みワイヤー）</h1><p class="note">単位ビュー「入力欄」。タイムラインの下に固定する。記録（撮る、体重、文章）と会話をここから始める。書いて送った文章は、食事の記録か会話かをアプリが読み分ける。UC: 食事_1,4,15 体重_1 フィードバック_1,2</p>
<div class="phone"><div class="dim">タイムライン</div><div class="body" style="flex:none;border-top:1px solid var(--line)"><div class="box"><div class="t">プリセット</div><div class="d">ここまでの食事のフィードバック／次の食事のアドバイス。常に並べる</div><div class="acts"><span class="act">選ぶ</span></div></div><div class="box"><div class="t">撮る</div><div class="d">全画面のカメラを開く。撮っておいた写真は、カメラの中の「写真を選ぶ」から選ぶ</div><div class="acts"><span class="act">撮る</span></div></div><div class="box"><div class="t">体重</div><div class="d">その日が未記録のあいだは目立たせる</div><div class="acts"><span class="act">体重へ</span></div></div><div class="box"><div class="t">書く</div><div class="d">食べたものでも、何でもよい。食事として読んだときは「会話として送り直す」を添える</div><div class="acts"><span class="act">送る</span></div></div></div></div></body></html>
