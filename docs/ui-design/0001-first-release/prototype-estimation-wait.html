<title>推定を待つあいだの見せ方</title>
<!-- PROTOTYPE（捨てる前提）。gn-t-k/nu-tori#365 の仕様の前に、推定を待っている食事と料理で止めた操作の見せ方を並べる。CSS は prototype/0001-meal-edit の試作（コミット ee496d3）から写した。main には入れない。 -->
<style>
/*
  nu-tori のコンポーネントの共通の見た目。トークンと、iOS の標準の部品を HTML で写したもの。
  実装では SwiftUI の標準の部品とシステムの色を使う。ここの値はその見本で、対応は README.md の「ルック&フィール」。
*/

/* ── トークン（ライト） ── */
:root{
  /* iOS のシステムの色 */
  --bg:#f2f2f7;            /* systemGroupedBackground */
  --surface:#ffffff;       /* secondarySystemGroupedBackground */
  --surface2:#f2f2f7;      /* tertiarySystemGroupedBackground */
  --ink:#000000;           /* label */
  --ink2:rgb(60 60 67 / .6);   /* secondaryLabel */
  --ink3:rgb(60 60 67 / .3);   /* tertiaryLabel */
  --sep:rgb(60 60 67 / .29);   /* separator */
  --fill:rgb(120 120 128 / .12); /* tertiarySystemFill */
  --tint:#6155f5;          /* アクセント（systemIndigo） */
  --on-tint:#ffffff;
  --destructive:#ff383c;   /* systemRed。破壊的な操作だけに使う */
  --scrim:rgb(0 0 0 / .2);
  --chrome:rgb(249 249 249 / .94); /* バーの材質 */
  /* P・F・C（3色のどの組も色覚の型を問わず見分けられる。validate_palette で確認） */
  --p:#f07f1a; --f:#15803d; --c:#2c7be5;
  --track:#e5e5ea;         /* 輪の地 */
  /* グラフ */
  --series:#6155f5; --grid:rgb(60 60 67 / .12); --guide:rgb(60 60 67 / .45);
  /* 自分の発言 */
  --me:#6155f5; --on-me:#ffffff;
  /* ページ（コンポーネントの見本を並べる地） */
  --page:#e4e5ea; --page-ink:#1c1c1e; --page-muted:#6c6c70; --frame:#c7c7cc;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#000000; --surface:#1c1c1e; --surface2:#2c2c2e;
    --ink:#ffffff; --ink2:rgb(235 235 245 / .6); --ink3:rgb(235 235 245 / .3);
    --sep:rgb(84 84 88 / .6); --fill:rgb(118 118 128 / .24);
    --tint:#6d7cff; --on-tint:#ffffff; --destructive:#ff4245; --scrim:rgb(0 0 0 / .5); --chrome:rgb(22 22 24 / .94);
    --p:#e8903a; --f:#228c48; --c:#4290f4; --track:#2c2c2e;
    --series:#6d7cff; --grid:rgb(235 235 245 / .12); --guide:rgb(235 235 245 / .45);
    --me:#6d7cff; --on-me:#ffffff;
    --page:#0c0c0d; --page-ink:#e5e5ea; --page-muted:#98989f; --frame:#3a3a3c;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#000000; --surface:#1c1c1e; --surface2:#2c2c2e;
  --ink:#ffffff; --ink2:rgb(235 235 245 / .6); --ink3:rgb(235 235 245 / .3);
  --sep:rgb(84 84 88 / .6); --fill:rgb(118 118 128 / .24);
  --tint:#6d7cff; --on-tint:#ffffff; --destructive:#ff4245; --scrim:rgb(0 0 0 / .5); --chrome:rgb(22 22 24 / .94);
  --p:#e8903a; --f:#228c48; --c:#4290f4; --track:#2c2c2e;
  --series:#6d7cff; --grid:rgb(235 235 245 / .12); --guide:rgb(235 235 245 / .45);
  --me:#6d7cff; --on-me:#ffffff;
  --page:#0c0c0d; --page-ink:#e5e5ea; --page-muted:#98989f; --frame:#3a3a3c;
  color-scheme:dark;
}

/* ── 文字（iOS のテキストスタイル。Dynamic Type の既定の大きさ） ── */
:root{
  --font:system-ui,-apple-system,"SF Pro Text","Hiragino Sans","Hiragino Kaku Gothic ProN",sans-serif;
  --t-title2:22px;   /* Title 2（大きな数字） */
  --t-title3:20px;   /* Title 3 */
  --t-headline:17px; /* Headline（600） */
  --t-body:17px;     /* Body */
  --t-callout:16px;  /* Callout */
  --t-sub:15px;      /* Subheadline */
  --t-foot:13px;     /* Footnote */
  --t-cap:12px;      /* Caption 1 */
  --t-cap2:11px;     /* Caption 2 */
}

/* ── 見本を並べるページ ── */
*{box-sizing:border-box}
body{margin:0;padding:16px 16px 40px;background:var(--page);color:var(--page-ink);font:14px/1.5 var(--font)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--tint);outline-offset:2px;border-radius:6px}
.num{font-variant-numeric:tabular-nums}
.sheet-head,.page-head{max-width:1280px;margin:0 auto 14px}
.page-head h1{font-size:17px;margin:0}
.page-head p{margin:2px 0 0;color:var(--page-muted);max-width:720px}
.states{max-width:1280px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(360px,100%),1fr));gap:20px;align-items:start}
figure{margin:0;display:flex;flex-direction:column;gap:6px;min-width:0}
figcaption{color:var(--page-muted);font-size:12.5px}
figcaption b{color:var(--page-ink)}

/* ── 電話の枠 ── */
.phone{position:relative;height:680px;background:var(--bg);color:var(--ink);border:1px solid var(--frame);border-radius:38px;overflow:hidden;display:flex;flex-direction:column;font-size:var(--t-body);line-height:1.3}
.phone.short{height:520px}
.status{height:34px;flex:none}
.home{height:22px;flex:none}

/* ナビゲーションバー */
.nav{height:44px;flex:none;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 12px;background:var(--bg)}
.nav .l{justify-self:start;color:var(--tint);display:flex;align-items:center;gap:2px;font-size:var(--t-body)}
.nav .l .chev{font-size:24px;line-height:1;margin-top:-2px}
.nav .t{font-size:var(--t-headline);font-weight:600;text-align:center;white-space:nowrap}
.nav .r{justify-self:end;color:var(--tint);font-size:var(--t-body)}
.nav .r.b,.nav .l.b{font-weight:600}
.nav.sep{border-bottom:.5px solid var(--sep)}
.large-title{font-size:34px;font-weight:700;padding:2px 16px 8px}

/* 本文のスクロール域 */
.scroll{flex:1;overflow:hidden;display:flex;flex-direction:column;gap:24px;padding:12px 16px 16px}
.scroll > *{flex:none}

/* グループの一覧（Inset Grouped） */
.group-h{font-size:var(--t-foot);color:var(--ink2);text-transform:none;padding:0 16px 6px;margin:0}
.group-f{font-size:var(--t-foot);color:var(--ink2);padding:6px 16px 0;margin:0}
.list{background:var(--surface);border-radius:10px;overflow:hidden}
.list > .cell{display:flex;align-items:center;gap:12px;min-height:44px;padding:11px 16px;position:relative;font-size:var(--t-body)}
.list > .cell + .cell::before{content:"";position:absolute;top:0;left:16px;right:0;border-top:.5px solid var(--sep)}
.cell .grow{flex:1;min-width:0}
.cell .val{color:var(--ink2);text-align:right}
.cell .disc{color:var(--ink3);font-size:18px;line-height:1;margin-left:2px}
.cell.link{color:var(--tint)}
.cell.danger{color:var(--destructive);justify-content:center}
.cell .sub{display:block;color:var(--ink2);font-size:var(--t-foot)}

/* 押して直せる値（iOS の編集できる値と同じく、アクセントの色で示す） */
.edit{color:var(--tint)}
/* 推定の印 */
.est{display:inline-block;font-size:var(--t-cap2);color:var(--ink2);border:.5px solid var(--ink3);border-radius:4px;padding:0 4px;margin-left:6px;vertical-align:1px;line-height:1.5}

/* ボタン */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;padding:0 16px;border-radius:999px;font-size:var(--t-sub);font-weight:600}
.btn.filled{background:var(--tint);color:var(--on-tint)}
.btn.tinted{background:color-mix(in srgb,var(--tint) 15%,transparent);color:var(--tint)}
.btn.gray{background:var(--fill);color:var(--tint)}
.btn.large{height:50px;border-radius:12px;font-size:var(--t-body);width:100%}
.btn.plain{height:auto;padding:0;color:var(--tint);font-weight:400;font-size:var(--t-body)}
.btn[aria-disabled="true"]{opacity:.35}

/* 値の欄 */
.field{background:var(--fill);border-radius:10px;padding:11px 12px;font-size:var(--t-body);display:flex;justify-content:space-between;gap:8px}
.field.focus{box-shadow:0 0 0 2px var(--tint) inset;background:var(--surface)}
.field .ph{color:var(--ink3)}

/* ステッパー（体重） */
.stepper{display:flex;align-items:center;gap:12px}
.stepper .pm{width:48px;height:44px;border-radius:10px;background:var(--fill);color:var(--tint);font-size:22px;display:grid;place-items:center;flex:none}
.stepper .v{flex:1;text-align:center;font-size:28px;font-weight:600;font-variant-numeric:tabular-nums}
.stepper .v small{font-size:var(--t-sub);font-weight:400;color:var(--ink2);margin-left:3px}

/* シート */
.scrim{position:absolute;inset:0;background:var(--scrim);display:flex;flex-direction:column;justify-content:flex-end}
.sheet{background:var(--bg);border-radius:12px 12px 0 0;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 -1px 0 var(--sep)}
.sheet.large{position:absolute;inset:44px 0 0}
.sheet .grab{width:36px;height:5px;border-radius:3px;background:var(--ink3);align-self:center;margin:6px 0 2px;flex:none}

/* アクションシート・アラート */
.action{margin:0 8px 8px;display:flex;flex-direction:column;gap:8px}
.action .grp{background:var(--chrome);border-radius:14px;overflow:hidden;text-align:center}
.action .msg{padding:13px 16px;font-size:var(--t-foot);color:var(--ink2)}
.action .a{padding:17px;font-size:20px;color:var(--tint);border-top:.5px solid var(--sep)}
.action .a.danger{color:var(--destructive)}
.action .a.cancel{font-weight:600;border-top:0}
.alert-wrap{position:absolute;inset:0;background:var(--scrim);display:grid;place-items:center}
.alert{width:270px;background:var(--chrome);border-radius:14px;overflow:hidden;text-align:center}
.alert .ab{padding:18px 16px 16px;display:flex;flex-direction:column;gap:4px}
.alert .ab b{font-size:var(--t-headline)}
.alert .ab span{font-size:var(--t-foot)}
.alert .bt{display:grid;grid-template-columns:1fr 1fr;border-top:.5px solid var(--sep)}
.alert .bt span{padding:11px;font-size:var(--t-body);color:var(--tint)}
.alert .bt span + span{border-left:.5px solid var(--sep)}
.alert .bt .danger{color:var(--destructive);font-weight:600}

/* 1日の丸（1本の輪を P・F・C で色分け）。SVG は ring() が描く */
.ring{position:relative;display:inline-block;flex:none}
.ring svg{display:block}
.ring .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1;text-align:center}

/* P・F・C の見出しの色の印 */
.key{display:inline-block;width:9px;height:9px;border-radius:2px;vertical-align:0}
.key.p{background:var(--p)} .key.f{background:var(--f)} .key.c{background:var(--c)}

/* 推定中 */
.loading{display:flex;align-items:center;gap:8px;color:var(--ink2);font-size:var(--t-sub)}
.spinner{width:16px;height:16px;border-radius:50%;border:2px solid var(--ink3);border-top-color:var(--ink2);animation:spin 1s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.spinner{animation:none}}

/* グラフ */
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart text{fill:var(--ink2);font-size:10px;font-family:var(--font)}


/* ── 試作のページ ── */
body{padding-bottom:104px}
.intro{max-width:1280px;margin:0 auto 12px;display:flex;flex-direction:column;gap:8px}
.intro h1{font-size:20px;margin:0;text-wrap:balance}
.intro p{margin:0;color:var(--page-muted);max-width:760px}
.topics{max-width:1280px;margin:0 auto 20px;display:flex;flex-wrap:wrap;gap:6px}
.topics button{font-size:13px;padding:6px 12px;border-radius:999px;background:var(--surface);color:var(--page-ink);box-shadow:0 0 0 .5px var(--frame)}
.topics button[aria-current="true"]{background:var(--tint);color:var(--on-tint);box-shadow:none}
.topic{max-width:1280px;margin:0 auto}
.topic > h2{font-size:17px;margin:0 0 4px;text-wrap:balance}
.topic > .q{margin:0 0 4px;max-width:760px}
.topic > .fixed{margin:0 0 16px;max-width:760px;color:var(--page-muted);font-size:13px}
.vhead{max-width:1280px;margin:0 auto 12px;display:flex;flex-direction:column;gap:2px}
.vhead b{font-size:15px}
.vhead span{color:var(--page-muted);font-size:13px;max-width:760px}
.variant .states{margin:0}

/* 切り替えのバー（試作の道具。設計の一部ではない） */
.switcher{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom, 0px));transform:translateX(-50%);display:flex;align-items:center;gap:4px;padding:4px;border-radius:999px;background:var(--page-ink);color:var(--page);box-shadow:0 6px 24px rgb(0 0 0 / .25);z-index:10;max-width:calc(100% - 32px)}
.switcher button{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:20px;color:var(--page)}
.switcher button:hover{background:color-mix(in srgb,var(--page) 15%,transparent)}
.switcher .lab{padding:0 10px;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.switcher .lab b{font-weight:700;margin-right:6px}
/* ── アカウント（07-components/account から） ── */
.phone.tall{height:900px}
.phone.mid{height:760px}
.behind{position:absolute;inset:0;display:flex;flex-direction:column}
.sheet .nav{background:var(--bg)}
.list > .cell.stack{flex-direction:column;align-items:stretch;gap:4px}
.cell .kv{font-size:var(--t-foot);color:var(--ink2);line-height:1.4}
.cell .kv b{color:var(--ink);font-weight:400}
.cell .ext{margin-left:auto;font-size:var(--t-foot)}
.cell.info{gap:10px;font-size:var(--t-foot);color:var(--ink);align-items:flex-start}
.cell.info svg{flex:none;margin-top:1px}
.cell.danger[aria-disabled="true"]{opacity:.35}
.alert .bt.stack{grid-template-columns:1fr}
.alert .bt.stack span + span{border-left:0;border-top:.5px solid var(--sep)}
.alert .bt.stack .cancel{font-weight:400}
.alert .ab span + span{margin-top:6px}
.toggle{width:51px;height:31px;border-radius:999px;background:var(--switch);position:relative;flex:none}
.toggle::after{content:"";position:absolute;top:2px;right:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgb(0 0 0 / .25)}
.sec-err{font-size:var(--t-foot);color:var(--ink);padding:0 16px 6px;margin:0;line-height:1.4}
.push-t{font-size:var(--t-foot);color:var(--ink2);padding:0 16px;margin:0;line-height:1.45}

:root{--switch:#34c759}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--switch:#30d158}}
:root[data-theme="dark"]{--switch:#30d158}
code{font:12px ui-monospace,SFMono-Regular,Menlo,monospace}
:root{--ring-gray:#aeaeb2}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--ring-gray:#636366}}
:root[data-theme="dark"]{--ring-gray:#636366}

/* ── main のタイムライン（ios/NuTori/Timeline の形） ── */
.nav .r .person{width:30px;height:30px;border-radius:50%;background:var(--fill);color:var(--tint);display:grid;place-items:center}
/* 帯（DayRingStrip）: 曜日の1文字、見ている日は Fill の地、まだ来ていない日は 0.45、使い始める前の日は丸を描かない */
.band{display:flex;padding:0 16px 12px;border-bottom:.5px solid var(--sep);flex:none;background:var(--bg)}
.band .day{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:52px;font-size:var(--t-cap2);color:var(--ink2);border-radius:10px}
.band .day.sel{background:var(--fill);color:var(--ink);font-weight:600}
.band .day.future{opacity:.45}
.band .day.before{color:var(--ink3)}
.band .day .nor{width:28px;height:28px}
.band .day.hl{box-shadow:0 0 0 2px var(--tint) inset}
/* タイムライン（TimelineScreen）: 日の見出しは左寄せの Footnote、記録は右に寄せる */
.tl{flex:1;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;gap:8px;padding:12px 16px}
.tl > *{flex:none}
.tl.top{justify-content:flex-start}
.dayh{font-size:var(--t-foot);color:var(--ink2);margin-top:8px}
.dayh:first-child{margin-top:0}
.started{font-size:var(--t-foot);color:var(--ink2)}
/* 体重の行（WeightRecordRow）: 中身の幅、Primary を 15% で敷く、角 12、› */
.wrow{align-self:flex-end;display:flex;align-items:center;gap:8px;padding:16px;border-radius:12px;background:color-mix(in srgb,var(--tint) 15%,transparent);font-size:var(--t-sub);font-variant-numeric:tabular-nums}
.disc{color:var(--ink3);font-size:var(--t-cap);flex:none}
/* 食事のカード。中身は 07-components/timeline の食事のカード。地は体重の行と同じ濃さ */
.mc{align-self:flex-end;max-width:86%;display:flex;gap:12px;align-items:center;padding:12px 16px 12px 12px;border-radius:12px;background:color-mix(in srgb,var(--tint) 15%,transparent);position:relative}
.mc.w86{width:86%}
.mc .bd{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.mc .top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-size:var(--t-sub)}
.mc .top b{font-weight:600}
.mc .k{font-variant-numeric:tabular-nums;white-space:nowrap;font-size:var(--t-foot);color:var(--ink2)}
.mc .pfc{display:flex;flex-wrap:wrap;gap:2px 8px;font-size:var(--t-cap);color:var(--ink2);font-variant-numeric:tabular-nums}
.mc .pfc b{color:var(--ink);font-weight:600}
.mc .pfc > *{white-space:nowrap}
.mc .st{font-size:var(--t-foot);color:var(--ink2);line-height:1.35}
.mc .st b{color:var(--ink);font-weight:400}
.mc .add{font-size:var(--t-foot);color:var(--tint)}
.mc .shot{font-size:var(--t-cap);color:var(--ink2);white-space:nowrap}
.mc.hl{box-shadow:0 0 0 2px var(--tint)}
/* 写真の縮小（色の四角で仮置き） */
.ph{width:64px;height:64px;border-radius:8px;flex:none;position:relative;background:linear-gradient(135deg,#c79a63,#8a6238 55%,#e6d2ac)}
.ph.b{background:linear-gradient(135deg,#e7c889,#b87a3a 60%,#f1e3c2)}
.ph.c{background:linear-gradient(135deg,#9bb07a,#e0c8a0 50%,#c26a3a)}
.ph.d{background:linear-gradient(135deg,#d8b36a,#a0512d 55%,#f0dcb4)}
.ph.e{background:linear-gradient(135deg,#7a9a6b,#d9c9a3 45%,#8c5a3c)}
.ph.none{background:var(--fill);display:grid;place-items:center;color:var(--ink3)}
.ph .mark{position:absolute;right:4px;bottom:4px;min-width:20px;height:20px;padding:0 5px;border-radius:999px;background:rgb(0 0 0 / .55);color:#fff;font-size:var(--t-cap2);display:grid;place-items:center;font-weight:600}
.ph .over{position:absolute;inset:0;border-radius:8px;background:rgb(0 0 0 / .45);color:#fff;display:grid;place-items:center;font-size:var(--t-cap2);font-weight:600;text-align:center;line-height:1.2}
/* 重ねた2枚 */
.stack2{position:relative;width:72px;height:68px;flex:none}
.stack2 .ph{position:absolute}
.stack2 .ph:first-child{right:0;top:0;width:58px;height:58px;opacity:.9}
.stack2 .ph:last-child{left:0;bottom:0;box-shadow:0 0 0 2px var(--surface)}
/* 写真を上に大きく */
.mc.big{flex-direction:column;align-items:stretch;padding:6px;gap:0;width:72%}
.mc.big .pics{display:flex;gap:4px}
.mc.big .pics .ph{flex:1;width:auto;height:150px;border-radius:8px}
.mc.big .pics.two .ph{height:120px}
.mc.big .row2{display:flex;align-items:center;gap:8px;padding:10px 10px 6px}
.dots{display:flex;gap:5px;justify-content:center;position:absolute;left:0;right:0;bottom:62px}
.dots i{width:6px;height:6px;border-radius:50%;background:rgb(255 255 255 / .55)}
.dots i:first-child{background:#fff}
.mc.big .ph.none{height:150px}
/* 推定中 */
.loading{display:flex;align-items:center;gap:8px;color:var(--ink2);font-size:var(--t-foot)}
.spinner.s{width:14px;height:14px}

/* 入力欄（TimelineScreen の composer）: バーの材質の上に 44 の丸いボタン */
.comp{display:flex;align-items:center;gap:12px;padding:8px 16px;flex:none;background:var(--chrome);border-top:.5px solid var(--sep)}
.comp.center{justify-content:center}

<header class="intro">
  <h1>推定を待っている食事と料理の見せ方</h1>
  <p>PROTOTYPE（捨てる前提）。「推定中の食事は、消すことだけできるようにする」（gn-t-k/nu-tori#365）の仕様の前に、止めた操作をどう見せるかを並べた試作。上の論点を選び、下のバーの ‹ › か矢印キーで案を切り替える。<code>#&lt;論点&gt;-&lt;案の番号&gt;</code>（例: <code>#dish-2</code>）で開ける。</p>
  <p>土台は main の画面のコード（<code>ios/NuTori/Meal/MealScreen.swift</code>・<code>ios/NuTori/Dish/DishScreen.swift</code>）。値はすべて作った値で、写真は色の四角で仮置き。</p>
</header>

<script>
const HOME = '<div class="home"></div>';
const NAV = (t = '食事', l = '9月24日（木）') => `<div class="nav"><span class="l"><span class="chev">‹</span>${l}</span><span class="t">${t}</span><span class="r"></span></div>`;

const scroll = x => `<div class="scroll">${x}</div>`;
const PHOTO = '<div class="photo short" role="img" aria-label="写真"></div>';
const TIME = '<div class="list"><div class="cell"><span class="grow">時刻</span><span class="num edit">9月24日（木）12:20</span></div></div>';
const TOT = (k = '—') => `<div class="list tot"><span class="k${k === '—' ? ' none' : ''}">${k}<small>kcal</small></span><div class="pfc"><span><span class="key p"></span> P<b>—</b> g</span><span><span class="key f"></span> F<b>—</b> g</span><span><span class="key c"></span> C<b>—</b> g</span></div></div>`;

const DISHDEL = '<div class="list"><div class="cell danger">この料理を削除</div></div>';
const H = t => `<p class="group-h">${t}</p>`;

// ── 論点1: 推定を待っている食事の画面 ──
const MEAL_STATES = [
  {key:'estimating', cap:'<b>推定中。</b>写真がそろい、推定しているところ。', list: `<div>${H('料理')}<div class="list"><div class="cell">${spin('推定しています…')}</div></div></div>`},
  {key:'deferred', cap:'<b>翌日に推定。</b>その日の推定の回数を使い切った。約1日このまま。', list: `<div>${H('料理')}<div class="list"><div class="cell" style="flex-direction:column;gap:4px;text-align:center"><b style="font-weight:600">明日、この写真を推定します。</b></div></div></div>`},
  {key:'notsent', cap:'<b>まだ送れていない（この端末で撮った）。</b>写真と時刻だけ。送れていないことは書かない（<code>DESIGN.md</code> の Don\'ts）。', list: ''},
];
const MEAL_VARIANTS = [
  {name:'隠すだけ', desc:'「料理を足す」を出さない。時刻と「食事を削除」だけが押せる。なぜ足せないかは書かない（推定が終われば出てくる）。',
   add: () => ''},
  {name:'隠して一言', desc:'「料理を足す」を出さず、その場所に「推定が終わると、料理を足せます。」の1行を置く。',
   add: s => `<div>${F('推定が終わると、料理を足せます。')}</div>`},
  {name:'押せない「料理を足す」', desc:'「料理を足す」を出したまま、システムの無効の表示（<code>.disabled</code>）にし、下に「推定が終わると足せます。」を添える。',
   add: s => `<div><div class="list"><div class="cell link off">料理を足す</div></div>${F('推定が終わると足せます。')}</div>`},
];

// ── 論点2: 推定し直しを待っている料理の画面 ──
const DISH_STATES = [
  {key:'estimating', cap:'<b>推定し直し中。</b>推定できた食事で、料理の名前を「鮭おにぎり」に直した。', name:'鮭おにぎり', note: spin('推定しています…')},
  {key:'deferred', cap:'<b>推定し直しが翌日に推定。</b>回数を使い切った。約1日このまま。', name:'から揚げ', note:'<span class="hint">今日はもう推定できないため、明日推定します</span>'},
  {key:'notsent', cap:'<b>足したばかり（まだ送れていない）。</b>送るとすぐ推定し直し中になる。送れていないことは書かない。', name:'味噌汁', note:''},
];
const DISH_VARIANTS = [
  {name:'値を文字で見せる', desc:'名前と量を押せない文字（ラベルの色）で見せ、量は「—」。材料と栄養は今までどおり隠す。押せるのは「この料理を削除」だけ。',
   body: s => `<div>${H('名前と量')}<div class="list"><div class="cell" style="flex-direction:column;align-items:stretch;gap:4px"><div style="display:flex"><span class="grow">名前</span><span class="plainv">${s.name}</span></div>${s.note}</div><div class="cell"><span class="grow">量</span><span class="dimv">—</span></div></div></div>` + DISHDEL},
  {name:'文字で見せて一言', desc:'1 に、名前と量の下へ「推定が終わると直せます。」を添える。',
   body: s => `<div>${H('名前と量')}<div class="list"><div class="cell" style="flex-direction:column;align-items:stretch;gap:4px"><div style="display:flex"><span class="grow">名前</span><span class="plainv">${s.name}</span></div>${s.note}</div><div class="cell"><span class="grow">量</span><span class="dimv">—</span></div></div>${F('推定が終わると直せます。')}</div>` + DISHDEL},
  {name:'押せない欄', desc:'名前と量の欄を出したまま、システムの無効の表示（<code>.disabled</code>）にする。今の画面との差がいちばん小さい。',
   body: s => `<div>${H('名前と量')}<div class="list"><div class="cell" style="flex-direction:column;align-items:stretch;gap:4px"><div style="display:flex;opacity:.45"><span class="grow">名前</span><span class="edit">${s.name}</span></div>${s.note}</div><div class="cell" style="opacity:.45"><span class="grow">量</span><span class="ph">—</span></div></div></div>` + DISHDEL},
];

const TOPICS = [
  {topic:'meal', label:'推定を待っている食事の画面',
   q:'写真待ち・推定中・翌日に推定の食事では、料理を足すことを止める（料理はまだ無いか、届いたばかり）。止めた「料理を足す」をどう見せるか。',
   fixed:'決まっていること: 時刻を直すことと「食事を削除」は、どの状態でも出す（#365 の決めたこと 4）。推定が終われば今までどおり。',
   variants: MEAL_VARIANTS.map(v => ({name:v.name, desc:v.desc, figs: MEAL_STATES.map(s => ({cap:s.cap, html: phone(NAV() + scroll(PHOTO + TIME + (s.key === 'notsent' ? '' : TOT()) + s.list + v.add(s) + DEL))}))}))},
  {topic:'dish', label:'推定し直しを待っている料理の画面',
   q:'推定できた食事の中で、推定し直し中・翌日に推定の料理（と、足したり名前を直したりして、まだ送れていない料理）は、この料理を消すことだけにする。名前と量をどう見せるか。',
   fixed:'決まっていること: 材料と栄養は今も推定し直しのあいだ隠している。食事の画面の料理の行は、左へ送って消すことだけ残る。ほかの料理と「料理を足す」は今までどおり。',
   variants: DISH_VARIANTS.map(v => ({name:v.name, desc:v.desc, figs: DISH_STATES.map(s => ({cap:s.cap, html: phone(NAV(s.name, '食事') + scroll(v.body(s)))}))}))},
];

const main = document.getElementById('main');
const nav = document.getElementById('topics');
main.innerHTML = TOPICS.map(t => `<section class="topic" data-topic="${t.topic}" data-label="${t.label}"><h2>${t.label}</h2><p class="q">${t.q}</p><p class="fixed">${t.fixed}</p>${t.variants.map((v, i) => `<div class="variant" data-v="${v.name}"><div class="vhead"><b>${String.fromCharCode(65 + i)}. ${v.name}</b><span>${v.desc}</span></div><div class="states">${v.figs.map(f => `<figure>${f.html}<figcaption>${f.cap}</figcaption></figure>`).join('')}</div></div>`).join('')}</section>`).join('');
const topics = [...main.querySelectorAll('.topic')];
let ti = 0, vi = 0;
topics.forEach((t, i) => {
  const b = document.createElement('button');
  b.type = 'button';
  b.textContent = `${i + 1}. ${t.dataset.label}`;
  b.addEventListener('click', () => show(i, 0, true));
  nav.appendChild(b);
});
function variants(){ return [...topics[ti].querySelectorAll('.variant')]; }
function show(t, v, sc){
  ti = (t + topics.length) % topics.length;
  const vs = variants();
  vi = (v + vs.length) % vs.length;
  topics.forEach((x, i) => { x.hidden = i !== ti; });
  vs.forEach((x, i) => { x.hidden = i !== vi; });
  [...nav.children].forEach((b, i) => b.setAttribute('aria-current', String(i === ti)));
  document.getElementById('lab').innerHTML = `<b>${String.fromCharCode(65 + vi)}</b>${vs[vi].dataset.v}（${vi + 1}/${vs.length}）`;
  try { history.replaceState(null, '', `#${topics[ti].dataset.topic}-${vi + 1}`); } catch (e) {}
  if (sc) topics[ti].scrollIntoView({block: 'start'});
}
document.getElementById('prev').addEventListener('click', () => show(ti, vi - 1));
document.getElementById('next').addEventListener('click', () => show(ti, vi + 1));
document.addEventListener('keydown', e => {
  if (e.target.closest('input,textarea,[contenteditable]')) return;
  if (e.key === 'ArrowLeft') show(ti, vi - 1);
  if (e.key === 'ArrowRight') show(ti, vi + 1);
});
(() => {
  const m = location.hash.match(/^#([a-z-]+?)-(\d+)$/);
  const t = m ? topics.findIndex(x => x.dataset.topic === m[1]) : -1;
  show(t < 0 ? 0 : t, m && t >= 0 ? +m[2] - 1 : 0);
})();
</script>
