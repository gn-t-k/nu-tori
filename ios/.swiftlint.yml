# 見た目は swift-format が見る。ここは docs/agents の決まりのうち、機械で見られるものだけ
allow_zero_lintable_files: true
excluded:
  - NuToriCore/.build
  - OpenAPIGenerator/.build
  - SharedRulesGenerator/.build
  - NuToriCore/Sources/NuToriAPI/Generated
  - .build
only_rules:
  - file_name
  - file_types_order
  - custom_rules
file_types_order:
  order: [[main_type], [extension], [supporting_type], [preview_provider]]
custom_rules:
  swiftlint_disable_with_reason:
    name: "SwiftLint の抑止に理由を添える"
    regex: "swiftlint:disable(?::(?:next|this|previous))?\\b(?![^\\n]* - \\S)"
    match_kinds: [comment]
    message: "swiftlint:disable の規則の名前のあとに「 - 」で理由を添える（// swiftlint:disable:next no_default_in_switch - サーバーの名前は文字列で、知らない値が来る）。抑止は規則の約束を外すので、なぜここだけ外してよいかを、抑止と同じ行で読めるようにする"
    severity: error
  swift_format_ignore_with_reason:
    name: "swift-format の抑止に理由を添える"
    # swift-format は同じ行の後ろを規則の名前として読み、「 - 」で理由を添えると抑止が効かなくなるので、1つ上の行のコメントで見る。ドキュメントコメントと、別の抑止のコメントは理由とみなさない。行の頭のコメントだけを見るので、1行の文字列の中は当たらない
    regex: "(?:\\A|^(?![ \\t]*//(?!/)(?![^\\n]*(?:swiftlint:|swift-format-ignore)))[^\\n]*\\n)[ \\t]*//[ \\t]*swift-format-ignore"
    message: "swift-format-ignore の1つ上の行に、理由をコメントで書く。抑止は整形の約束を外すので、なぜここだけ外してよいかを抑止のそばで読めるようにする。swift-format は同じ行の後ろを規則の名前として読むので、同じ行には書けない"
    severity: error
  no_force_cast:
    name: "as! を使わない"
    # 組み込みの force_cast は理由を書けないので、同じものを理由つきで落とす
    regex: "\\bas!"
    excluded_match_kinds: [comment, doccomment, string]
    message: "as! は型が合わないとアプリを落とし、型の食い違いを実行するまで隠す。キャストの要らない形を探し、要るときは as? で失敗を扱う（docs/agents/coding-style.md「キャストのいらない形を探す」）"
    severity: error
  no_observable_object:
    name: "ObservableObject を使わない"
    regex: "(\\bObservableObject\\b|@(Published|StateObject|ObservedObject|EnvironmentObject)\\b)"
    message: "@Observable を使う。ObservableObject は、読んでいないプロパティが変わっても View を描き直し、@Published を1つずつ付ける手間が要る旧世代の仕組み（docs/agents/coding-style.md「新しい技術を選ぶ」）"
    severity: error
  xctest_only_in_ui_tests:
    name: "XCTest は UI テストだけ"
    regex: "^\\s*import\\s+XCTest\\b"
    excluded: [".*UITests/.*"]
    message: "UI テスト以外は Swift Testing で書く。XCTest は、Swift Testing で書けない UI テスト（XCUITest）にだけ残す旧世代の道具（docs/agents/coding-style.md「新しい技術を選ぶ」）"
    severity: error
  no_wrapped_comment:
    name: "コメントの文を途中で折り返さない"
    # 「、」と助詞で終わる行は文の途中（「もの」は文の終わりになるので除く）。次の行が「- 」で始まる箇条書き（DocC の - Parameters: など）は当てない。server/oxlint-plugin.js の no-wrapped-comment と同じ決まり
    regex: "^[ \\t]*//[^\\n]*(、|を|が|は|に|で|へ|て|(?<!も)の)[ \\t]*\\n[ \\t]*//(?![ \\t/]*- )"
    match_kinds: [comment, doccomment]
    message: "コメントの文を途中で折り返さず、1行で書く。改行は人が必要と思ったときに文の切れ目で入れる（docs/agents/coding-style.md「コードを説明する情報」）"
    severity: error
  no_parameterized_test:
    name: "@Test(arguments:) は理由があるときだけ"
    regex: "@Test\\([^)]*arguments:"
    message: "既定では、条件を名前にした @Suite と個別の @Test で書く。要るときは swiftlint:disable:next に「 - 」で理由を添えて抑止する（docs/agents/testing.md「テストの構造」）"
    severity: error
  no_default_in_switch:
    name: "自分たちの enum の switch に default を置かない"
    # 型を見られないので、どの switch の default も落とす。@unknown default と、辞書の [key, default:] は行の頭に来ないので当たらない
    regex: "^\\s*default\\s*:"
    match_kinds: [keyword]
    message: "自分たちの enum の switch では、case を並べて default を置かない。case を足したときの漏れがコンパイルエラーになる。文字列・数・エラー・外の型の switch のように default が要るときは、swiftlint:disable:next に「 - 」で理由を添えて外す（docs/agents/coding-style.md「関数は処理の流れで分ける」）"
    severity: error
  no_nil_default_argument:
    name: "引数に = nil を付けない"
    # var と let の宣言は当てない。@State の初期値のように、宣言の = nil は意味が分かれる
    regex: "(?:^|[(,])[ \\t]*(?!(?:var|let|case|static|private|fileprivate|public|internal|guard|if|return)\\b)\\w+(?:\\s+\\w+)?\\s*:\\s*[^=\\n]+?\\?\\s*=\\s*nil\\b"
    excluded_match_kinds: [comment, doccomment, string]
    # テストの差し替えと見本は、既定のデータを持って引数で一部を上書きする（docs/agents/testing.md「依存の差し替え」）
    excluded:
      - ".*Tests/.*"
      - ".*/NuToriTestSupport/.*"
      - ".*/UITesting/.*"
      - ".*/FakeSyncServer[^/]*\\.swift"
    message: "引数の = nil は、渡し忘れが型で見えなくなる。既定値を外して呼ぶ側で nil を渡す（docs/agents/coding-style.md「値が無いことを許すのは、必要な事情があるときだけ」）"
    severity: error
  test_display_name_koto:
    name: "@Test の表示名は「〜こと」"
    regex: "@Test(?!\\(\\s*\"[^\"]*こと\")"
    included: [".*Tests\\.swift"]
    message: "@Test(\"〜こと\") の形で、確かめる振る舞いを書く。条件は @Suite の名前に書くので、並べると振る舞いの一覧として読める"
    severity: error
  suite_display_name_japanese:
    name: "@Suite の表示名は日本語"
    regex: "@Suite(?!\\(\\s*\"[^\"\\n]*[ぁ-んァ-ヶ一-龠々])"
    excluded_match_kinds: [comment, doccomment, string]
    message: "@Suite(\"…\") の最初の引数に、まとまりの名前を日本語で書く。条件はまとまりの名前に書き、テストの結果の一覧で、機能 → 条件 → 振る舞いの文として読めるようにする（docs/agents/testing.md「テストの構造」）"
    severity: error
  ui_test_method_name_koto:
    name: "XCUITest のメソッド名は test_〜こと"
    # XCTestCase は表示名を持てないので、メソッド名を @Test の表示名の代わりにする。XCTest は test で始まるメソッドだけを走らせる
    regex: "\\bfunc\\s+test(?!_[^\\s(]*こと\\s*\\()"
    included: [".*/NuToriUITests/.*"]
    excluded_match_kinds: [comment, doccomment, string]
    message: "XCUITest のメソッドは、test_ のあとに振る舞いを「〜こと」の日本語で書く（func test_体重を記録できること()）。XCTestCase は表示名を持てないので、名前を @Test の表示名の代わりにする（docs/agents/testing.md「テストの構造」）"
    severity: error
  exact_package_version:
    name: "依存は exact: で固定する"
    included: ["(^|.*/)Package\\.swift$"]
    regex: "\\.package\\(\\s*url:[^)]*\\b(from:|branch:|revision:|\\.upToNext)"
    message: "Swift Package の依存は exact: で固定する。from: や branch: で書くと、Package.resolved を作り直したときに版が黙って変わる（docs/agents/coding-style.md「依存パッケージ」）"
    severity: error
  no_context_without_container:
    name: "ModelContext だけを返さない"
    regex: "->\\s*ModelContext\\b"
    message: "コンテキストはコンテナを保たず、コンテナが先に解放されると落ちる。コンテナを返すか、withExtendedLifetime(container) の中で使う"
    severity: error
  uuid_string_through_canonical_string:
    name: "API に載せる UUID の文字列は canonicalString で作る"
    regex: "\\.uuidString\\b"
    included:
      - ".*/NuToriCore/Sources/NuToriAPI/.*"
      - ".*/NuToriCore/Sources/NuToriTestSupport/.*"
      - ".*/NuToriCore/Tests/NuToriAPITests/.*"
      - ".*/NuToriCore/Sources/NuToriCore/Health/ImportedWeightRecordId\\.swift"
    excluded: [".*/UUID\\+CanonicalString\\.swift"]
    message: "uuidString は大文字で、サーバーは ID を小文字の正規形の文字列のまま比べる。UUID.canonicalString を使う（#362）"
    severity: error
