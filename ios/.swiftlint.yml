# 見た目は swift-format が見る。ここは docs/agents の決まりのうち、機械で見られるものだけ
allow_zero_lintable_files: true
excluded:
  - NuToriCore/.build
  - OpenAPIGenerator/.build
  - SharedRulesGenerator/.build
  - NuToriCore/Sources/NuToriAPI/Generated
  - .build
only_rules:
  - force_cast
  - file_name
  - file_types_order
  - custom_rules
file_types_order:
  order: [[main_type], [extension], [supporting_type], [preview_provider]]
custom_rules:
  no_observable_object:
    name: "ObservableObject を使わない"
    regex: "(\\bObservableObject\\b|@(Published|StateObject|ObservedObject|EnvironmentObject)\\b)"
    message: "@Observable を使う（docs/agents/languages/swift.md「新しい技術を選ぶ」）"
    severity: error
  xctest_only_in_ui_tests:
    name: "XCTest は UI テストだけ"
    regex: "^\\s*import\\s+XCTest\\b"
    excluded: [".*UITests/.*"]
    message: "UI テスト以外は Swift Testing で書く（docs/agents/languages/swift.md「道具」）"
    severity: error
  no_wrapped_comment:
    name: "コメントの文を途中で折り返さない"
    # 「、」と助詞で終わる行は文の途中（「もの」は文の終わりになるので除く）。次の行が「- 」で始まる箇条書き（DocC の - Parameters: など）は当てない。server/oxlint-plugin.js の no-wrapped-comment と同じ決まり
    regex: "^[ \\t]*//[^\\n]*(、|を|が|は|に|で|へ|て|(?<!も)の)[ \\t]*\\n[ \\t]*//(?![ \\t/]*- )"
    match_kinds: [comment, doccomment]
    message: "コメントの文を途中で折り返さず、1行で書く。改行は人が必要と思ったときに文の切れ目で入れる（docs/agents/coding-style.md「コードを説明する情報」）"
    severity: error
  no_parameterized_test:
    name: "@Test(arguments:) は理由があるときだけ"
    regex: "@Test\\([^)]*arguments:"
    message: "既定では、条件を名前にした @Suite と個別の @Test で書く。要るときは理由を PR に書いて抑止する（docs/agents/testing.md「テストの構造」）"
    severity: error
  no_default_in_switch:
    name: "自分たちの enum の switch に default を置かない"
    # 型を見られないので、どの switch の default も落とす。@unknown default と、辞書の [key, default:] は行の頭に来ないので当たらない
    regex: "^\\s*default\\s*:"
    match_kinds: [keyword]
    message: "自分たちの enum の switch では、case を並べて default を置かない。文字列・数・エラー・外の型の switch のように default が要るときは、swiftlint:disable:next に「 - 」で理由を添えて外し、PR にも書く（docs/agents/languages/swift.md「関数は処理の流れで分ける」）"
    severity: error
  no_nil_default_argument:
    name: "引数に = nil を付けない"
    # var と let の宣言は当てない。@State の初期値のように、宣言の = nil は意味が分かれる
    regex: "(?:^|[(,])[ \\t]*(?!(?:var|let|case|static|private|fileprivate|public|internal|guard|if|return)\\b)\\w+(?:\\s+\\w+)?\\s*:\\s*[^=\\n]+?\\?\\s*=\\s*nil\\b"
    excluded_match_kinds: [comment, doccomment, string]
    # テストの差し替えと見本は、既定のデータを持って引数で一部を上書きする（docs/agents/testing.md「依存の差し替え」）
    excluded:
      - ".*Tests/.*"
      - ".*/NuToriTestSupport/.*"
      - ".*/UITesting/.*"
      - ".*/FakeSyncServer[^/]*\\.swift"
    message: "引数の = nil は、渡し忘れが型で見えなくなる。既定値を外して呼ぶ側で nil を渡す（docs/agents/languages/swift.md「値が無いことを許すのは、必要な事情があるときだけ」）"
    severity: error
  test_display_name_koto:
    name: "@Test の表示名は「〜こと」"
    regex: "@Test(?!\\(\\s*\"[^\"]*こと\")"
    included: [".*Tests\\.swift"]
    message: "@Test(\"〜こと\") の形で振る舞いを書く（docs/agents/testing.md「テストの構造」）"
    severity: error
  exact_package_version:
    name: "依存は exact: で固定する"
    included: ["(^|.*/)Package\\.swift$"]
    regex: "\\.package\\(\\s*url:[^)]*\\b(from:|branch:|revision:|\\.upToNext)"
    message: "Swift Package の依存は exact: で固定する（docs/agents/languages/swift.md「依存パッケージ」）"
    severity: error
  no_context_without_container:
    name: "ModelContext だけを返さない"
    regex: "->\\s*ModelContext\\b"
    message: "コンテキストはコンテナを保たず、コンテナが先に解放されると落ちる。コンテナを返すか、withExtendedLifetime(container) の中で使う"
    severity: error
  uuid_string_through_canonical_string:
    name: "API に載せる UUID の文字列は canonicalString で作る"
    regex: "\\.uuidString\\b"
    included:
      - ".*/NuToriCore/Sources/NuToriAPI/.*"
      - ".*/NuToriCore/Sources/NuToriTestSupport/.*"
      - ".*/NuToriCore/Tests/NuToriAPITests/.*"
      - ".*/NuToriCore/Sources/NuToriCore/Health/ImportedWeightRecordId\\.swift"
    excluded: [".*/UUID\\+CanonicalString\\.swift"]
    message: "uuidString は大文字で、サーバーは ID を小文字の正規形の文字列のまま比べる。UUID.canonicalString を使う（#362）"
    severity: error
