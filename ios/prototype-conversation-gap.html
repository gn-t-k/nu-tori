<title>話し手が変わるところの間</title>
<!--
  PROTOTYPE（捨てる前提）。「会話で、話し手が変わるところの間が狭い」（gn-t-k/nu-tori#449）の試作。main には入れない。
  2回目: 見た目を #452 の決定（C5。文章からできた食事は吹き出しの下に行でつなぐ。自分の記録の地は Primary 22%）のあとの形にし、
  記録と発言が隣り合うところの間を比べる。
    C: 話し手が変わるところは 24、同じ話し手が続くところは 8。記録と発言が隣り合うところは 24、記録どうしは 8
    D: 話し手だけで決める。自分（記録と送った文章）と AI が入れ替わるところは 24、ほかは 8
  1回目の A（今の形・8）/ B（16）/ C（24）は fc5bcf1 にある。
  下のバーの ‹ › か左右の矢印キーで案を切り替える。#c #d で開ける。「並べる」で横に並べる。
  C5 の見た目は claude/affectionate-lovelace-swcmlb の ios/prototype-written-meal.html（93de4bd）から写した。
-->
<style>
:root{
  --bg:#f2f2f7;            /* systemGroupedBackground */
  --surface:#ffffff;       /* secondarySystemGroupedBackground */
  --ink:#000000;
  --ink2:rgb(60 60 67 / .6);
  --ink3:rgb(60 60 67 / .3);
  --sep:rgb(60 60 67 / .29);
  --fill:rgb(120 120 128 / .12);
  --tint:#6155f5;          /* Primary */
  --on-tint:#ffffff;
  --track:#e5e5ea;
  --page:#e4e5ea; --page-ink:#1c1c1e; --page-muted:#6c6c70; --frame:#c7c7cc;
  --gap-mark:rgb(255 56 60 / .16); --gap-ink:#c4161c;
  --font:system-ui,-apple-system,"SF Pro Text","Hiragino Sans","Hiragino Kaku Gothic ProN",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#000000; --surface:#1c1c1e; --ink:#ffffff; --ink2:rgb(235 235 245 / .6); --ink3:rgb(235 235 245 / .3);
    --sep:rgb(84 84 88 / .6); --fill:rgb(118 118 128 / .24); --tint:#6d7cff; --on-tint:#ffffff; --track:#2c2c2e;
    --page:#0c0c0d; --page-ink:#e5e5ea; --page-muted:#98989f; --frame:#3a3a3c;
    --gap-mark:rgb(255 66 69 / .24); --gap-ink:#ff8a8c;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#000000; --surface:#1c1c1e; --ink:#ffffff; --ink2:rgb(235 235 245 / .6); --ink3:rgb(235 235 245 / .3);
  --sep:rgb(84 84 88 / .6); --fill:rgb(118 118 128 / .24); --tint:#6d7cff; --on-tint:#ffffff; --track:#2c2c2e;
  --page:#0c0c0d; --page-ink:#e5e5ea; --page-muted:#98989f; --frame:#3a3a3c;
  --gap-mark:rgb(255 66 69 / .24); --gap-ink:#ff8a8c;
  color-scheme:dark;
}
:root{ --own:color-mix(in srgb,var(--tint) 22%,var(--surface)); } /* 自分の記録の地（#452 で 22% にそろえた） */
*{box-sizing:border-box}
body{margin:0;padding-block:16px 96px;padding-inline:16px;background:var(--page);color:var(--page-ink);font:14px/1.5 var(--font)}
button,input{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--tint);outline-offset:2px;border-radius:6px}
.intro{max-width:1240px;margin:0 auto 14px;display:flex;flex-direction:column;gap:6px}
.intro h1{font-size:20px;margin:0;text-wrap:balance}
.intro p{margin:0;color:var(--page-muted);max-width:760px}
.intro dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:2px 10px;max-width:760px}
.intro dt{font-weight:700}
.intro dd{margin:0;color:var(--page-muted)}
.ctl{max-width:1240px;margin:0 auto 16px;display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px}
.ctl label{display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.stage{max-width:1240px;margin:0 auto;display:grid;gap:20px;justify-content:center;grid-template-columns:minmax(0,390px)}
.stage.all{grid-template-columns:repeat(auto-fit,minmax(min(340px,100%),390px))}
figure{margin:0;display:flex;flex-direction:column;gap:8px;min-width:0}
figcaption{font-size:13px;color:var(--page-muted)}
figcaption b{color:var(--page-ink);font-size:15px;margin-right:6px}

/* ── 電話の枠 ── */
.phone{background:var(--bg);color:var(--ink);border:1px solid var(--frame);border-radius:38px;overflow:hidden;display:flex;flex-direction:column;font-size:17px;line-height:1.3}
.status{height:34px;flex:none}
.nav{height:44px;flex:none;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 16px}
.nav .t{grid-column:2;font-size:17px;font-weight:600}
.nav .r{justify-self:end;width:30px;height:30px;border-radius:50%;background:var(--fill)}
.band{display:flex;padding:0 16px 10px;border-bottom:.5px solid var(--sep)}
.band .d{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--ink2);padding:4px 0;border-radius:10px}
.band .d i{width:28px;height:28px;border-radius:50%;border:4.5px solid var(--track)}
.band .d.sel{background:var(--fill);color:var(--ink);font-weight:600}
.band .d.sel i{border-color:color-mix(in srgb,var(--tint) 55%,var(--track))}
.tl{padding:12px 16px 16px;display:flex;flex-direction:column}
.dayhd{font-size:13px;color:var(--ink2);text-align:center}
.composer{flex:none;padding:8px 16px 26px;border-top:.5px solid var(--sep);display:flex;gap:8px;align-items:center}
.composer .f{flex:1;height:36px;border-radius:18px;background:var(--surface);border:.5px solid var(--sep);padding:0 14px;display:flex;align-items:center;color:var(--ink3);font-size:17px}
.composer .s{width:36px;height:36px;border-radius:50%;background:var(--fill)}

/* 項目。間は JS が margin-top で置く */
.item{position:relative;display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.item.ai{align-items:flex-start}
.gap{position:absolute;left:-16px;right:-16px;bottom:100%;display:none;align-items:center;justify-content:flex-end;padding-right:4px;background:var(--gap-mark);color:var(--gap-ink);font:600 10px/1 ui-monospace,SFMono-Regular,Menlo,monospace}
.show-gaps .gap.wide{display:flex}
.own{background:var(--own);border-radius:12px;overflow:hidden}
.wrow{display:flex;flex-direction:column;align-items:flex-end;gap:2px;padding:16px;font-size:15px;font-variant-numeric:tabular-nums}
.wrow small{font-size:12px;color:var(--ink2)}
.photo{aspect-ratio:4/3;max-width:100%;background:radial-gradient(circle at 35% 45%,#f3c9a4 0 22%,transparent 23%),radial-gradient(circle at 68% 55%,#e9e2d0 0 20%,transparent 21%),linear-gradient(135deg,#b9a58c,#8f7c66)}
.meal-card{width:78%}
.meal{display:flex;align-items:center;gap:8px;padding:16px}
.meal.tight{padding:12px 16px}
.meal .b{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0}
.meal .n{font-size:15px;font-weight:600}
.meal .c{font-size:12px;color:var(--ink2);font-variant-numeric:tabular-nums}
.meal .k{font-size:13px;color:var(--ink2);font-variant-numeric:tabular-nums;display:flex;flex-wrap:wrap;gap:0 8px}
.meal .k b{font-weight:600}
.meal .chev{color:var(--ink3);font-size:12px}
.me{max-width:78%;background:var(--tint);color:var(--on-tint);border-radius:18px;padding:12px;white-space:pre-wrap}
/* C5: 吹き出しの下に食事の行をすき間なくつなぎ、外側の角丸1つのかたまりにする */
.joined{width:78%;border-radius:18px;overflow:hidden;display:flex;flex-direction:column}
.joined .me{max-width:none;border-radius:0}
.joined .tray{background:var(--own)}
.resend{color:var(--tint);font-size:15px;font-weight:600;min-height:44px;padding:0 4px;margin-top:-8px}
.reply{max-width:92%;display:flex;flex-direction:column;gap:8px}
.reply p{margin:0}
.reply .li{display:flex;gap:8px}

/* 切り替えのバー（試作の道具。設計の一部ではない） */
.switcher{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom, 0px));transform:translateX(-50%);display:flex;align-items:center;gap:4px;padding:4px;border-radius:999px;background:var(--page-ink);color:var(--page);box-shadow:0 6px 24px rgb(0 0 0 / .25);z-index:10;max-width:calc(100% - 32px)}
.switcher button{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:20px;color:var(--page)}
.switcher .lab{padding:0 10px;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.switcher .lab b{margin-right:6px}
.all ~ .switcher{display:none}
</style>

<div class="intro">
  <h1>記録と発言のあいだの間（#449）</h1>
  <p>話し手が変わるところは 24 にすると決めた（1回目の C）。残る問いは、体重や食事のカード（自分の記録）と発言が隣り合うところを 24 にするか 8 にするか。見た目は #452 の決定のあと（文章からできた食事は吹き出しの下につなぐ、自分の記録の地は 22%）。iPhone の幅（390 pt）を 1:1 で描いた。</p>
  <dl>
    <dt>C</dt><dd>話し手が変わるところと、記録 ⇄ 発言は 24。同じ話し手の発言が続くところと、記録どうしは 8</dd>
    <dt>D</dt><dd>話し手だけで決める。自分（記録と送った文章）と AI が入れ替わるところだけ 24、ほかは 8</dd>
  </dl>
</div>
<div class="ctl">
  <label><input type="checkbox" id="all"> 並べる</label>
  <label><input type="checkbox" id="marks"> 24 の間に印を付ける</label>
</div>
<div class="stage" id="stage"></div>
<div class="switcher" role="group" aria-label="案の切り替え">
  <button id="prev" aria-label="前の案">‹</button>
  <span class="lab" id="lab"></span>
  <button id="next" aria-label="次の案">›</button>
</div>

<script>
// ── 間の決め方 ──
// 項目は、話し手（me / ai）と、記録か発言か（record）を持つ
const VARIANTS = [
  {key:'c', label:'C', name:'記録 ⇄ 発言も 24', gap(p, it){
    if (p.record && it.record) return 8;
    if (p.record !== it.record) return 24;
    return p.who === it.who ? 8 : 24;
  }},
  {key:'d', label:'D', name:'話し手だけで決める', gap(p, it){
    return p.who === it.who ? 8 : 24;
  }},
];

// ── 場面: 今日。朝に体重と写真の食事、昼に会話と文章の食事、夜に写真の食事のあと質問 ──
const meal = (name, time, kcal, p, f, c, tight) =>
  `<div class="meal${tight?' tight':''}"><div class="b"><span class="n">${name}</span><span class="c">${time}</span>`
  + `<span class="k"><b>${kcal} kcal</b><span>P ${p}</span><span>F ${f}</span><span>C ${c}</span></span></div><span class="chev">›</span></div>`;
const ITEMS = [
  {who:'me', record:true, html:'<div class="own"><div class="wrow"><span>7:12 72.4 kg</span><small>手で記録</small></div></div>'},
  {who:'me', record:true, html:`<div class="own meal-card"><div class="photo"></div>${meal('トースト、目玉焼き','8:05',412,'18.2','17.9','42.6')}</div>`},
  {who:'me', record:false, html:'<div class="me">ここまでの食事のフィードバックをください。</div>'},
  {who:'ai', record:false, html:'<div class="reply"><p>朝ごはんで <b>たんぱく質</b> がとれています。</p><div class="li"><span>•</span><span>昼は野菜を足す</span></div><div class="li"><span>•</span><span>夜は軽めに</span></div></div>'},
  {who:'me', record:false, html:`<div class="joined"><div class="me">昼は親子丼</div><div class="tray">${meal('親子丼','12:40',346,'19.1','14.5','37.1',true)}</div></div><button class="resend">会話として送り直す</button>`},
  {who:'me', record:false, html:'<div class="me">↑は3人で分けて食べた</div>'},
  {who:'ai', record:false, html:'<div class="reply"><p>3人で分けたなら、1人分は3分の1ほどですね。量を直しておくと、今日の合計に合います。</p></div>'},
  {who:'me', record:true, html:`<div class="own meal-card"><div class="photo"></div>${meal('鮭の塩焼き定食','19:10',598,'32.4','15.8','78.0')}</div>`},
  {who:'me', record:false, html:'<div class="me">今日はこれで足りてる？</div>'},
  {who:'ai', record:false, html:'<div class="reply"><p>たんぱく質は目安に届いています。脂質は少し少なめなので、明日の朝にナッツを足すとちょうどよくなります。</p></div>'},
];

function phoneHTML(v){
  const days = ['日','月','火','水','木','金','土'];
  const band = days.map((d,i)=>`<span class="d${i===0?' sel':''}"><i></i>${d}</span>`).join('');
  const rows = ITEMS.map((it,i)=>{
    const px = i === 0 ? 8 : v.gap(ITEMS[i-1], it);
    return `<div class="item${it.who==='ai'?' ai':''}" style="margin-top:${px}px">`
      + `<span class="gap${px===24?' wide':''}" style="height:${px}px">${px}</span>${it.html}</div>`;
  }).join('');
  return `<div class="phone"><div class="status"></div><div class="nav"><span class="t">今日</span><span class="r"></span></div>`
    + `<div class="band">${band}</div><div class="tl"><div class="dayhd">今日</div>${rows}</div>`
    + `<div class="composer"><span class="f">記録や質問を書く</span><span class="s"></span></div></div>`;
}

// ── ページ ──
const stage = document.getElementById('stage');
const allBox = document.getElementById('all');
const marksBox = document.getElementById('marks');
let current = Math.max(0, VARIANTS.findIndex(v => '#'+v.key === location.hash));
function render(){
  const list = allBox.checked ? VARIANTS : [VARIANTS[current]];
  stage.className = 'stage' + (allBox.checked ? ' all' : '') + (marksBox.checked ? ' show-gaps' : '');
  stage.innerHTML = list.map(v => `<figure><figcaption><b>${v.label}</b>${v.name}</figcaption>${phoneHTML(v)}</figure>`).join('');
  const v = VARIANTS[current];
  document.getElementById('lab').innerHTML = `<b>${v.label}</b>${v.name}`;
}
function go(d){
  current = (current + d + VARIANTS.length) % VARIANTS.length;
  try { history.replaceState(null, '', '#' + VARIANTS[current].key); } catch (e) {}
  render();
}
document.getElementById('prev').onclick = () => go(-1);
document.getElementById('next').onclick = () => go(1);
allBox.onchange = render;
marksBox.onchange = render;
addEventListener('keydown', e => {
  if (e.target.closest && e.target.closest('textarea,[contenteditable]')) return;
  if (e.key === 'ArrowLeft') go(-1);
  if (e.key === 'ArrowRight') go(1);
});
render();
</script>
