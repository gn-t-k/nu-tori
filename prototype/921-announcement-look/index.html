    title: '体重をヘルスケアから読めるようになりました', body: ['体重計がヘルスケアに書いた体重を、アプリを開いたときに読みます。アカウントの画面の「ヘルスケア」でオンにできます。'] },
  f2: { kind: '新しい機能', imp: false, to: '全員', day: '11/7', date: '11月7日',
    title: '写真をまとめて送れるようになりました', body: ['「写真」から最大10枚まで選んで、まとめて送れます。1枚ずつ推定します。'] },
  f3: { kind: '新しい機能', imp: false, to: '全員', day: '11/6', date: '11月6日',
    title: '週の振り返りに、先週との差が出るようになりました', body: ['週の振り返りのカードに、平均の体重と kcal の先週との差を出します。'] },
};
// 一覧で読み返す見本の、前に読んだ告知
const OLD = [{ id: 'old1', kind: '新しい機能', imp: false, date: '10月20日', title: '会話の返事で太字と箇条書きを描くようになりました', body: ['返事の中の太字と箇条書きを、そのまま描くようにしました。'] }];
const all = (id) => ANN[id] || OLD.find((o) => o.id === id);

/* ---------- 状態 ---------- */
const S = { variant: 'A', refuse: 'X', scene: 's1', mark: 'icon', list: false, read: new Set(), closed: new Set(), agreed: false, sheet: null, yPressed: false, subnote: true };
(function initFromUrl() {
  const q = new URLSearchParams(location.search);
  const h = location.hash.replace('#', '').split('-');
  const v = q.get('variant') || h[0]; const sc = q.get('scene') || h[1];
  if (SCENES[sc]) S.scene = sc;
  if (VARIANTS[v]) S.variant = v; if (REFUSALS[v]) S.refuse = v;
  S.list = VARIANTS[S.variant].list;
})();
const isRefusal = () => S.scene === 's6';
const sceneAnns = () => SCENES[S.scene].ids;
const unread = () => sceneAnns().filter((id) => !S.read.has(id) && !S.closed.has(id));
const $ = (id) => document.getElementById(id);

/* ---------- アイコン（SF Symbols の代わり） ---------- */
const I = {
  person: '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="10" r="3.4"/><path d="M5.6 18.6c1.6-2.3 3.8-3.4 6.4-3.4s4.8 1.1 6.4 3.4"/></svg>',
  cam: '<svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M8.5 5l1.4-2h4.2l1.4 2H20a2 2 0 012 2v11a2 2 0 01-2 2H4a2 2 0 01-2-2V7a2 2 0 012-2h4.5zM12 17a4.5 4.5 0 100-9 4.5 4.5 0 000 9z"/></svg>',
  photo: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="6" y="3" width="15" height="13" rx="2"/><path d="M3 7v11a2 2 0 002 2h12"/><path d="M8 14l3.5-4 3 3 2-2 3 3"/></svg>',
  scale: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="3" width="18" height="18" rx="5"/><path d="M7.5 10a5 5 0 019 0"/><path d="M12 10.5l1.6-2.6"/></svg>',
  warn: (c) => `<svg width="15" height="15" viewBox="0 0 24 24" fill="${c}"><path d="M10.3 3.6a2 2 0 013.4 0l8.4 14.6A2 2 0 0120.4 21H3.6a2 2 0 01-1.7-2.8L10.3 3.6z"/><path d="M12 9v5" stroke="var(--surface)" stroke-width="2.2" stroke-linecap="round"/><circle cx="12" cy="17.3" r="1.25" fill="var(--surface)"/></svg>`,
  hand: '<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="9"/><path d="M5.6 5.6l12.8 12.8"/></svg>',
  apple: '<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M16.4 12.6c0-2.6 2.1-3.8 2.2-3.9-1.2-1.8-3.1-2-3.7-2-1.6-.2-3.1.9-3.9.9-.8 0-2-.9-3.4-.9-1.7 0-3.3 1-4.2 2.6-1.8 3.1-.5 7.7 1.3 10.2.9 1.2 1.9 2.6 3.2 2.6 1.3-.1 1.8-.8 3.3-.8 1.6 0 2 .8 3.4.8s2.3-1.3 3.1-2.5c1-1.4 1.4-2.8 1.4-2.9 0 0-2.7-1-2.7-4.1zM13.9 5c.7-.8 1.2-2 1-3.1-1 0-2.2.7-2.9 1.5-.6.7-1.2 1.9-1 3 1.1.1 2.2-.6 2.9-1.4z"/></svg>',
  mark: '<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="7"/><path d="M12 5v7l4 3"/></svg>',
};

/* ---------- 部品 ---------- */
function kindLabel(a) {
  if (!a.imp) return `<div class="kind">${a.kind}・${a.date}</div>`;
  if (S.mark === 'word') return `<div class="kind">${a.kind}・${a.date}</div>`;
  if (S.mark === 'icon') return `<div class="kind imp-icon">${I.warn('currentColor')}${a.kind}<span style="font-weight:400;color:var(--fg2)">・${a.date}</span></div>`;
  return `<div class="kind imp-red">${I.warn('currentColor')}${a.kind}<span style="font-weight:400;color:var(--fg2)">・${a.date}</span></div>`;
}
function ring(p, f, c) { // 1日の丸（P・F・C の割合）
  const a = p * 3.6, b = a + f * 3.6, d = b + c * 3.6;
  return `<i style="background:radial-gradient(circle,var(--bg) 9.5px,transparent 10px),conic-gradient(var(--p) 0 ${a}deg,var(--f) 0 ${b}deg,var(--c) 0 ${d}deg,var(--ring) 0)"></i>`;
}
const STRIP = [['月', 30, 25, 40], ['火', 28, 22, 44], ['水', 25, 30, 35], ['木', 32, 20, 38], ['金', 27, 28, 36], ['土', 12, 8, 14], ['日', 14, 10, 16]];
function navBar() {
  const dot = S.variant === 'C' && sceneAnns().some((id) => !ANN[id].imp && !S.read.has(id)) ? '<span class="dot" aria-label="新しい告知"></span>' : '';
  return `<div class="nav"><button class="capsule" tabindex="-1">71.0 kg まで ›</button><b>11月8日（日）</b><button class="acct" id="openAcct" aria-label="アカウント">${I.person}${dot}</button></div>
    <div class="strip">${STRIP.map(([d, p, f, c], i) => `<div class="${i === 6 ? 'today' : ''}">${ring(p, f, c)}${d}</div>`).join('')}</div>`;
}
function bLine() {
  if (S.variant !== 'B') return '';
  const u = unread(); if (!u.length) return '';
  const imp = u.some((id) => ANN[id].imp);
  const lead = imp && S.mark !== 'word' ? `<span style="color:${S.mark === 'red' ? 'var(--error)' : 'var(--fg)'};line-height:0">${I.warn('currentColor')}</span>` : '';
  const text = u.length === 1 ? ANN[u[0]].title : `告知が${u.length}件あります`;
  const go = ANN[u[0]].consent ? '読んで同意' : '読む';
  return `<button class="line" id="bline">${lead}<span class="t">${text}</span><span class="go">${go}</span></button>`;
}
function aCard(id) {
  const a = ANN[id];
  if (S.closed.has(id)) return '';
  if (a.consent && S.agreed) return `<div class="card">${kindLabel(a)}<div class="h">${a.title}</div><div class="b">12月1日からの利用規約に同意しました。</div><button class="textbtn" style="justify-self:end" data-open="${id}">規約の変更を読む ›</button></div>`;
  const act = a.consent ? `<button class="bordered" data-consent="1">読んで同意する</button>`
    : `<div class="row">${a.imp ? '<span></span>' : `<button class="textbtn sub" data-close="${id}">閉じる</button>`}<button class="textbtn" data-open="${id}">続きを読む ›</button></div>`;
  return `<div class="card">${kindLabel(a)}<div class="h">${a.title}</div><div class="b clamp">${a.body[0]}</div>${act}</div>`;
}
function own(inner, time) { return `<div class="own"><div class="card">${inner}</div><span class="time">${time}</span></div>`; }
function meal(name, kcal, p, f, c) { return `<div class="h">${name}</div><div class="b">${kcal} kcal</div><div class="pfc"><span style="--k:var(--p)">P ${p} g</span><span style="--k:var(--f)">F ${f} g</span><span style="--k:var(--c)">C ${c} g</span></div>`; }
function day(key, label, body) {
  const cards = S.variant === 'A' ? sceneAnns().filter((id) => ANN[id].day === key).map(aCard).join('') : '';
  return `<div class="dayh">${label}</div>${cards}${body}`;
}
function timeline() {
  const s1 = S.scene === 's1';
  return `<div class="tl" id="tl">
    ${day('11/6', '11月6日（金）', own('<div class="h">72.6 kg</div>', '7:08') + own(meal('親子丼', '680', 32, 18, 92), '12:31') + '<div class="reply">昼は親子丼ですね。たんぱく質がしっかり取れています。</div>')}
    ${day('11/7', '11月7日（土）', own('<div class="h">72.5 kg</div>', '7:15') + own(s1 ? '<div class="h">鮭おにぎりと味噌汁</div><div class="b failed">推定できませんでした</div>' : meal('鮭おにぎりと味噌汁', '420', 18, 7, 70), '10:42'))}
    ${day('11/8', '11月8日（日）', own('<div class="h">72.4 kg</div>', '7:12') + own(meal('鮭の塩焼き定食', '620', 38, 16, 78), '12:05'))}
  </div>`;
}
function composer() {
  return `<div class="composer"><span class="circ cam">${I.cam}</span><span class="circ">${I.photo}</span><span class="circ">${I.scale}</span><span class="field">書く</span></div><div class="aimark">AI が読んで返事をします</div>`;
}

/* ---------- シート ---------- */
function detailBody(a) {
  return `<div class="sbody">${kindLabel(a)}<h2>${a.title}</h2>${a.body.map((p) => `<p>${p}</p>`).join('')}<p class="note">${a.to === '本人だけ' ? 'この告知は、あなたのアカウントだけに出しています。' : ''}</p></div>`;
}
function sheetHtml() {
  const s = S.sheet; if (!s) return '';
  if (s.type === 'detail') {
    const a = all(s.id);
    return `<div class="scrim" data-scrim="1"><div class="sheet ${S.variant === 'C' && s.launch ? 'half' : ''}"><div class="grab"></div><div class="sbar"><span></span><b></b><button class="r" data-done="1">完了</button></div>${detailBody(a)}</div></div>`;
  }
  if (s.type === 'consent') {
    const a = ANN.terms;
    return `<div class="scrim"><div class="sheet"><div class="grab"></div><div class="sbar"><button class="l" data-done="1">キャンセル</button><b>利用規約の変更</b><span></span></div>
      <div class="sbody">${kindLabel(a)}<h2>${a.title}</h2><p>${a.body[0]}</p><div class="group" style="padding:12px 16px;font-size:15px;line-height:22px"><ul class="bul"><li>料金のプランに、年間プラン（8,800円）を足します</li><li>年間プランを途中でやめても、期間の終わりまで使えます。残りの期間の返金は Apple の手続きに任せます</li></ul></div>
      <p><a class="link" href="https://nu-tori.app/terms" target="_blank" rel="noopener">新しい利用規約の全文を読む ↗</a></p></div>
      <div class="sfoot"><button class="prominent" data-agree="1">同意する</button></div></div></div>`;
  }
  if (s.type === 'account') {
    const listed = [...sceneAnns().slice().reverse(), ...OLD.map((o) => o.id)];
    const nUnread = sceneAnns().filter((id) => !S.read.has(id)).length;
    if (s.page === 'root') {
      const annRow = S.list ? `<div class="group"><button class="lrow" data-page="list"><span>告知</span><span class="v">${nUnread ? `<span class="badge">${nUnread}</span>` : ''}›</span></button></div>` : '';
      return `<div class="scrim"><div class="sheet"><div class="grab"></div><div class="sbar"><span></span><b>アカウント</b><button class="r" data-done="1">完了</button></div>
        <div class="sbody" style="gap:28px">
          <div class="group"><div class="lrow"><span>サブスクリプション</span><span class="v">年間プラン ›</span></div></div>
          ${annRow}
          <div class="group"><div class="lrow"><span>ヘルスケア</span><span class="v">›</span></div></div>
          <div class="group"><div class="lrow"><span>記録忘れの通知</span><span class="v">オン</span></div></div>
          <div class="group"><div class="lrow"><span>利用状況を送る</span><span class="v">オン</span></div></div>
          ${S.list ? '' : '<p class="foot" style="margin-top:-16px">この案の既定では、告知の一覧を置きません。右の「アカウントの画面に一覧を置く」で足せます。</p>'}
        </div></div></div>`;
    }
    if (s.page === 'list') {
      return `<div class="scrim"><div class="sheet"><div class="grab"></div><div class="sbar"><button class="l" data-page="root">‹ アカウント</button><b>告知</b><button class="r" data-done="1">完了</button></div>
        <div class="sbody"><div class="group">${listed.map((id) => { const a = all(id); const u = ANN[id] && !S.read.has(id);
          return `<button class="lrow" data-page="detail" data-id="${id}"><span class="stack">${kindLabel(a)}<span class="tt ${u ? 'unread' : ''}">${a.title}</span></span><span class="v">›</span></button>`; }).join('')}</div>
        <p class="foot">出た順に新しいものから。閉じた告知も、ここでは読めます。</p></div></div></div>`;
    }
    const a = all(s.id);
    return `<div class="scrim"><div class="sheet"><div class="grab"></div><div class="sbar"><button class="l" data-page="list">‹ 告知</button><b></b><button class="r" data-done="1">完了</button></div>${detailBody(a)}${a.consent && !S.agreed ? '<div class="sfoot"><button class="prominent" data-consent="1">読んで同意する</button></div>' : ''}</div></div>`;
  }
  return '';
}

/* ---------- 断る画面 ---------- */
const CONTACT = 'support@nu-tori.app';
function subLine() { return S.subnote ? 'サブスクリプションは止まりません。続けないときは、iPhone の設定の Apple アカウント → サブスクリプションから解約してください。' : ''; }
function refusal() {
  const consent = `<div class="consent">続けると、<a href="#">利用規約</a>と<a href="#">プライバシーポリシー</a>に同意したことになります。</div>`;
  const head = (lead) => `<div class="head"><div class="mark">${I.mark}</div><h2>nu-tori</h2><p class="lead">${lead}</p></div>`;
  if (S.refuse === 'X') {
    return `<div class="signin">${head(`このアカウントは、利用規約により利用を止めています。お問い合わせは <span class="mail">${CONTACT}</span> へ。`)}
      ${S.subnote ? `<p class="status" style="color:var(--fg2)">${subLine()}</p>` : ''}${consent}<button class="apple">${I.apple} Apple でサインイン</button></div>`;
  }
  if (S.refuse === 'Y') {
    const st = S.yPressed ? `<p class="status">このアカウントは利用を止めているため、サインインできません。お問い合わせは <span class="mail">${CONTACT}</span> へ。${S.subnote ? '<br>' + subLine() : ''}</p>` : '';
    return `<div class="signin">${head('もう一度サインインしてください。同じ Apple ID で続けると、記録はそのまま戻ります。')}${consent}${st}<button class="apple" id="yApple">${I.apple} Apple でサインイン</button></div>`;
  }
  return `<div class="stop"><div class="icon">${I.hand}</div><h2>このアカウントの利用を止めています</h2>
    <p>利用規約の「禁止すること」に当たる使い方があったため、11月15日から利用を止めています。</p>
    ${S.subnote ? `<p class="sub">${subLine()}</p>` : ''}
    <p class="sub">お問い合わせ：<span class="mail">${CONTACT}</span></p>
    <button class="bordered" style="justify-self:stretch;height:50px">サポートのページを開く ↗</button>
    <button class="textbtn" style="justify-self:center;margin-top:4px">別の Apple ID でサインイン</button></div>`;
}

/* ---------- 描く ---------- */
function render() {
  const phone = $('phone');
  if (isRefusal()) {
    phone.innerHTML = refusal();
  } else {
    phone.innerHTML = navBar() + `<div class="under">${bLine()}</div>` + timeline() + composer() + sheetHtml();
    const tl = $('tl'); if (tl) tl.scrollTop = tl.scrollHeight;
    if (S.variant === 'A' && S.scene === 's5') tl.scrollTop = 0;
  }
  const v = isRefusal() ? REFUSALS[S.refuse] : VARIANTS[S.variant];
  const key = isRefusal() ? S.refuse : S.variant;
  $('label').textContent = `${key}（${v.name}）`;
  $('vtitle').textContent = isRefusal() ? `断る画面 案 ${key}：${v.name}` : `案 ${key}：${v.name}`;
  $('vdesc').textContent = v.desc;
  $('answers').innerHTML = isRefusal()
    ? `<div><b>5. 断る画面</b><span>${v.name}</span></div>`
    : ['1. どこに出す', '2. 煩わしさ', '3. 読み返す'].map((q, i) => `<div><b>${q}</b><span>${v.a[i]}</span></div>`).join('') + `<div><b>4. 見分け</b><span>${{ word: '種類の語だけ', icon: '印と太字の種類の語', red: '赤い印' }[S.mark]}</span></div>`;
  $('tlCtrls').hidden = isRefusal(); $('rfCtrls').hidden = !isRefusal();
  $('mark-' + S.mark).checked = true; $('list').checked = S.list; $('subnote').checked = S.subnote;
  document.querySelectorAll('#scenes input').forEach((r) => { r.checked = r.value === S.scene; });
  $('state').textContent = JSON.stringify(isRefusal()
    ? { 場面: SCENES[S.scene].name, 案: key, サインインを押した: S.yPressed, 解約の案内: S.subnote }
    : { 場面: SCENES[S.scene].name, 案: key, 告知: sceneAnns().map((id) => ({ 題: ANN[id].title, 宛先: ANN[id].to, 大事: ANN[id].imp, 状態: S.closed.has(id) ? '閉じた' : S.read.has(id) ? '読んだ' : 'まだ' })), 同意: ANN.terms && S.scene === 's3' ? S.agreed : undefined, 開いているシート: S.sheet ? S.sheet.type + (S.sheet.page ? '/' + S.sheet.page : '') : null }, null, 2);
  try { history.replaceState(null, '', '#' + key + '-' + S.scene); } catch (e) { /* 試作なので無視 */ }
}
function launch() { // アプリを開いたとき。C だけ、まだ読んでいない大事な告知をシートで出す
  S.sheet = null;
  if (S.variant === 'C' && !isRefusal()) {
    const id = unread().find((x) => ANN[x].imp);
    if (id) S.sheet = ANN[id].consent ? { type: 'consent' } : { type: 'detail', id, launch: true };
  }
}
function reset() { S.read.clear(); S.closed.clear(); S.agreed = false; S.yPressed = false; launch(); }

/* ---------- 操作 ---------- */
$('phone').addEventListener('click', (e) => {
  const t = e.target.closest('button,[data-scrim]'); if (!t) return;
  const d = t.dataset;
  if (t.id === 'openAcct') S.sheet = { type: 'account', page: 'root' };
  else if (t.id === 'yApple') S.yPressed = true;
  else if (t.id === 'bline') { const u = unread(); if (ANN[u[0]].consent) S.sheet = { type: 'consent' }; else if (u.length === 1) { S.sheet = { type: 'detail', id: u[0] }; S.read.add(u[0]); } else { u.forEach((id) => { if (!ANN[id].consent) S.read.add(id); }); S.sheet = { type: 'account', page: 'list' }; } }
  else if (d.open) { S.sheet = { type: 'detail', id: d.open }; S.read.add(d.open); }
  else if (d.close) S.closed.add(d.close);
  else if (d.consent) S.sheet = { type: 'consent' };
  else if (d.agree) { S.agreed = true; S.read.add('terms'); S.sheet = null; }
  else if (d.done) { if (S.sheet && S.sheet.type === 'detail') S.read.add(S.sheet.id); S.sheet = null; }
  else if (d.page) { S.sheet = { type: 'account', page: d.page, id: d.id }; if (d.id && ANN[d.id] && !ANN[d.id].consent) S.read.add(d.id); }
  else if (d.scrim && e.target === t) { if (S.sheet && S.sheet.type === 'detail') S.read.add(S.sheet.id); S.sheet = null; }
  else return;
  render();
});
$('scenes').innerHTML = Object.entries(SCENES).map(([k, s]) => `<label><input type="radio" name="scene" value="${k}" id="scene-${k}"> ${s.name}</label>`).join('');
$('scenes').addEventListener('change', (e) => { S.scene = e.target.value; reset(); render(); });
document.querySelectorAll('input[name=mark]').forEach((r) => r.addEventListener('change', () => { S.mark = r.value; render(); }));
$('list').addEventListener('change', (e) => { S.list = e.target.checked; render(); });
$('subnote').addEventListener('change', (e) => { S.subnote = e.target.checked; render(); });
$('relaunch').addEventListener('click', () => { reset(); render(); });
function cycle(step) {
  if (isRefusal()) { const k = Object.keys(REFUSALS); S.refuse = k[(k.indexOf(S.refuse) + step + k.length) % k.length]; S.yPressed = false; }
  else { const k = Object.keys(VARIANTS); S.variant = k[(k.indexOf(S.variant) + step + k.length) % k.length]; S.list = VARIANTS[S.variant].list; reset(); }
  render();
}
$('prev').addEventListener('click', () => cycle(-1));
$('next').addEventListener('click', () => cycle(1));
document.addEventListener('keydown', (e) => {
  if (e.target.closest('input,textarea,[contenteditable]')) return;
  if (e.key === 'ArrowLeft') cycle(-1); if (e.key === 'ArrowRight') cycle(1);
});
launch(); render();
</script>
