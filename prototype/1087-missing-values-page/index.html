<title>足りない値のページの試作</title>
<meta name="claude:viewport-fit-sides" content="cover">
<!--
  試作（#1087）。捨てる前提。main には入れない。
  問い1: 範囲の外の値をどう知らせるか、空の欄に何を出すか（Issue の 1・4）。A / B / C
  問い2: 生まれた年をどう選ぶか（Issue の 5）。P / Q / R
  どの案にも、決めごとが要らない直し（テンキーの「完了」、行のどこを押しても欄に入る、
  欄を1日の丸の帯とテンキーのあいだに送る）を入れてある（Issue の 2・3・6）。
-->
<style>
  /* iPhone の画面に寄せた1画面。外枠の下に問いと案の切り替え */
  :root {
    --page: #e9e9ee; --bg: #f2f2f7; --surface: #ffffff; --fill: rgba(118,118,128,.12);
    --fg: #000000; --fg2: rgba(60,60,67,.6); --fg3: rgba(60,60,67,.3);
    --primary: #2f7d5b; --danger: #d70015; --sep: rgba(60,60,67,.18);
    --key: #ffffff; --keypad: #d1d3d9; --bar: #1c1c1e; --bar-fg: #ffffff;
    --font: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --page: #0b0b0d; --bg: #000000; --surface: #1c1c1e; --fill: rgba(118,118,128,.24);
    --fg: #ffffff; --fg2: rgba(235,235,245,.6); --fg3: rgba(235,235,245,.3);
    --primary: #4cb488; --danger: #ff6961; --sep: rgba(84,84,88,.6);
    --key: #6b6b6f; --keypad: #2c2c2e; --bar: #f2f2f7; --bar-fg: #000000; color-scheme: dark } }
  :root[data-theme="dark"] {
    --page: #0b0b0d; --bg: #000000; --surface: #1c1c1e; --fill: rgba(118,118,128,.24);
    --fg: #ffffff; --fg2: rgba(235,235,245,.6); --fg3: rgba(235,235,245,.3);
    --primary: #4cb488; --danger: #ff6961; --sep: rgba(84,84,88,.6);
    --key: #6b6b6f; --keypad: #2c2c2e; --bar: #f2f2f7; --bar-fg: #000000; color-scheme: dark }
  body { background: var(--page); color: var(--fg); font-family: var(--font);
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 16px 96px; }
  .wrap { max-width: 390px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
  .q { display: flex; gap: 6px; }
  .q button { flex: 1; font: inherit; font-size: 13px; padding: 8px; border-radius: 10px; border: 1px solid var(--sep);
    background: var(--surface); color: var(--fg); cursor: pointer; }
  .q button[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
  .about { font-size: 13px; line-height: 1.6; color: var(--fg2); margin: 0; }
  .about b { color: var(--fg); }

  .phone { position: relative; height: 760px; border-radius: 40px; overflow: hidden; background: var(--bg);
    border: 8px solid var(--bar); max-width: 100%; }
  .nav { height: 44px; display: grid; place-items: center; font-weight: 600; font-size: 17px; background: var(--bg); }
  .band { position: absolute; top: 44px; left: 0; right: 0; height: 64px; z-index: 3; display: flex; align-items: center;
    gap: 10px; padding: 0 16px; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(12px);
    border-bottom: .5px solid var(--sep); }
  .ring { width: 40px; height: 40px; border-radius: 50%; border: 5px solid var(--fill); border-top-color: var(--primary); flex: none; }
  .band small { font-size: 12px; color: var(--fg2); }
  .scroll { position: absolute; top: 44px; bottom: 0; left: 0; right: 0; overflow-y: auto; padding: 76px 12px 90px; scroll-behavior: smooth; }
  .bubble { font-size: 15px; color: var(--fg2); margin: 0 4px 12px; line-height: 1.5; }
  .card { background: var(--surface); border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .card h2 { font-size: 17px; font-weight: 600; margin: 0; line-height: 1.35; }
  .dots { display: flex; gap: 4px; } .dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--fill); }
  .dots i.on { background: var(--primary); }

  .row { display: flex; flex-direction: column; gap: 4px; }
  .line { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 44px; cursor: text; }
  .line > span:first-child { font-size: 17px; }
  .field { display: inline-flex; align-items: center; gap: 4px; min-height: 44px; padding: 0 12px; border-radius: 10px;
    background: var(--fill); border: 1.5px solid transparent; font-size: 17px; }
  .field.focus { background: var(--surface); border-color: var(--primary); }
  .field.bad { border-color: var(--danger); }
  .val { min-width: 64px; text-align: right; font-variant-numeric: tabular-nums; }
  .val.ph { color: var(--fg3); }
  .caret { display: inline-block; width: 2px; height: 20px; background: var(--primary); vertical-align: -3px; animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .caret { animation: none; } .scroll { scroll-behavior: auto; } }
  .unit { color: var(--fg2); }
  .note { font-size: 13px; color: var(--fg2); text-align: right; line-height: 1.4; }
  .note.err { color: var(--danger); }
  .seg { display: inline-flex; background: var(--fill); border-radius: 9px; padding: 2px; }
  .seg span { padding: 6px 16px; border-radius: 7px; font-size: 14px; }
  .seg span.on { background: var(--surface); box-shadow: 0 1px 3px rgba(0,0,0,.15); }
  .act { display: flex; justify-content: space-between; align-items: center; padding: 12px; border-radius: 10px; background: var(--fill); font-size: 15px; }
  .act .chk { color: var(--primary); font-weight: 700; }
  .menu-btn { color: var(--primary); font-size: 17px; display: inline-flex; gap: 4px; align-items: center; }
  .foot { display: flex; justify-content: space-between; align-items: center; padding-top: 4px; }
  .back { color: var(--primary); font-size: 17px; background: none; border: 0; padding: 10px 0; font: inherit; cursor: pointer; }
  .next { font: inherit; font-size: 17px; font-weight: 600; padding: 10px 20px; border-radius: 999px; border: 0;
    background: var(--primary); color: #fff; cursor: pointer; }
  .next:disabled { background: var(--fill); color: var(--fg3); cursor: default; }
  .next-why { font-size: 13px; color: var(--fg2); text-align: right; }

  .composer { position: absolute; left: 0; right: 0; bottom: 0; z-index: 2; padding: 8px 12px 22px; display: flex; gap: 8px; align-items: center;
    background: var(--bg); border-top: .5px solid var(--sep); }
  .composer i { width: 36px; height: 36px; border-radius: 50%; background: var(--fill); flex: none; }
  .composer i:first-child { background: var(--primary); }
  .composer span { flex: 1; height: 36px; border-radius: 18px; border: 1px solid var(--sep); }

  .kb { position: absolute; left: 0; right: 0; bottom: 0; z-index: 5; background: var(--keypad); transform: translateY(100%); transition: transform .25s; }
  .kb.open { transform: none; }
  .kb .tool { display: flex; justify-content: flex-end; padding: 6px 12px; background: color-mix(in srgb, var(--keypad) 80%, var(--surface)); }
  .kb .tool button { font: inherit; font-size: 17px; font-weight: 600; color: var(--primary); background: none; border: 0; padding: 6px 8px; cursor: pointer; }
  .keys { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; padding: 6px 6px 28px; }
  .keys button { font: inherit; font-size: 24px; height: 46px; border: 0; border-radius: 6px; background: var(--key); color: var(--fg); cursor: pointer; box-shadow: 0 1px 0 rgba(0,0,0,.3); }
  .keys button.dim { background: transparent; box-shadow: none; }

  .pop { position: absolute; z-index: 6; right: 24px; width: 200px; max-height: 300px; overflow-y: auto; background: var(--surface);
    border-radius: 14px; box-shadow: 0 10px 40px rgba(0,0,0,.3); }
  .pop div { padding: 11px 16px; font-size: 16px; border-bottom: .5px solid var(--sep); cursor: pointer; display: flex; justify-content: space-between; }
  .pop div.head { color: var(--fg2); font-size: 13px; cursor: default; }
  .wheel { position: relative; height: 180px; overflow-y: auto; scroll-snap-type: y mandatory; border-radius: 10px; background: var(--fill); }
  .wheel div { height: 36px; display: grid; place-items: center; scroll-snap-align: center; font-size: 20px; color: var(--fg2); font-variant-numeric: tabular-nums; }
  .wheel div.mid { color: var(--fg); font-weight: 600; }
  .wheel-pad { height: 72px !important; }
  .wheel-wrap { position: relative; } .wheel-wrap::after { content: ""; position: absolute; left: 8px; right: 8px; top: 72px; height: 36px;
    border-radius: 8px; background: var(--fill); pointer-events: none; }
  .wheel-act { display: flex; justify-content: flex-end; }
  .wheel-act button { font: inherit; font-size: 15px; color: var(--primary); background: none; border: 0; padding: 8px 4px; cursor: pointer; }

  .toast { position: absolute; left: 50%; top: 120px; transform: translateX(-50%); z-index: 9; background: var(--bar); color: var(--bar-fg);
    padding: 10px 16px; border-radius: 12px; font-size: 14px; white-space: nowrap; }
  .state { font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--fg2); background: var(--surface); border-radius: 10px; padding: 10px 12px; white-space: pre-wrap; margin: 0; }

  .switcher { position: fixed; z-index: 20; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px));
    display: flex; align-items: center; gap: 4px; background: var(--bar); color: var(--bar-fg); border-radius: 999px; padding: 6px; box-shadow: 0 6px 24px rgba(0,0,0,.3); }
  .switcher button { font: inherit; font-size: 18px; width: 40px; height: 40px; border-radius: 50%; border: 0; background: transparent; color: inherit; cursor: pointer; }
  .switcher span { font-size: 14px; padding: 0 8px; min-width: 200px; text-align: center; }
  button:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
</style>

<div class="wrap">
  <div class="q">
    <button id="q1" aria-pressed="true">問い1: 範囲の外と空の欄</button>
    <button id="q2" aria-pressed="false">問い2: 生まれた年</button>
  </div>
  <p class="about" id="about"></p>
  <div class="phone" id="phone">
    <div class="nav">11月22日</div>
    <div class="band"><div class="ring"></div><div><div>0 / 1,850 kcal</div><small>1日の丸の帯</small></div></div>
    <div class="scroll" id="scroll"></div>
    <div class="composer"><i></i><i></i><i></i><span></span></div>
    <div class="kb" id="kb">
      <div class="tool"><button id="done">完了</button></div>
      <div class="keys" id="keys"></div>
    </div>
  </div>
  <pre class="state" id="state"></pre>
</div>
<div class="switcher"><button id="prev" aria-label="前の案">‹</button><span id="label"></span><button id="nextv" aria-label="次の案">›</button></div>

<script>
const RANGE = { height: [100, 250, 'cm'], weight: [20, 300, 'kg'], birth: [1906, 2016, '年'] };
const VARIANTS = {
  1: [
    ['A', '抜けたら知らせる', '空の欄には何も出さない。範囲の外のまま欄から抜けると（「完了」・ほかの欄を押す）、欄の下に赤で範囲を1行出す。「次へ」はそろうまで灰色。'],
    ['B', '範囲を先に見せる', '空の欄には何も出さない。欄の下に受け付ける範囲をいつも灰色で出し、範囲の外のまま抜けると同じ行が赤になる。「次へ」はそろうまで灰色。'],
    ['C', '押してから知らせる', '空の欄に「例: 170」と出す。「次へ」はいつも押せ、押したときに足りない欄と範囲の外の欄を赤くして、最初の欄へ送る。'],
    ['D', 'ホイールで選ぶ', '打たせずに選ばせる（HIG の Entering data）。行を押すと行の下にホイールが開き、受け付ける範囲の値だけが並ぶ。始めは 170 cm・65.0 kg の位置だが、「これにする」を押すまでは入っていない。テンキーは出ない。'],
  ],
  2: [
    ['P', '年代から選ぶ', '行のどこを押してもメニューが開く。まず年代（1990年代など）を選び、次にその年代の10年から選ぶ。2回押すが送らずに届く。'],
    ['Q', 'ホイール', '行を押すと、行の下にホイールが開く。始めは1990年の位置にあるが、回すか「これにする」を押すまでは入っていない。'],
    ['R', '数字で打つ', '身長・体重と同じく数字のキーで 4 桁を打つ。範囲の外は問い1の A と同じく、抜けたら欄の下に出す。'],
  ],
};
const S = { q: 1, i: 0, height: '', weight: '', birth: null, focus: null, left: {}, submitted: false, pop: null, wheel: false, toast: '' };
const $ = id => document.getElementById(id);
const variant = () => VARIANTS[S.q][S.i][0];

function num(f) { const s = f === 'birth' ? (S.birthText ?? '') : S[f]; return s === '' || s === '.' ? null : Number(s); }
function inRange(f, n) { const [lo, hi] = RANGE[f]; return n != null && n >= lo && n <= hi; }
function birthValue() { return variant() === 'R' ? num('birth') : S.birth; }
function complete() {
  return inRange('height', num('height')) && inRange('weight', num('weight')) && inRange('birth', birthValue());
}
function fmtRange(f) { const [lo, hi, u] = RANGE[f]; return f === 'birth' ? `${lo}〜${hi}年` : `${lo}〜${hi} ${u}`; }

function reset() {
  Object.assign(S, { height: '', weight: '', birth: null, birthText: '', focus: null, left: {}, submitted: false, pop: null, wheel: false, toast: '' });
  if (S.q === 2) { S.height = '170'; S.weight = '65'; }
  else { S.birth = 1990; }
}

function wheelList(id, values, start, fmt) {
  return `<div class="wheel-wrap" style="flex:1"><div class="wheel" id="${id}" data-start="${start}"><div class="wheel-pad"></div>${values.map(x => `<div data-y="${x}">${fmt(x)}</div>`).join('')}<div class="wheel-pad"></div></div></div>`;
}
function range(lo, hi) { const a = []; for (let x = lo; x <= hi; x++) a.push(x); return a; }
function wheelRow(f, label) {
  const raw = S[f], unit = RANGE[f][2], open = S.wheel === f;
  const text = raw === '' ? '選ぶ' : `${Number(raw).toLocaleString('ja-JP', { minimumFractionDigits: f === 'weight' ? 1 : 0 })} ${unit}`;
  let extra = '';
  if (open) {
    const wheels = f === 'height'
      ? wheelList('wh-height', range(100, 250), 170, x => `${x} cm`)
      : wheelList('wh-weight-i', range(20, 300), 65, x => `${x}`) + wheelList('wh-weight-d', range(0, 9), 0, x => `.${x} kg`);
    extra = `<div style="display:flex;gap:6px">${wheels}</div><div class="wheel-act"><button data-act="wheel-set" data-f="${f}">これにする</button></div>`;
  }
  return `<div class="row" id="row-${f}"><div class="line" data-act="wheel-open" data-f="${f}" style="cursor:pointer"><span>${label}</span>
    <span class="menu-btn" style="${raw === '' ? '' : 'color:var(--fg)'}">${text} ⌃⌄</span></div>${extra}</div>`;
}

function numberRow(f, label) {
  if (variant() === 'D' && f !== 'birth') return wheelRow(f, label);
  const v = variant(), raw = f === 'birth' ? S.birthText : S[f], n = num(f), focused = S.focus === f;
  const out = n != null && !inRange(f, n);
  const showErr = out && ((v === 'C' && S.submitted) || (v !== 'C' && S.left[f] && !focused));
  const missingErr = v === 'C' && S.submitted && n == null;
  const ph = v === 'C' ? (f === 'height' ? '例: 170' : f === 'weight' ? '例: 65.0' : '例: 1990') : '';
  const unit = f === 'birth' ? '年' : RANGE[f][2];
  const shown = raw === '' ? `<span class="val ph">${focused ? '' : ph}</span>` : `<span class="val">${f === 'birth' ? raw : Number(raw.replace(/\.$/, '')).toLocaleString('ja-JP', { maximumFractionDigits: 1 }) + (raw.endsWith('.') ? '.' : '')}</span>`;
  let note = '';
  if (showErr) note = `<div class="note err">${fmtRange(f)}で入れてください</div>`;
  else if (missingErr) note = `<div class="note err">入れてください</div>`;
  else if (v === 'B') note = `<div class="note">${fmtRange(f)}</div>`;
  return `<div class="row" id="row-${f}" data-focus="${f}">
    <div class="line"><span>${label}</span>
      <span class="field ${focused ? 'focus' : ''} ${showErr || missingErr ? 'bad' : ''}">${shown}${focused ? '<span class="caret"></span>' : ''}<span class="unit">${unit}</span></span>
    </div>${note}</div>`;
}

function birthRow() {
  const v = variant();
  if (S.q === 1) return `<div class="row"><div class="line"><span>生まれた年</span><span class="menu-btn">1990年 ⌃⌄</span></div></div>`;
  if (v === 'R') return numberRow('birth', '生まれた年');
  const text = S.birth ? `${S.birth}年` : '選ぶ';
  let extra = '';
  if (v === 'Q' && S.wheel) {
    const years = []; for (let y = 2016; y >= 1906; y--) years.push(y);
    extra = `<div class="wheel-wrap"><div class="wheel" id="wheel"><div class="wheel-pad"></div>${years.map(y => `<div data-y="${y}">${y}年</div>`).join('')}<div class="wheel-pad"></div></div></div>
      <div class="wheel-act"><button data-act="wheel-ok">これにする</button></div>`;
  }
  return `<div class="row" id="row-birth"><div class="line" data-act="birth-open" style="cursor:pointer"><span>生まれた年</span>
    <span class="menu-btn" style="${S.birth ? '' : ''}">${text} ⌃⌄</span></div>${extra}</div>`;
}

function render() {
  const [key, name, desc] = VARIANTS[S.q][S.i];
  $('q1').setAttribute('aria-pressed', S.q === 1); $('q2').setAttribute('aria-pressed', S.q === 2);
  $('label').textContent = `${key}（${name}）`;
  $('about').innerHTML = `<b>${key} ${name}</b>: ${desc}<br>どの案にも、テンキーの「完了」、行のどこを押しても欄に入る、欄を帯とテンキーのあいだに送る、を入れてある。`;
  const ok = complete(), v = variant();
  const disabled = v === 'C' ? false : !ok;
  $('scroll').innerHTML = `
    <p class="bubble">目標を立てましょう。ヘルスケアから読めなかった値を入れてください。</p>
    <div class="card">
      <div class="dots"><i class="on"></i><i class="on"></i><i class="on"></i><i></i><i></i></div>
      <h2>1日の目安の計算に使う値を入れてください</h2>
      ${numberRow('height', '身長')}
      ${birthRow()}
      <div class="row"><div class="line"><span>性別</span><span class="seg"><span class="on">男性</span><span>女性</span></span></div></div>
      <div class="row"><span style="font-size:17px">活動量</span>
        <div class="act">座っていることが多い<span></span></div>
        <div class="act">立つ・歩くことが多い<span class="chk">✓</span></div>
        <div class="act">体を動かす仕事・運動が多い<span></span></div></div>
      ${numberRow('weight', '今の体重')}
      <div class="foot"><button class="back">戻る</button><button class="next" id="next" ${disabled ? 'disabled' : ''}>次へ</button></div>
    </div>`;
  const pop = document.querySelector('.pop'); if (pop) pop.remove();
  if (S.pop) {
    const el = document.createElement('div'); el.className = 'pop';
    const row = $('row-birth'); el.style.top = Math.max(110, row.getBoundingClientRect().top - $('phone').getBoundingClientRect().top + 40) + 'px';
    if (S.pop === 'decade') { el.innerHTML = '<div class="head">年代</div>' + [2010,2000,1990,1980,1970,1960,1950,1940,1930,1920,1910,1900].map(d => `<div data-decade="${d}">${d}年代<span>›</span></div>`).join(''); }
    else { const d = S.pop; el.innerHTML = `<div class="head" data-act="pop-back" style="cursor:pointer">‹ ${d}年代</div>` + Array.from({ length: 10 }, (_, k) => d + k).filter(y => y >= 1906 && y <= 2016).map(y => `<div data-year="${y}">${y}年${S.birth === y ? '<span>✓</span>' : ''}</div>`).join(''); }
    $('phone').appendChild(el);
  }
  if (S.toast) { const t = document.createElement('div'); t.className = 'toast'; t.textContent = S.toast; $('phone').appendChild(t); setTimeout(() => { t.remove(); S.toast = ''; }, 1600); }
  if (v === 'Q' && S.wheel) { const w = $('wheel'); w.dataset.start = '1990'; }
  document.querySelectorAll('.wheel').forEach(w => {
    const target = w.querySelector(`[data-y="${w.dataset.start}"]`); w.scrollTop = target.offsetTop - 72; markWheel(w); w.onscroll = () => markWheel(w);
  });
  $('kb').classList.toggle('open', !!S.focus);
  $('state').textContent = `状態  身長: ${S.height || '空'} / 生まれた年: ${birthValue() ?? '空'} / 今の体重: ${S.weight || '空'}\n欄: ${S.focus ?? 'なし'} / そろって範囲内: ${ok ? 'はい' : 'いいえ'} / 「次へ」: ${disabled ? '押せない' : '押せる'}`;
}
let wheelMoved = false;
function markWheel(w) {
  const mid = w.scrollTop + 90;
  w.querySelectorAll('[data-y]').forEach(d => d.classList.toggle('mid', Math.abs(d.offsetTop + 18 - mid) < 18));
}

function scrollToField(f) {
  // 欄を1日の丸の帯（上 64px）とテンキー（下 約300px）のあいだに送る
  requestAnimationFrame(() => {
    const row = $('row-' + f), sc = $('scroll'); if (!row) return;
    const top = row.offsetTop, visibleTop = sc.scrollTop + 76, visibleBottom = sc.scrollTop + sc.clientHeight - 300;
    if (top < visibleTop || top + row.offsetHeight > visibleBottom) sc.scrollTop = top - 76 - 40;
  });
}
function setFocus(f) {
  if (S.focus && S.focus !== f) S.left[S.focus] = true;
  S.focus = f; S.pop = null; render(); if (f) scrollToField(f);
}

$('keys').innerHTML = ['1','2','3','4','5','6','7','8','9','.','0','⌫'].map(k => `<button data-key="${k}">${k}</button>`).join('');
$('keys').addEventListener('click', e => {
  const k = e.target.dataset.key; if (!k || !S.focus) return;
  const prop = S.focus === 'birth' ? 'birthText' : S.focus; let s = S[prop] ?? '';
  if (k === '⌫') s = s.slice(0, -1);
  else if (k === '.') { if (S.focus !== 'birth' && !s.includes('.')) s = (s || '0') + '.'; }
  else if (s.length < 7) s += k;
  S[prop] = s; render();
});
$('done').onclick = () => setFocus(null);
$('phone').addEventListener('click', e => {
  if (e.target.closest('.kb') || e.target.closest('.pop') && !e.target.dataset.decade && !e.target.dataset.year && e.target.dataset.act !== 'pop-back') return;
  const t = e.target;
  if (t.dataset.decade) { S.pop = Number(t.dataset.decade); render(); return; }
  if (t.closest('[data-year]')) { S.birth = Number(t.closest('[data-year]').dataset.year); S.pop = null; render(); return; }
  if (t.dataset.act === 'pop-back') { S.pop = 'decade'; render(); return; }
  if (t.dataset.act === 'wheel-ok') { const m = document.querySelector('#wheel .mid'); if (m) S.birth = Number(m.dataset.y); S.wheel = false; render(); return; }
  if (t.dataset.act === 'wheel-set') {
    const mid = id => document.querySelector(`#${id} .mid`)?.dataset.y;
    S[t.dataset.f] = t.dataset.f === 'height' ? mid('wh-height') : `${mid('wh-weight-i')}.${mid('wh-weight-d')}`;
    S.wheel = false; render(); return;
  }
  if (t.closest('[data-act="wheel-open"]')) { const f = t.closest('[data-act="wheel-open"]').dataset.f; S.wheel = S.wheel === f ? false : f; render(); scrollToField(f); return; }
  if (t.closest('.wheel')) return;
  if (t.closest('[data-act="birth-open"]')) { if (S.focus) S.left[S.focus] = true; S.focus = null;
    if (variant() === 'P') S.pop = S.pop ? null : 'decade'; else S.wheel = !S.wheel; render(); return; }
  const row = t.closest('[data-focus]');
  if (row) { setFocus(row.dataset.focus); return; }
  if (t.id === 'next') {
    if (variant() === 'C' && !complete()) { S.submitted = true; if (S.focus) S.left[S.focus] = true; S.focus = null; render();
      const first = ['height', 'birth', 'weight'].find(f => f !== 'birth' ? !inRange(f, num(f)) : !inRange('birth', birthValue()));
      if (first) setFocus(first); return; }
    S.toast = '目標案のページに進みました'; if (S.focus) S.left[S.focus] = true; S.focus = null; render(); return;
  }
  if (S.pop) { S.pop = null; render(); }
});
$('scroll').addEventListener('wheel', () => {}, { passive: true });
function go(q, i) { const n = VARIANTS[q].length; S.q = q; S.i = (i + n) % n; reset(); render(); }
$('q1').onclick = () => go(1, 0); $('q2').onclick = () => go(2, 0);
$('prev').onclick = () => go(S.q, S.i - 1); $('nextv').onclick = () => go(S.q, S.i + 1);
document.addEventListener('keydown', e => { if (e.key === 'ArrowLeft') go(S.q, S.i - 1); if (e.key === 'ArrowRight') go(S.q, S.i + 1); });
reset(); render();
</script>
