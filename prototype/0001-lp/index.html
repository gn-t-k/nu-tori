  PROTOTYPE（捨てる前提）: 「LP の見た目と文言を見比べる」(#594) の試作、2版目。

  下のバーで2つの軸を切り替えて見比べる。
    見出し: H1 柱を2つ並べる ／ H2 操作は2つだけ ／ H3 体重が目安を決める（ファーストビューの組み方も変わる）
    並び:   O1 方針どおり ／ O2 不満の多い順 ／ O3 競合が書いていない順
  「根拠」を入れると、各節の文言の根拠（調査・決定）と、推測かどうかを出す（docs/agents/marketing.md）。
  状態は URL の # に入れる（例 #h2-o3-n）。← → で見出しを回す。
  画面と数値は見本で、開発者の記録ではない。料金は「課金の形を決める」(#461) まで未定。
  色と文字は DESIGN.md のトークンを写す（システムのフォント、Primary は systemIndigo）。
  App Store のバッジは Apple のマーケティングの道具から取った日本語の公式のもの。予約注文のバッジは取り方を
  確かめていない（調査の AP9）ので、ダウンロードのバッジで代わりに置いている。
-->

    }
  }
  :root[data-theme="dark"] {
    --primary: #6D7CFF;
    --background: #000000;
    --surface: #1C1C1E;
    --on-surface: #FFFFFF;
    --secondary: rgba(235, 235, 245, 0.6);
    --tertiary: rgba(235, 235, 245, 0.3);
    --fill: #323236;
    --separator: rgba(84, 84, 88, 0.6);
    --protein: #E8903A;
    --fat: #228C48;
    --carb: #4290F4;
    --ring-track: #2C2C2E;
    --own-record: color-mix(in srgb, #6D7CFF 30%, #1C1C1E);
    --note-bg: #2E2609;
    --note-fg: #F3DE9A;
    --note-border: #7A6420;
    --bar-bg: #F2F2F7;
    --bar-fg: #000000;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  body {
    background: var(--background);
    color: var(--on-surface);
    font-family: var(--font);
    font-size: 17px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  .wrap {
    max-width: 1040px;
    margin: 0 auto;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  h1, h2, h3 { text-wrap: balance; margin: 0; }
  p { margin: 0; }
  a { color: var(--primary); }
  :focus-visible { outline: 3px solid var(--primary); outline-offset: 2px; }

  .site-header { padding-block: 16px 0; }
  .logo { font-weight: 700; font-size: 20px; letter-spacing: 0.01em; }
  .logo small { font-weight: 400; font-size: 13px; color: var(--secondary); margin-left: 8px; }

  /* App Store のバッジ: 高さ 40、周りに高さの 1/4 の余白。目立たせすぎない（Apple のガイドライン） */
  .badge { display: inline-block; padding: 10px; margin: -10px; line-height: 0; }
  .badge img { height: 40px; width: auto; display: block; }
  .badge-note { font-size: 13px; color: var(--secondary); }

  /* ヒーロー共通 */
  .hero { padding-block: 24px 48px; }
  .hero h1 { font-size: clamp(30px, 5.6vw, 48px); line-height: 1.25; letter-spacing: -0.01em; font-weight: 800; }
  .hero .lead { font-size: clamp(16px, 2.1vw, 19px); color: var(--secondary); margin-top: 14px; max-width: 34em; }
  .hero .actions { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; margin-top: 24px; }

  /* H1: 文と画面を左右に */
  .hero-h1 h1 { font-size: clamp(30px, 4.4vw, 42px); }
  .hero-h1 .grid { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 0.85fr); gap: 40px; align-items: center; }
  .pillars { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 28px; }
  .pillar { background: var(--surface); border-radius: 12px; padding: 16px; }
  .pillar b { display: block; font-size: 15px; }
  .pillar span { font-size: 15px; color: var(--secondary); }

  /* H2: 大きな見出しを真ん中に、下に2つの操作と、その結果 */
  .hero-h2 { text-align: center; }
  .hero-h2 h1 { font-size: clamp(32px, 7vw, 60px); }
  .hero-h2 .lead { margin-inline: auto; }
  .hero-h2 .actions { justify-content: center; flex-direction: column; }
  .steps { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-top: 36px; text-align: left; }
  .step { background: var(--surface); border-radius: 12px; padding: 16px; display: grid; gap: 10px; align-content: start; }
  .step .when { font-size: 13px; color: var(--secondary); }
  .step b { font-size: 17px; }
  .step span { font-size: 15px; color: var(--secondary); }
  .step .mini { height: 110px; border-radius: 10px; background: var(--fill); display: grid; place-items: center; overflow: hidden; }
  .step.result { background: transparent; border: 1px solid var(--separator); }

  /* H3: グラフを主役に */
  .hero-h3 h1 { font-size: clamp(30px, 4.6vw, 44px); }
  .hero-h3 .grid { display: grid; grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.1fr); gap: 40px; align-items: center; }
  .charts { background: var(--surface); border-radius: 18px; padding: 20px; display: grid; gap: 16px; }
  .charts .label { font-size: 13px; color: var(--secondary); display: flex; justify-content: space-between; gap: 8px; }
  .charts svg { width: 100%; height: auto; display: block; }
  .sample-tag { font-size: 11px; color: var(--secondary); border: 1px solid var(--tertiary); border-radius: 4px; padding: 0 6px; white-space: nowrap; }

  /* 仮の画面。iPhone の絵は描かない（Apple は製品を模した絵を認めない）。公開の LP では
     UI テストで撮った画面を Apple の配る枠に入れる */
  .screen {
    width: 100%; max-width: 280px; margin-inline: auto; aspect-ratio: 9 / 19.5;
    border-radius: 28px; background: var(--background); border: 1px solid var(--separator);
    overflow: hidden; display: flex; flex-direction: column;
  }
  .screen-caption { text-align: center; margin-top: 10px; }
  .screen .bar { display: flex; align-items: center; justify-content: center; padding: 14px 14px 8px; font-size: 13px; font-weight: 600; }
  .screen .rings { display: flex; justify-content: space-between; padding: 0 12px 8px; }
  .screen .rings div { display: grid; justify-items: center; gap: 2px; font-size: 10px; color: var(--secondary); }
  .ring { width: 26px; height: 26px; border-radius: 50%; position: relative; }
  .ring::after { content: ""; position: absolute; inset: 4px; border-radius: 50%; background: var(--background); }
  .screen .tl { flex: 1; padding: 4px 10px; display: flex; flex-direction: column; gap: 8px; overflow: hidden; }
  .day-head { text-align: center; font-size: 11px; color: var(--secondary); }
  .rec { align-self: flex-end; width: 82%; background: var(--own-record); border-radius: 12px; padding: 8px; display: grid; grid-template-columns: 44px 1fr; gap: 8px; font-size: 11px; line-height: 1.35; text-align: left; }
  .rec .photo { width: 44px; height: 44px; border-radius: 8px; }
  .rec b { font-size: 12px; display: block; }
  .rec .muted { color: var(--secondary); }
  .rec.pending { opacity: 0.55; }
  .pfc { display: flex; gap: 6px; margin-top: 2px; }
  .pfc i { display: inline-block; width: 7px; height: 7px; border-radius: 2px; margin-right: 2px; }
  .composer { padding: 8px 10px 16px; display: flex; gap: 6px; align-items: center; }
  .composer .btn { width: 30px; height: 30px; border-radius: 50%; background: var(--fill); flex: none; }
  .composer .btn.p { background: var(--primary); }
  .composer .field { flex: 1; height: 28px; border-radius: 14px; background: var(--surface); font-size: 11px; color: var(--tertiary); display: flex; align-items: center; padding-left: 10px; }

  /* 工夫の節 */
  .features { padding-block: 24px 40px; }
  .section-title { font-size: clamp(24px, 3.4vw, 32px); font-weight: 800; line-height: 1.3; }
  .section-sub { color: var(--secondary); margin-top: 8px; max-width: 36em; }
  .feature-list { display: grid; gap: 12px; margin-top: 28px; }
  .feature {
    background: var(--surface); border-radius: 18px; padding: 24px;
    display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 0.8fr); gap: 24px; align-items: center;
  }
  .feature.no-visual { grid-template-columns: minmax(0, 1fr); }
  .feature h3 { font-size: clamp(20px, 2.6vw, 26px); line-height: 1.35; font-weight: 700; }
  .feature .body { margin-top: 12px; display: grid; gap: 8px; max-width: 34em; }
  .feature .body p { font-size: 16px; }
  .fine { font-size: 13px; color: var(--secondary); }
  .visual { border-radius: 12px; background: var(--fill); min-height: 150px; padding: 16px; display: grid; align-content: center; gap: 8px; font-size: 14px; }
  .kv { display: flex; justify-content: space-between; gap: 12px; font-variant-numeric: tabular-nums; }
  .kv span:first-child { color: var(--secondary); }
  .price-row { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  .price-box { background: var(--surface); border-radius: 10px; padding: 12px; text-align: center; }
  .price-box b { display: block; font-size: 20px; font-variant-numeric: tabular-nums; }
  .price-box span { font-size: 12px; color: var(--secondary); }

  /* 他のアプリを使ったことがある方へ */
  .switchers { padding-block: 8px 32px; }
  .switchers .box { border: 1px solid var(--separator); border-radius: 18px; padding: 24px; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 24px; align-items: center; }
  .eyebrow { font-size: 13px; color: var(--secondary); }
  .compare { display: grid; gap: 10px; font-size: 14px; }
  .compare .row { display: grid; grid-template-columns: 6em 1fr; gap: 8px; align-items: center; }
  .compare .row span:first-child { color: var(--secondary); font-size: 13px; }
  .flow { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .flow em { font-style: normal; background: var(--fill); border-radius: 9999px; padding: 2px 10px; font-size: 13px; }
  .flow .arrow { color: var(--tertiary); }

  /* よくある質問（異論への答え） */
  .faq { padding-block: 8px 32px; }
  .faq dl { margin: 20px 0 0; display: grid; gap: 0; background: var(--surface); border-radius: 10px; overflow: hidden; }
  .faq .qa { padding: 16px; border-top: 1px solid var(--separator); }
  .faq .qa:first-child { border-top: 0; }
  .faq dt { font-weight: 600; }
  .faq dd { margin: 4px 0 0; color: var(--secondary); font-size: 15px; }

  .closing { padding-block: 16px 48px; text-align: center; }
  .closing h2 { font-size: clamp(22px, 3vw, 28px); font-weight: 800; }
  .closing p { margin-top: 10px; }

  footer { border-top: 1px solid var(--separator); padding-block: 24px 140px; font-size: 13px; color: var(--secondary); }
  footer .wrap { display: grid; gap: 10px; }
  footer nav { display: flex; flex-wrap: wrap; gap: 8px 20px; }
  footer nav a { color: var(--secondary); }

  /* 根拠のメモ（評価のためのもので、LP の一部ではない） */
  .note {
    display: none; margin-top: 12px; padding: 10px 12px; border-radius: 8px;
    background: var(--note-bg); color: var(--note-fg); border: 1px dashed var(--note-border);
    font-size: 13px; line-height: 1.55; text-align: left;
  }
  .show-notes .note { display: block; }
  .note .tag { display: inline-block; font-size: 11px; font-weight: 700; padding: 0 6px; border-radius: 4px; border: 1px solid var(--note-border); margin-right: 6px; }
  .note code { font-size: 12px; }

  /* 試作の切り替えバー（LP の一部ではない） */
  .proto-bar {
    position: fixed; z-index: 20;
    left: 50%; transform: translateX(-50%);
    bottom: calc(12px + env(safe-area-inset-bottom, 0px));
    width: min(640px, calc(100% - 24px - env(safe-area-inset-left, 0px) - env(safe-area-inset-right, 0px)));
    background: var(--bar-bg); color: var(--bar-fg);
    border-radius: 18px; padding: 10px 12px;
    display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; justify-content: center;
    font-size: 12px; box-shadow: 0 6px 24px rgba(0,0,0,0.25);
  }
  .proto-bar .grp { display: flex; align-items: center; gap: 6px; }
  .proto-bar .grp > span { opacity: 0.7; }
  .seg { display: flex; border-radius: 9999px; overflow: hidden; border: 1px solid color-mix(in srgb, var(--bar-fg) 30%, transparent); }
  .seg button { background: transparent; color: inherit; border: 0; font: inherit; padding: 6px 10px; cursor: pointer; min-height: 32px; }
  .seg button[aria-pressed="true"] { background: var(--bar-fg); color: var(--bar-bg); font-weight: 700; }
  .proto-bar .current { width: 100%; text-align: center; opacity: 0.85; }

  @media (max-width: 760px) {
    .hero-h1 .grid, .hero-h3 .grid, .feature, .switchers .box { grid-template-columns: minmax(0, 1fr); }
    .steps, .pillars { grid-template-columns: minmax(0, 1fr); }
    .screen { max-width: 230px; }
    .proto-bar .current { display: none; }
  }
</style>

  // ---- 見本の画面の部品 ----
  function ringStyle(p, f, c) {
    // P・F・C の kcal の割合で起点から時計回りに塗り、残りは輪の地（DESIGN.md の1日の丸）
    const a = p, b = p + f, d = p + f + c;
    return `background: conic-gradient(var(--protein) 0 ${a}%, var(--fat) ${a}% ${b}%, var(--carb) ${b}% ${d}%, var(--ring-track) ${d}% 100%)`;
  }
  const photo = (h1, h2) => `background: linear-gradient(135deg, ${h1}, ${h2})`;

  // 見本の体重の傾向と1日の目安（作り物）。縦軸を2本にせず、グラフを2つに分ける（DESIGN.md）
  function charts() {
    const W = 520, H = 130, padL = 40, padR = 12, padT = 10, padB = 22;
    const weeks = 8;
    const trend = Array.from({ length: weeks * 7 }, (_, i) => 68.0 - i * 0.032);
    const raw = trend.map((v, i) => v + Math.sin(i * 1.7) * 0.35 + Math.cos(i * 0.9) * 0.2);
    const minW = 65.5, maxW = 69;
    const x = i => padL + (W - padL - padR) * i / (weeks * 7 - 1);
    const yW = v => padT + (H - padT - padB) * (maxW - v) / (maxW - minW);
    const dots = raw.map((v, i) => `<circle cx="${x(i).toFixed(1)}" cy="${yW(v).toFixed(1)}" r="2" fill="var(--tertiary)"/>`).join('');
    const line = trend.map((v, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${yW(v).toFixed(1)}`).join('');
    const ticksW = [66, 67, 68].map(v => `<line x1="${padL}" x2="${W - padR}" y1="${yW(v)}" y2="${yW(v)}" stroke="var(--separator)" stroke-width="0.5"/><text x="${padL - 6}" y="${yW(v) + 4}" font-size="11" text-anchor="end" fill="var(--secondary)">${v}</text>`).join('');
    const targets = [1800, 1800, 1750, 1720, 1760, 1740, 1780, 1770];
    const minK = 1600, maxK = 1900;
    const yK = v => padT + (H - padT - padB) * (maxK - v) / (maxK - minK);
    const xs = i => padL + (W - padL - padR) * i / weeks;
    let step = '';
    targets.forEach((v, i) => { step += `${i ? 'L' : 'M'}${xs(i).toFixed(1)},${yK(v).toFixed(1)} L${xs(i + 1).toFixed(1)},${yK(v).toFixed(1)} `; });
    const ticksK = [1700, 1800].map(v => `<line x1="${padL}" x2="${W - padR}" y1="${yK(v)}" y2="${yK(v)}" stroke="var(--separator)" stroke-width="0.5"/><text x="${padL - 6}" y="${yK(v) + 4}" font-size="11" text-anchor="end" fill="var(--secondary)">${v}</text>`).join('');
    const weekLabels = Array.from({ length: weeks }, (_, i) => `<text x="${(xs(i) + xs(i + 1)) / 2}" y="${H - 6}" font-size="11" text-anchor="middle" fill="var(--secondary)">${i + 1}週</text>`).join('');
    return `
      <div class="charts" aria-label="体重の傾向と1日の目安の見本">
        <div class="label"><span>体重の傾向（kg）</span><span class="sample-tag">見本</span></div>
        <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="体重の見本のグラフ">${ticksW}${dots}<path d="${line}" fill="none" stroke="var(--primary)" stroke-width="2.5"/></svg>
        <div class="label"><span>1日の目安（kcal）。毎週の見直しで変わる</span></div>
        <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="1日の目安の見本のグラフ">${ticksK}<path d="${step}" fill="none" stroke="var(--primary)" stroke-width="2.5"/>${weekLabels}</svg>
      </div>`;
  }

  function note(kind, html) {
    const tags = { fact: '調査', guess: '推測', decision: '決定', check: '要確認', rule: '決まり' };
    return `<div class="note"><span class="tag">${tags[kind]}</span>${html}</div>`;
  }
  const notes = (...n) => n.join('');

              note('decision', '2つの柱（撮るだけ／体重の動きで1日の目安が変わる）を先頭に置く（「一般公開の準備の範囲と方針を決める」の 16）。'),
              note('fact', `星5で褒められるのは、写真のアプリでは「撮るだけ」（カルシー 8 件中 7 件）、あすけんでは「痩せた」（29 件中 16 件）（${comp} 問い3）。`),
              note('fact', `見る時間の 57% がファーストビュー、74% が最初の2画面に入る（${doc} の N4）。携帯の幅でもバッジまでが最初の1画面に入るよう、柱の箱はバッジの下に置いた。`),
              note('guess', '見出しに2つを入れると長く、どちらも弱まるかもしれない。公開のあと、H2 か H3 の1つと 2版で比べる。')
            )}
            ${badgeRules}
          </div>
          <div>${screen()}</div>
        </div></section>`
    },
    h2: {
      name: '操作は2つだけ',
      html: () => `
        <section class="hero hero-h2"><div class="wrap">
          <h1>操作は、朝の体重と、<br>食べる前の1枚だけ。</h1>
          <p class="lead">撮れば、料理と量と栄養が並びます。1日の目安は、体重の動きを見て毎週変わります。</p>
          <div class="actions">${badge}${badgeNote}</div>
          <div class="steps">
            <div class="step"><span class="when">朝</span><b>体重を量る</b><span>ヘルスケアにつながる体重計なら、量るだけで入ります</span>
              <div class="mini"><span style="font-size:28px;font-weight:300;font-variant-numeric:tabular-nums">67.4 kg</span></div></div>
            <div class="step"><span class="when">食べる前</span><b>撮る</b><span>撮り忘れたら「昼にカレー」と書きます</span>
              <div class="mini"><span class="rec" style="width:85%;align-self:center"><span class="photo" style="${photo('#d9a066', '#8a5a2b')}"></span><span><b>鮭の塩焼き定食</b><span class="muted">612 kcal</span></span></span></div></div>
            <div class="step result"><span class="when">毎週、自動で</span><b>目安が変わる</b><span>体重の傾向から、1日の目安を直します</span>
              <div class="mini"><span style="font-size:15px;color:var(--secondary)">1,800 → <b style="color:var(--on-surface);font-size:24px">1,750</b> kcal</span></div></div>
          </div>
          ${notes(
            note('fact', `前の版の「食事の記録を、入力しない」は、写真のアプリ（カルシー・カロミー・カロサポ）が説明文の最初に同じことを書いている（${comp} 問い2）。copywriting のスキルの「競合も同じ文を書けるなら落とす」（${doc} の K3）に当たるので、数えられる言い方（操作は2つ）に替えた。`),
            note('fact', `星1〜3の不満で一番多いのは「入力・操作が面倒」（5本で計 65 件）（${comp} 問い3）。`),
            note('guess', '「2つだけ」は、確定の操作がある競合と比べたときに初めて効くかもしれない。外部テスターに見せて、何のアプリか伝わるかを確かめる。')
          )}
          ${badgeRules}
        </div></section>`
    },
    h3: {
      name: '体重が目安を決める',
      html: () => `
        <section class="hero hero-h3"><div class="wrap grid">
          <div>
            <h1>あなたの体重が、<br>食べる量を決める。</h1>
            <p class="lead">体重の傾向と食べた量から、あなたの消費カロリーを推し量り、1日の目安を毎週直します。記録は撮るだけ。</p>
            <div class="actions">${badge}${badgeNote}</div>
            ${notes(
              note('fact', `体重の傾向から目安を見直すことを説明文に書くのは、調べた 11 本で MacroFactor だけ（${comp} 問い2）。`),
              note('fact', `「ダイエット 記録」「体重管理」の検索の上位は体重だけを付けるアプリが占める（${comp} 問い1）。体重だけを前に出すと、それらと並ぶ恐れ（読み取り）。`),
              note('guess', '見出しが比喩に寄るので、すぐ下の一文で何のアプリかを言う（taste-skill の「見出しが比喩ならすぐ下の一文が何かを言う」、K13）。伝わるかは外部テスターで確かめる。')
            )}
            ${badgeRules}
          </div>
          <div>${charts()}</div>
        </div></section>`
    }
  };

  // ---- 工夫。見出しは「思い浮かべられるか・確かめられるか・競合も書けるか」の3つを通した1案 ----
  const features = {
    ad: {
      title: '広告は出ません。体験のあいだも、続けてからも',
      body: `<p>無料版も広告も作っていません。記録の途中に広告や物の宣伝がはさまることはありません。</p>`,
      visual: null,
      note: notes(
        note('fact', `「広告・宣伝・勧誘」の不満は、あすけん 7・カロミル 13・カルシー 1。日本の大手は広告を消すことを有料の特典にしている（${comp}）。`),
        note('fact', `copywriting のスキルは「無いことの列挙」を避け、本当に無いことは一度だけ言え、とする（${doc} の K3）。広告の無さはこの節で一度だけ言う。`),
        note('decision', 'ADR-0024（無料版と広告を作らない）。')
      )
    },
    snap: {
      title: '撮るだけ。撮り忘れたら「昼にカレー」と書くだけ',
      body: `<p>写真から料理と材料と量を推し量り、栄養を出します。撮り忘れた食事は、書けば入ります。</p>
             <p>量が少しずれていても、直さなくてかまいません。1日の目安は体重の動きを見て合わせ直すので、ずれはそこでならされます。気になるときだけ、あとで直せます。</p>`,
      visual: `<div class="visual"><div class="kv"><span>ごはん</span><span>180 g</span></div><div class="kv"><span>鮭（塩ざけ・焼き）</span><span>80 g</span></div><div class="kv"><span>味噌汁</span><span>1 杯</span></div><div class="kv"><span>ほうれん草のおひたし</span><span>60 g</span></div><div class="kv" style="border-top:1px solid var(--separator);padding-top:8px"><span>合計</span><span><b>612 kcal</b></span></div><span class="sample-tag" style="justify-self:start">見本</span></div>`,
      note: notes(
        note('fact', `「入力・操作が面倒」計 65 件、「写真の推定がずれて手で直す」計 27 件（${comp}）。`),
        note('check', '「ずれは体重の動きでならされる」は ADR-0007 からの言い方。いつも同じ向きにずれるなら目安に吸収されるが、写真ごとにばらつくずれまで言い切れるか、開発者に確かめる。')
      )
    },
    table: {
      title: '栄養は、日本食品標準成分表の値で数えます',
      body: `<p>料理を材料に分け、材料ごとに文部科学省の日本食品標準成分表の値を引いて数えます。どの食品の値を使ったかは、食事を開けば見られます。</p>
             <p class="fine">写真に栄養成分表示が写っていれば、その表示を使います。</p>`,
      visual: `<div class="visual"><div class="kv"><span>しろさけ 塩ざけ 焼き</span><span>80 g</span></div><div class="kv"><span>栄養の出どころ</span><span>成分表</span></div><div class="kv"><span>こめ 精白米 めし</span><span>180 g</span></div><div class="kv"><span>栄養の出どころ</span><span>成分表</span></div><span class="sample-tag" style="justify-self:start">見本</span></div>`,
      note: notes(
        note('fact', `日本食品標準成分表を説明文に書いているアプリは、調べた 11 本の中に無い（${comp} 問い2）。「食品が無い」の不満は、あすけん 7・MacroFactor 6・WiseMeal 12。`),
        note('decision', 'ADR-0015（栄養は成分表から引く。出どころは表示 → 成分表 → 推定の順）。')
      )
    },
    weekly: {
      title: '1日の目安は、毎週の体重の動きで直ります',
      body: `<p>毎週、その週の体重の傾向と食べた量から推定消費カロリーを出し直し、1日の目安を直します。</p>
             <p><b>最初の目安の出し方</b>：ヘルスケアに直前 28 日の食べた量と体重があれば、そこから逆算します。無ければ、身長・生まれた年・性別・活動量から式で出し、使うほど記録に合わせて直ります。</p>`,
      visual: `<div class="visual"><div class="kv"><span>1週目</span><span>1,800 kcal</span></div><div class="kv"><span>2週目</span><span>1,800 kcal</span></div><div class="kv"><span>3週目</span><span>1,750 kcal</span></div><div class="kv"><span>4週目</span><span>1,720 kcal</span></div><span class="sample-tag" style="justify-self:start">見本</span></div>`,
      note: notes(
        note('fact', `「目標・計算が合わない」はあすけん 8・カロミル 6・MacroFactor 4。MacroFactor の 4 件はどれも「目安が低すぎる」（${comp}）。毎週直す形でも消えないので、最初の目安の出し方を見せる。`),
        note('check', '最初の目安をアプリでどう見せるかは仕様7「週の見直しと目標の経過」で決める。ここの文はそれに合わせて直す。')
      )
    },
    price: {
      title: '30日間、支払いの登録なしで、すべての機能を使えます',
      body: `<p>体験が終わる日は、アプリの中でいつでも見られます。終わっても自動で課金されることはありません。続けたいときにだけ、月額か年額を選びます。</p>
             <p class="fine">体験が終わったあとも、体重の記録と、これまでの記録の見返しはそのまま使えます。</p>`,
      visual: `<div class="visual"><div class="price-row"><div class="price-box"><b>— 円</b><span>月額</span></div><div class="price-box"><b>— 円</b><span>年額</span></div></div><span class="fine">料金は未定（試作）</span></div>`,
      note: notes(
        note('fact', `「思わぬ請求・試用の分かりにくさ」はあすけん 1・カルシー 3・WiseMeal 5（${comp}）。`),
        note('decision', 'ADR-0024（支払いの登録なしの 30 日の体験）。体験はサーバーが数え、自動で有料に移らない（「一般公開に要る法と App Store の要件を確かめる」）。'),
        note('check', `料金は「課金の形を決める」で決まるまで未定。公開の LP では、決まるまでこの節を出さない（${doc} の当てはめ 8）。`)
      )
    }
  };

  const orders = {
    o1: { name: '方針どおり', keys: ['ad', 'snap', 'table', 'weekly', 'price'],
      why: '「一般公開の準備の範囲と方針を決める」の 16 の並び。広告から入り、操作、栄養、目安、料金。' },
    o2: { name: '不満の多い順', keys: ['snap', 'table', 'ad', 'weekly', 'price'],
      why: '星1〜3の不満の件数の順（入力・操作 65 → 食品が無い 25 → 広告 21 → 目標が合わない 18）。料金はいつも最後。' },
    o3: { name: '競合が書いていない順', keys: ['table', 'weekly', 'ad', 'snap', 'price'],
      why: '説明文に書いている競合の少ない順（成分表 0 本 → 目安の見直し 1 本 → 広告なし 2 本 → 撮るだけ ほぼ全部）。料金はいつも最後。' }
  };

  function renderFeatures(order) {
    const o = orders[order];
    const items = o.keys.map(k => {
      const f = features[k];
      return `
        <article class="feature${f.visual ? '' : ' no-visual'}">
          <div>
            <h3>${f.title}</h3>
            <div class="body">${f.body}</div>
            ${f.note}
          </div>
          ${f.visual || ''}
        </article>`;
    }).join('');
    return `
      <section class="features"><div class="wrap">
        <h2 class="section-title">食事の記録が続かなかった理由を、ひとつずつ減らしました</h2>
        ${note('decision', `並び「${o.name}」：${o.why}`)}
        ${note('fact', `並びは A/B で比べない。予約注文の期間はキャンペーンのリンクが作れず、クリック率 10% で 20% の差を見るには 1版に約 3,800 の訪問が要る（${doc} の AP5・C1）。試作と外部テスターへの聞き取りで決める。`)}
        <div class="feature-list">${items}</div>
      </div></section>`;
  }

  function renderSwitchers() {
    return `
      <section class="switchers"><div class="wrap"><div class="box">
        <div>
          <span class="eyebrow">他のアプリを使ったことがある方へ</span>
          <h2 class="section-title" style="margin-top:4px">撮ったら、確定を押さずに食べはじめられます</h2>
          <p class="section-sub">写真を読むのは裏で進みます。候補を選んで確定する操作はありません。違っていたら、あとで食事を開いて直せます。</p>
          ${notes(
            note('fact', '調べた 5 本とも、結果を見て選ぶ・直す・確定する操作がある。差になりうるのは「待たなくてよい」より「確定の操作が要らない」のほう（「競合の撮ってから記録になるまでの流れを確かめる」）。'),
            note('guess', '開発者の実感（n=1）からの仮説。ファーストビューに上げず、ここと、公開のあとの App Store のカスタムプロダクトページで試す（方針の 17。予約注文の期間に使えるかは Apple の文書で読み方が分かれる、AP4・AP7）。')
          )}
        </div>
        <div class="compare">
          <div class="row"><span>よくある流れ</span><div class="flow"><em>撮る</em><span class="arrow">→</span><em>待つ</em><span class="arrow">→</span><em>候補を選ぶ</em><span class="arrow">→</span><em>確定</em><span class="arrow">→</span><em>食べる</em></div></div>
          <div class="row"><span>nu-tori</span><div class="flow"><em>撮る</em><span class="arrow">→</span><em>食べる</em><span class="arrow">→</span><em>あとで見る</em></div></div>
        </div>
      </div></div></section>`;
  }

  function renderFaq() {
    return `
      <section class="faq"><div class="wrap">
        <h2 class="section-title">よくある質問</h2>
        <dl>
          <div class="qa"><dt>推定が違っていたら？</dt><dd>食事を開いて、料理や量を直せます。毎回直さなくても、1日の目安は体重の動きで合わせ直されます。</dd></div>
          <div class="qa"><dt>体重計がヘルスケアにつながっていなくても使えますか？</dt><dd>使えます。量った体重をアプリで入れられます。</dd></div>
          <div class="qa"><dt>Android や iPad で使えますか？</dt><dd>iPhone だけです。</dd></div>
        </dl>
        ${notes(
          note('fact', `スキルはどれも、異論に答える節を置け、とする（${doc} の K2・K3・K8）。効果を確かめた一次の調査は見つからなかった。何に答えるかは、競合のレビューの不満から選んだ（推定のずれ 27 件、体重の連携 2 件）。`),
          note('decision', 'iPhone だけは ADR-0004。体重を手で入れられるのは今のアプリの入力欄の「体重」。'),
          note('check', '1つめの答えの後半は、工夫の「撮るだけ」の節と同じ要確認の言い方。')
        )}
      </div></section>`;
  }

  // 最後はバッジでなく文のリンクにする（バッジは1ページに1つ）
  function renderClosing() {
    return `
      <section class="closing"><div class="wrap">
        <h2>まずは 30 日、撮って量るだけ</h2>
        <p><a href="#" onclick="return false">App Store で nu-tori を見る</a></p>
        ${note('check', `Apple の「1つのレイアウトにバッジは1つ」の「レイアウト」が、ページ全体か見えている範囲かは書かれていない（${doc} の AP1・AP2）。ここでは安全な側を取り、最後は文のリンクにした。開発者の判断が要る。`)}
      </div></section>`;
  }

  // ---- 状態と切り替え ----
  const axes = {
    h: { el: 'seg-h', opts: [['h1', 'H1'], ['h2', 'H2'], ['h3', 'H3']] },
    o: { el: 'seg-o', opts: [['o1', 'O1'], ['o2', 'O2'], ['o3', 'O3']] },
    n: { el: 'seg-n', opts: [['x', 'なし'], ['n', 'あり']] }
  };
  const state = { h: 'h1', o: 'o1', n: 'x' };

  function readHash() {
    for (const p of location.hash.replace(/^#/, '').split('-')) {
      for (const [k, ax] of Object.entries(axes)) {
        if (ax.opts.some(([v]) => v === p)) state[k] = p;
      }
    }
  }
  function writeHash() {
    const h = `#${state.h}-${state.o}-${state.n}`;
    if (location.hash !== h) history.replaceState(null, '', h);
  }

  function render() {
    document.getElementById('lp').innerHTML =
      heroes[state.h].html() + renderFeatures(state.o) + renderSwitchers() + renderFaq() + renderClosing();
    document.body.classList.toggle('show-notes', state.n === 'n');
    for (const [k, ax] of Object.entries(axes)) {
      document.querySelectorAll(`#${ax.el} button`).forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === state[k])));
    }
    document.getElementById('current').textContent =
      `${state.h.toUpperCase()} ${heroes[state.h].name} ／ ${state.o.toUpperCase()} ${orders[state.o].name}`;
    writeHash();
  }

  for (const [k, ax] of Object.entries(axes)) {
    const seg = document.getElementById(ax.el);
    seg.innerHTML = ax.opts.map(([v, label]) => `<button type="button" data-v="${v}">${label}</button>`).join('');
    seg.addEventListener('click', e => {
      const b = e.target.closest('button');
      if (!b) return;
      state[k] = b.dataset.v;
      render();
    });
  }

  document.addEventListener('keydown', e => {
    if (e.target.closest('input, textarea, [contenteditable]')) return;
    if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
    const keys = axes.h.opts.map(([v]) => v);
    const i = keys.indexOf(state.h);
    state.h = keys[(i + (e.key === 'ArrowRight' ? 1 : keys.length - 1)) % keys.length];
    render();
  });

  try { readHash(); } catch (_) {}
  render();
})();
</script>
