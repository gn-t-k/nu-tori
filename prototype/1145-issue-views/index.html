.note { font-size: 12px; color: var(--sub); }
.done-t { color: var(--sub); text-decoration: line-through; }
.bar { height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; display: flex; margin: 6px 0; }
.bar i { display: block; height: 100%; }
.sq { display: inline-flex; gap: 2px; flex-wrap: wrap; vertical-align: middle; }
.sq i { width: 9px; height: 9px; border-radius: 2px; display: block; }
.sample { border-style: dashed; }
.live { font-size: 11px; padding: 0 6px; border-radius: 999px; background: var(--agent); color: #fff; white-space: nowrap; }
.b-ver { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-bottom: 12px; }
.b-ver .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.sample-mark { font-size: 11px; color: var(--triage); border: 1px dashed var(--triage); border-radius: 4px; padding: 0 4px; }
.ord { width: 20px; color: var(--sub); font-variant-numeric: tabular-nums; text-align: right; flex: none; }

/* A: 版で見る */
.a-track { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.a-head { font-weight: 700; font-size: 15px; }
.a-arrow { display: flex; align-items: center; gap: 8px; margin: 0 0 10px; font-size: 12px; color: var(--sub); }
.a-arrow span { background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; }
.a-free { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-top: 12px; }

/* B: 種類で見る */
.b-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; align-items: start; }
.b-card { border-left: 4px solid var(--line); padding: 6px 8px; margin: 6px 0; background: var(--bg); border-radius: 6px; }
.b-card .t { display: block; }

/* C: 番で見る */
.c-wrap { max-width: 720px; margin: 0 auto; display: grid; gap: 12px; }
.c-sum { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.c-sum .box { text-align: center; padding: 8px 4px; }
.c-sum b { display: block; font-size: 22px; line-height: 1.2; }
.c-sec { border-left: 4px solid var(--line); }
details summary { cursor: pointer; color: var(--sub); font-size: 12px; margin-top: 6px; }

@media (max-width: 860px) {
  .a-track, .a-free, .b-grid, .b-ver { grid-template-columns: 1fr; }
}

.switch span { padding: 0 12px; white-space: nowrap; }
</style>

<script>
const all = DATA.issues, by = new Map(all.map(i => [i.n, i]));
const has = (i, l) => i.labels.includes(l);
const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

const KINDS = [['enhancement', '機能'], ['growth', '集客'], ['bug', '不具合'], ['harness', '仕組み'], ['dependencies', '依存']];
const kind = i => { for (let x = i; x; x = by.get(x.parent)) for (const [l, name] of KINDS) if (has(x, l)) return name; return '種類なし'; };
const version = i => { for (let x = i; x; x = by.get(x.parent)) if (x.milestone) return x.milestone; return null; };
const STATES = { human: 'あなたの番', triage: '振り分け待ち', agent: 'エージェントが進められる', wait: '日付や外の出来事を待つ', blocked: '前の Issue が終わるのを待つ', done: '済み' };
const ORDER = Object.keys(STATES);
const state = i => i.state === 'closed' ? 'done'
  : has(i, 'waiting') ? 'wait'
  : (i.blocked_by || []).length ? 'blocked'
  : ['ready-for-human', 'wayfinder:grilling', 'wayfinder:prototype'].some(l => has(i, l)) ? 'human'
  : has(i, 'ready-for-agent') ? 'agent' : 'triage';
const humanVerb = i => has(i, 'wayfinder:grilling') ? '決める' : has(i, 'wayfinder:prototype') ? '見比べる' : null;

const issues = all.filter(i => !i.pr);
const open = issues.filter(i => i.state === 'open');
const tops = open.filter(i => !i.parent).sort((a, b) => ORDER.indexOf(state(a)) - ORDER.indexOf(state(b)) || a.n - b.n);
const kids = p => issues.filter(i => i.parent === p.n);
const recent = issues.filter(i => i.state === 'closed' && !i.parent && !i.milestone).sort((a, b) => b.closed.localeCompare(a.closed));

const link = i => `<a href="https://github.com/gn-t-k/nu-tori/${i.pr ? 'pull' : 'issues'}/${i.n}" target="_blank" rel="noopener"><span class="num">#${i.n}</span> <span class="${i.state === 'closed' ? 'done-t' : ''}">${esc(i.title)}</span></a>`;
const dot = s => `<span class="dot s-${s}" title="${STATES[s]}"></span>`;
const row = (i, extra = '', under = '') => `<div class="row">${dot(state(i))}<span class="t">${link(i)}${under ? '<br>' + under : ''}</span>${extra}</div>`;
const blockedNote = i => (i.blocked_by || []).length ? `<span class="note">← ${i.blocked_by.map(n => '#' + n).join(' ')}</span>` : '';
const squares = p => `<span class="sq">${kids(p).sort((a, b) => ORDER.indexOf(state(b)) - ORDER.indexOf(state(a))).map(k => `<i class="s-${state(k)}" title="#${k.n} ${esc(k.title)}"></i>`).join('')}</span>`;
const progress = p => { const ks = kids(p); return `<div class="bar">${['done', 'agent', 'human', 'blocked', 'wait', 'triage'].map(s => `<i class="s-${s}" style="width:${100 * ks.filter(k => state(k) === s).length / ks.length}%"></i>`).join('')}</div>`; };
const openPrs = i => DATA.prs.filter(p => p.closes.includes(i.n));
const live = i => DATA.active.includes(i.n) ? '<span class="live">着手中（セッション）</span>' : openPrs(i).length ? `<span class="live">着手中（PR ${openPrs(i).map(p => '#' + p.n).join(' ')}）</span>` : '';
const legend = () => `<div class="legend">${ORDER.map(s => `<span>${dot(s)}${STATES[s]}</span>`).join('')}</div>`;

/* ---------- A: 版で見る ---------- */
function VariantA() {
  const inVer = v => all.filter(i => i.milestone === v);
  const v121 = inVer('iOS 1.2.1');
  const spec = by.get(1110), ks = kids(spec);
  const group = (title, list) => list.length ? `<h3>${title}（${list.length}）</h3>${list.map(k => row(k, '', blockedNote(k))).join('')}` : '';
  const free = tops.filter(i => !version(i));
  const later = free.filter(i => kind(i) === '機能').sort((a, b) => a.n - b.n);
  const bugs = free.filter(i => kind(i) === '不具合');
  const rest = k => free.filter(i => kind(i) === k);
  return `
  <h1>A　版で見る</h1>
  <p class="lead">左から右へ、出る順。「どの変更がどの版に入るか」と「今の版がどこまで進んだか」が主役。</p>
  ${legend()}
  <div class="a-arrow"><span>1.2.0 審査に出した（11/24）</span>→<span>1.2.1 小さく刻む</span>→<span>1.3.0 考え方のページ</span>→<span>その先</span></div>
  <div class="a-track">
    <div class="box"><div class="a-head">iOS 1.2.1</div><p class="note">main に入った変更。審査にはまだ出していない。</p>
      ${v121.map(i => `<div class="row">${dot('done')}<span class="t">${link(i)}</span><span class="tag">${i.pr ? 'PR' : 'Issue'}</span></div>`).join('')}
      <h3>これから入れたい小さな変更</h3><p class="note">まだ1件も版に付いていない。</p></div>
    <div class="box"><div class="a-head">iOS 1.3.0</div>${row(spec)}
      ${progress(spec)}<p class="note">${ks.filter(k => state(k) === 'done').length} / ${ks.length} 済み</p>
      ${group('今すぐ進められる', ks.filter(k => state(k) === 'agent'))}
      ${group('前が終わるのを待つ', ks.filter(k => state(k) === 'blocked' && !has(k, 'ready-for-human')))}
      ${group('最後にあなたがやる', ks.filter(k => has(k, 'ready-for-human') && k.state === 'open'))}
      <details><summary>済み（${ks.filter(k => state(k) === 'done').length}）</summary>${ks.filter(k => state(k) === 'done').map(k => row(k)).join('')}</details></div>
    <div class="box"><div class="a-head">その先（版は未定）</div>
      <h3>機能の候補（${later.length}）　<span class="sample-mark">順は仮。今は Issue のどこにも無い</span></h3>
      ${later.map((i, n) => `<div class="row"><span class="ord">${n + 1}</span>${dot(state(i))}<span class="t">${link(i)}</span>${blockedNote(i)}</div>`).join('')}
      <h3>不具合（${bugs.length}）　版が付いていない</h3>${bugs.map(i => row(i)).join('')}</div>
  </div>
  <h2 style="margin-top:18px">版を待たずに出るもの（サーバー・ページ・仕組み）</h2>
  <div class="a-free">${['集客', '仕組み', '依存'].map(k => `<div class="box"><h2>${k}（${rest(k).length}）</h2>${rest(k).map(i => row(i, i.subs_total ? `<span class="note">${i.subs_done}/${i.subs_total}</span>` : blockedNote(i))).join('')}</div>`).join('')}</div>`;
}

/* ---------- B: 種類で見る ---------- */
function VariantB() {
  const cols = [['機能'], ['集客'], ['不具合'], ['仕組み', '依存']];
  const card = i => `<div class="b-card" style="border-left-color:var(--${state(i)})"><span class="t">${link(i)}</span>
    ${live(i)} <span class="note">${STATES[state(i)]}${humanVerb(i) ? '（' + humanVerb(i) + '）' : ''} ${blockedNote(i)}</span>
    ${version(i) ? `<span class="tag ver">${version(i)}</span>` : ''}
    ${i.subs_total ? `<div>${squares(i)} <span class="note">${i.subs_done}/${i.subs_total}</span></div>` : ''}</div>`;
  const count = s => open.filter(i => state(i) === s).length;
  const verBox = (v, note) => { const inn = all.filter(i => version(i) === v && i.state === 'closed'), plan = all.filter(i => i.milestone === v && i.state === 'open');
    return `<div class="box"><div class="a-head">${v}</div><p class="note">${note}</p><div class="cols">
      <div><h3>入る予定（${plan.length}）</h3>${plan.map(i => row(i) + (i.subs_total ? progress(i) + `<p class="note">子 ${i.subs_done}/${i.subs_total} 済み。今進められる ${kids(i).filter(k => state(k) === 'agent').length}、待ち ${kids(i).filter(k => ['blocked', 'wait'].includes(state(k))).length}</p>` : '')).join('') || '<p class="note">まだ無い</p>'}</div>
      <div><h3>main に入った（${inn.length}）</h3>${inn.map(i => `<div class="row">${dot('done')}<span class="t">${link(i)}</span></div>`).join('') || '<p class="note">まだ無い</p>'}</div></div></div>`; };
  const loosePrs = DATA.prs.filter(p => !p.closes.length);
  return `
  <h1>B　種類で見る（全体の地図）</h1>
  <p class="lead">開いている親の Issue を全部、種類ごとに1画面に並べる。色が状態、四角が子の Issue。「全体がどうなっているか」が主役。</p>
  <div class="legend">${ORDER.filter(s => s !== 'done').map(s => `<span>${dot(s)}${STATES[s]} ${count(s)}</span>`).join('')}<span class="note">（子も数える）</span></div>
  <h2>いま向かっている版</h2>
  <div class="b-ver">${verBox('iOS 1.2.1', '小さく刻む版。審査にはまだ出していない。')}${verBox('iOS 1.3.0', '考え方のページと、アプリからの入口。')}</div>
  <h2>種類ごとの全体</h2>
  <div class="b-grid">${cols.map(ks => { const list = tops.filter(i => ks.includes(kind(i))); return `<div class="box"><h2>${ks.join('・')}（${list.length}）</h2>
    ${ks[0] === '集客' ? `<div class="box sample" style="padding:8px;margin-bottom:8px"><span class="sample-mark">見本。中身は架空</span>
      <h3>いま測っている</h3><div class="row">${dot('wait')}<span class="t">掲載情報の1行目を変えた</span><span class="note">読む日 12/12</span></div>
      <h3>答えが出た</h3><div class="row">${dot('done')}<span class="t">LP の見出しを変えた</span><span class="note">効かなかった</span></div>
      <p class="note">本物の判断と数字は公開の側に書けないので、ここに出すなら置き場を分ける。</p></div>` : ''}
    ${list.map(card).join('')}</div>`; }).join('')}</div>
  <details class="box" style="margin-top:12px"><summary>Issue に結びついていない開いている PR（${loosePrs.length}）</summary>${loosePrs.map(p => `<div class="row"><span class="t"><a href="https://github.com/gn-t-k/nu-tori/pull/${p.n}" target="_blank" rel="noopener"><span class="num">#${p.n}</span> ${esc(p.title)}</a></span>${p.draft ? '<span class="tag">下書き</span>' : ''}</div>`).join('')}</details>
  <details class="box" style="margin-top:12px"><summary>この2週間に閉じた親の Issue（${recent.length}）</summary>${recent.map(i => row(i, `<span class="tag">${kind(i)}</span><span class="note">${i.closed.slice(5)}</span>`)).join('')}</details>`;
}

/* ---------- C: 番で見る ---------- */
function VariantC() {
  const tags = i => `<span class="tag">${kind(i)}</span>${version(i) ? `<span class="tag ver">${version(i)}</span>` : ''}`;
  const of = s => open.filter(i => state(i) === s && !(s === 'agent' && kids(i).some(k => k.state === 'open')));
  const human = of('human'), promised = human.filter(version), verbs = human.filter(i => !version(i) && humanVerb(i)), backlog = human.filter(i => !version(i) && !humanVerb(i));
  const agent = of('agent'), wait = of('wait'), blocked = of('blocked'), triage = of('triage');
  const sec = (s, title, note, body) => `<div class="box c-sec" style="border-left-color:var(--${s})"><h2>${title}</h2>${note ? `<p class="note">${note}</p>` : ''}${body}</div>`;
  const list = (l, extra = () => '') => l.length ? l.map(i => row(i, tags(i) + extra(i))).join('') : '<p class="note">なし</p>';
  const byParent = l => { const g = new Map(); l.forEach(i => { const k = i.parent || 0; g.set(k, [...(g.get(k) || []), i]); });
    return [...g].map(([p, ks]) => p ? `<h3>${link(by.get(p))} の子（${ks.length}）</h3>${ks.map(i => row(i)).join('')}` : `<h3>単独（${ks.length}）</h3>${list(ks)}`).join(''); };
  return `<div class="c-wrap">
  <div><h1>C　番で見る（今日の1枚）</h1>
  <p class="lead">上から順に、誰の番か。「今日なにをするか・何が止まっているか」が主役。スマホの幅で読める。</p></div>
  <div class="c-sum">
    <div class="box"><b style="color:var(--human)">${promised.length + verbs.length}</b>あなたの番</div>
    <div class="box"><b style="color:var(--triage)">${triage.length}</b>振り分け待ち</div>
    <div class="box"><b style="color:var(--agent)">${agent.length}</b>進められる</div>
    <div class="box"><b style="color:var(--wait)">${wait.length + blocked.length}</b>待ち</div></div>
  ${sec('human', 'あなたの番', '', `<h3>決める・見比べる</h3>${list(verbs, i => `<span class="note">${humanVerb(i)}</span>`)}<h3>版に入っているもの</h3>${list(promised)}
    <details><summary>まだ始めていない候補（${backlog.length}）。あなたが仕様を決めるところから</summary>${list(backlog)}</details>`)}
  ${sec('triage', '振り分け待ち', '種類と、誰が拾うかを決める。', list(triage))}
  ${sec('agent', 'エージェントが今すぐ進められる', '', byParent(agent))}
  ${sec('wait', '待っている', '', `<h3>日付や外の出来事</h3>${list(wait)}<h3>前の Issue が終わるのを待つ（${blocked.length}）</h3>${blocked.map(i => row(i, blockedNote(i))).join('')}`)}
  <details class="box"><summary>この2週間に閉じた親の Issue（${recent.length}）</summary>${recent.map(i => row(i, `<span class="tag">${kind(i)}</span><span class="note">${i.closed.slice(5)}</span>`)).join('')}</details>
  </div>`;
}

/* ---------- 切り替え ---------- */
const VARIANTS = { A: ['版で見る', VariantA], B: ['種類で見る', VariantB], C: ['番で見る', VariantC] };
const keys = Object.keys(VARIANTS);
let current = new URLSearchParams(location.search).get('variant');
if (!VARIANTS[current]) current = 'B';
function show(k) {
  current = k;
  document.getElementById('app').innerHTML = VARIANTS[k][1]() + `<p class="note" style="margin-top:16px">試作（#1145）。${DATA.fetched} に GitHub の Issue から読んだ。</p>`;
  document.getElementById('label').textContent = `${k}（${VARIANTS[k][0]}）`;
  try { history.replaceState(null, '', '?variant=' + k); } catch { /* file:// や埋め込みでは URL を変えられないことがある */ }
  scrollTo(0, 0);
}
const step = d => show(keys[(keys.indexOf(current) + d + keys.length) % keys.length]);
document.getElementById('prev').onclick = () => step(-1);
document.getElementById('next').onclick = () => step(1);
addEventListener('keydown', e => { if (e.key === 'ArrowLeft') step(-1); if (e.key === 'ArrowRight') step(1); });
show(current);
</script>
</body>
</html>
