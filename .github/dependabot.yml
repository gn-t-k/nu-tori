version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /server
    schedule:
      interval: monthly
    groups:
      npm:
        patterns: ["*"]
    ignore:
      - dependency-name: vitest
        update-types: ["version-update:semver-major"]
