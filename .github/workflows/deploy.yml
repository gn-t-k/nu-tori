name: deploy

on:
  push:
    branches: [main]
    # 必須のチェックではないので、ワークフローの paths で飛ばしてよい
    paths:
      - "server/**"
      - "shared/**"
      - ".github/workflows/deploy.yml"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  development:
    uses: ./.github/workflows/deploy-worker.yml
    with:
      environment: development
      wrangler-env: ""
      url: https://api-dev.nu-tori.app
    secrets: inherit

  # 開発用に出した Worker が応答し、D1 を読めるかだけを確かめる（server/src/http/health-routes/）。
  # 依存の更新などで Worker が動かなくなったら、ここで落として本番に出さない。
  # 出した直後のつながりの揺れで落ちないよう、200 が返るまで間を空けて数回だけやり直す。main へのすべてのマージで動かす
  shallow-check:
    needs: development
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 浅い確認の経路を呼ぶ
        run: >-
          curl --fail --silent --show-error --max-time 10
          --retry 5 --retry-delay 10 --retry-all-errors
          https://api-dev.nu-tori.app/health

  # 開発用のデプロイと浅い確認の両方が通ったときだけ出す
  production:
    needs: [development, shallow-check]
    uses: ./.github/workflows/deploy-worker.yml
    with:
      environment: production
      wrangler-env: production
      url: https://api.nu-tori.app
    secrets: inherit

  # 開発用の環境へ出した Worker に、本物の API を通して主な流れ（サインイン、体重、写真の食事、推定、アカウントの削除）を確かめる。
  # 落ちたらこのジョブが赤くなるだけにする。必須のチェックにせず、本番のデプロイも待たせない（docs/agents/tooling.md の「CI」）
  verify-development:
    needs: development
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # E2E_SIGN_IN_SECRET を、開発用の Environment の秘密の値から読む。本番の Environment には置かない
    environment: development
    env:
      E2E_BASE_URL: https://api-dev.nu-tori.app
      E2E_SIGN_IN_SECRET: ${{ secrets.E2E_SIGN_IN_SECRET }}
    defaults:
      run:
        shell: bash
        working-directory: server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: server/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: server/.node-version
          cache: pnpm
          cache-dependency-path: server/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: 主な流れを確かめる
        run: pnpm exec tsx e2e/verify-development.ts
