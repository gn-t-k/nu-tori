name: deploy

on:
  push:
    branches: [main]
    # 必須のチェックではないので、ワークフローの paths で飛ばしてよい
    paths:
      - "server/**"
      - "shared/**"
      - ".github/workflows/deploy.yml"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  development:
    uses: ./.github/workflows/deploy-worker.yml
    with:
      environment: development
      wrangler-env: ""
      url: https://api-dev.nu-tori.app
    secrets: inherit

  production:
    needs: development
    uses: ./.github/workflows/deploy-worker.yml
    with:
      environment: production
      wrangler-env: production
      url: https://api.nu-tori.app
    secrets: inherit

  # 開発用の環境へ出した Worker に、本物の API を通して主な流れ（サインイン、体重、写真の食事、推定、アカウントの削除）を確かめる。
  # 落ちたらこのジョブが赤くなるだけにする。必須のチェックにせず、本番のデプロイも待たせない（docs/agents/tooling.md の「CI」）
  verify-development:
    needs: development
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # E2E_SIGN_IN_SECRET を、開発用の Environment の秘密の値から読む。本番の Environment には置かない
    environment: development
    env:
      E2E_BASE_URL: https://api-dev.nu-tori.app
      E2E_SIGN_IN_SECRET: ${{ secrets.E2E_SIGN_IN_SECRET }}
    defaults:
      run:
        shell: bash
        working-directory: server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: server/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: server/.node-version
          cache: pnpm
          cache-dependency-path: server/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: 主な流れを確かめる
        run: pnpm exec tsx e2e/verify-development.ts
