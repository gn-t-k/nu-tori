name: deploy

on:
  push:
    branches: [main]
    # 必須のチェックではないので、ワークフローの paths で飛ばしてよい
    paths:
      - "server/**"
      - "shared/**"
      - ".github/workflows/deploy.yml"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  development:
    uses: ./.github/workflows/deploy-worker.yml
    with:
      environment: development
      wrangler-env: ""
      url: https://api-dev.nu-tori.app
    secrets: inherit

  # 開発用に出した Worker が応答し、D1 を読めるかだけを確かめる（server/src/http/health-routes/）。
  # 依存の更新などで Worker が動かなくなったら、ここで落として本番に出さない。
  # 出した直後のつながりの揺れで落ちないよう、200 が返るまで間を空けて数回だけやり直す。main へのすべてのマージで動かす
  shallow-check:
    needs: development
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 浅い確認の経路を呼ぶ
        run: >-
          curl --fail --silent --show-error --max-time 10
          --retry 5 --retry-delay 10 --retry-all-errors
          https://api-dev.nu-tori.app/health

  # 開発用のデプロイと浅い確認の両方が通ったときだけ出す
  production:
    needs: [development, shallow-check]
    uses: ./.github/workflows/deploy-worker.yml
    with:
      environment: production
      wrangler-env: production
      url: https://api.nu-tori.app
    secrets: inherit

  # 開発用の環境へ出した Worker に、本物の API を通して主な流れ（サインイン、体重、写真の食事、推定、アカウントの削除、無料体験の終わったアカウントの推定の保留）を確かめる。
  # 必須のチェックにせず、本番のデプロイも待たせない。main で落ちたら track-main-failure が Issue を立てる（docs/agents/tooling.md の「CI」）
  verify-development:
    needs: development
    runs-on: ubuntu-latest
    # 流れが待つ上限の合計（11 分。e2e/verify-development.ts）と準備より長くし、時間切れで止まる前に流れが止まった段を書き、作ったアカウントを消せるようにする
    timeout-minutes: 15
    # E2E_SIGN_IN_SECRET を、開発用の Environment の秘密の値から読む。本番の Environment には置かない
    environment: development
    env:
      E2E_BASE_URL: https://api-dev.nu-tori.app
      E2E_SIGN_IN_SECRET: ${{ secrets.E2E_SIGN_IN_SECRET }}
    defaults:
      run:
        shell: bash
        working-directory: server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: server/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: server/.node-version
          cache: pnpm
          cache-dependency-path: server/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: 主な流れを確かめる
        run: pnpm exec tsx e2e/verify-development.ts

  # main で落ちたら needs-triage の Issue を立て、開いた Issue があればまた落ちたことを書き足し、緑に戻ったら閉じる（ios-ui-test.yml の track-main-failure と同じ形）。
  # 赤くなるだけでは気づかず、9回続けて落ちていた（#793）。開発用のデプロイが落ちて確かめが飛んだ回は、何もしない
  track-main-failure:
    needs: verify-development
    if: >-
      always() && github.ref == 'refs/heads/main' &&
      (needs.verify-development.result == 'success' || needs.verify-development.result == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      TITLE: main の verify-development が落ちている
    steps:
      # 題で探す。concurrency の deploy で回は1本ずつなので、2つの回が同時に立てることは無い
      - id: open-issue
        name: 開いている Issue を探す
        run: |
          number="$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues?state=open&per_page=100" \
            --jq '.[] | select(.pull_request == null and .title == env.TITLE) | .number' | head -n 1)"
          echo "number=$number" >> "$GITHUB_OUTPUT"
      - name: 緑に戻ったので Issue を閉じる
        if: needs.verify-development.result == 'success' && steps.open-issue.outputs.number != ''
        env:
          NUMBER: ${{ steps.open-issue.outputs.number }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/issues/$NUMBER/comments" -f body="main の verify-development が緑に戻った: $RUN_URL" > /dev/null
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/$NUMBER" -f state=closed -f state_reason=completed > /dev/null
      - name: Issue を立てるか、また落ちたことを書き足す
        if: needs.verify-development.result == 'failure'
        env:
          NUMBER: ${{ steps.open-issue.outputs.number }}
        run: |
          if [ -n "$NUMBER" ]; then
            gh api "repos/$GITHUB_REPOSITORY/issues/$NUMBER/comments" -f body="また落ちた: $RUN_URL" > /dev/null
            exit 0
          fi
          body="$(printf '%s\n\n- 落ちた回: %s\n\n%s' \
            'main の verify-development（開発用の環境で、本物の API を通して主な流れを確かめるジョブ）が落ちた。落ちた段は回のログに出る。' \
            "$RUN_URL" \
            'main で verify-development が緑に戻ると、ワークフローがこの Issue を閉じる。')"
          number="$(gh api "repos/$GITHUB_REPOSITORY/issues" -f title="$TITLE" -f body="$body" -f "labels[]=needs-triage" --jq .number)"
          # GITHUB_TOKEN で立てた Issue は lock-conversations.yml を起こさないので、ここでロックする
          gh api --method PUT "repos/$GITHUB_REPOSITORY/issues/$number/lock" > /dev/null
