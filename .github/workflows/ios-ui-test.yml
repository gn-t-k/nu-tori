# PR では回さず、main への push と手で始めたときだけ回す。PR は Mac の結果で merge する（docs/agents/tooling.md）
name: ios-ui-test

on:
  push:
    branches: [main]
    # 必須のチェックではないので、ワークフローの paths で飛ばしてよい。scripts/check --pick-targets が ios を選ぶパスに合わせ、check.yml の代わりにこのファイルを見る。pick_targets を変えたらここも揃える
    paths:
      - "ios/**"
      - "shared/**"
      - "server/openapi.json"
      - "scripts/check"
      - ".github/workflows/ios-ui-test.yml"
      - "!ios/**/*.md"
  # 見本の場面の生の画面を撮る回（ios-screenshots）も、別のファイルにせずここで手で始める。
  # 既定のブランチに無いワークフローは手で始められないので、別のファイルにすると、main に入るまでブランチの上で回せない。
  # このファイルは main にあるので、`gh workflow run ios-ui-test.yml --ref <ブランチ> -f target=ios-screenshots` で、ブランチの上のこのファイルが回る（docs/agents/ios-release.md）
  workflow_dispatch:
    inputs:
      target:
        description: 回すもの（ios-ui-test は UI テスト、ios-screenshots は見本の場面の生の画面を撮る）
        type: choice
        options: [ios-ui-test, ios-screenshots]
        default: ios-ui-test

concurrency:
  group: ios-ui-test-${{ github.ref }}-${{ inputs.target || 'ios-ui-test' }}

permissions:
  contents: read

jobs:
  ios-ui-test:
    # main への push では inputs が空なので、UI テストを回す
    if: inputs.target != 'ios-screenshots'
    runs-on: xcode-27
    # 通った回は長くて 50 分。止まった回で、待つセッションが時間切れになった（#745）
    timeout-minutes: 100
    outputs:
      artifact-url: ${{ steps.upload.outputs.artifact-url }}
      failures: ${{ steps.report.outputs.failures }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: scripts/check ios-ui-test
      # 見た目を変えた PR の本文に貼るため、通った回でもスクリーンショットを残す（docs/agents/git.md）
      # 書き出せなくても、テストの結果（ジョブの成否と main の Issue）は変えない
      - name: スクリーンショットを書き出す
        if: success() || failure()
        continue-on-error: true
        run: |
          results=ios/.build/NuTori.xcresult
          if [ ! -d "$results" ]; then
            echo "xcresult が無い（UI テストの前に止まった）ので、ログを見る" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          mkdir -p ios/.build/report/attachments
          xcrun xcresulttool export attachments --path "$results" --output-path ios/.build/report/attachments
      - id: report
        name: 失敗の要約を書き出す
        if: failure()
        run: |
          results=ios/.build/NuTori.xcresult
          [ -d "$results" ] || exit 0
          mkdir -p ios/.build/report
          xcrun xcresulttool get test-results summary --path "$results" --compact > ios/.build/report/summary.json
          jq -r '.testFailures[]? | "- \(.testIdentifierString): \(.failureText)"' ios/.build/report/summary.json |
            tee ios/.build/report/failures.txt >> "$GITHUB_STEP_SUMMARY"
          # main で落ちたときの Issue をテストごとに分けるため、テストごとにまとめて渡す
          jq -c '[.testFailures[]? | {test: .testIdentifierString, text: .failureText}]
            | group_by(.test) | map({test: .[0].test, texts: map(.text)})' ios/.build/report/summary.json |
            sed 's/^/failures=/' >> "$GITHUB_OUTPUT"
      - id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: success() || failure()
        with:
          name: ios-ui-test-report
          path: ios/.build/report
          retention-days: 3

  # 生の画面はリポジトリに置かず、成果物に上げる。合成のコマンドは、落とした成果物のフォルダを受ける
  ios-screenshots:
    if: inputs.target == 'ios-screenshots'
    runs-on: xcode-27
    # ビルドと8場面で 30 分ほどの見込み。止まった回を既定の 6 時間残さない
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: scripts/check ios-screenshots
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: success() || failure()
        with:
          name: listing-raw-screens
          path: ios/.build/listing-screens
          if-no-files-found: error
          retention-days: 7

  # main で落ちたら、落ちたテストごとに Issue を立て、緑に戻ったら閉じる。テストの前に止まった回は、落ちたテストが無いので、ワークフローの名前の Issue を立てる
  # ほかのブランチで手で始めた回は、その場で見る人がいるので立てない
  track-main-failure:
    needs: ios-ui-test
    if: >-
      always() && github.ref == 'refs/heads/main' &&
      (needs.ios-ui-test.result == 'success' || needs.ios-ui-test.result == 'failure')
    runs-on: ubuntu-latest
    # 通った回は 1 分かからない。止まった回を既定の 6 時間残さない
    timeout-minutes: 5
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      REPORT: ${{ needs.ios-ui-test.outputs.artifact-url || '無い（UI テストの前に止まったので、ログを見る）' }}
      TITLE: main の ios-ui-test が落ちている
    steps:
      - id: open-issues
        name: 開いている Issue を探す
        env:
          TEST_TITLE_PREFIX: "${{ env.TITLE }}: "
        run: |
          # パイプで jq に渡すと gh api の失敗が消え、開いた Issue があっても2つ目を立てるので、受けてから配列にする
          matches="$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues?state=open&per_page=100" \
            --jq '.[] | select(.pull_request == null and (.title == env.TITLE or (.title | startswith(env.TEST_TITLE_PREFIX)))) | {number, title}')"
          issues="$(jq -sc . <<< "$matches")"
          echo "issues=$issues" >> "$GITHUB_OUTPUT"
      - name: 緑に戻ったので Issue を閉じる
        if: needs.ios-ui-test.result == 'success'
        env:
          ISSUES: ${{ steps.open-issues.outputs.issues }}
        run: |
          for number in $(jq -r '.[].number' <<< "$ISSUES"); do
            gh api "repos/$GITHUB_REPOSITORY/issues/$number/comments" -f body="main の ios-ui-test が緑に戻った: $RUN_URL" > /dev/null
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/$number" -f state=closed -f state_reason=completed > /dev/null
          done
      - name: 落ちたテストごとに、Issue を立てるか、また落ちたことを書き足す
        if: needs.ios-ui-test.result == 'failure'
        env:
          ISSUES: ${{ steps.open-issues.outputs.issues }}
          FAILURES: ${{ needs.ios-ui-test.outputs.failures }}
          TEST_TITLE_PREFIX: "${{ env.TITLE }}: "
        run: |
          comment_on_or_create_issue() {
            local title="$1" details="$2" number
            number="$(jq -r --arg title "$title" '.[] | select(.title == $title) | .number' <<< "$ISSUES" | head -n 1)"
            if [ -n "$number" ]; then
              comment_on_issue "$number" "$details"
            else
              create_issue "$title" "$details"
            fi
          }
          comment_on_issue() {
            local number="$1" details="$2" body
            body="$(printf 'また落ちた: %s\n失敗の要約とスクリーンショット: %s\n%s' "$RUN_URL" "$REPORT" "$details")"
            gh api "repos/$GITHUB_REPOSITORY/issues/$number/comments" -f body="$body" > /dev/null
          }
          create_issue() {
            local title="$1" details="$2" body number
            body="$(printf '%s\n\n- 落ちた回: %s\n- 失敗の要約とスクリーンショット: %s\n%s\n\n%s' \
              'main の ios-ui-test（パッケージのテスト、アプリのビルド、UI テスト）が落ちた。次の PR より先に直す。' \
              "$RUN_URL" "$REPORT" "$details" \
              'main で ios-ui-test が緑に戻ると、ワークフローがこの Issue を閉じる。')"
            number="$(gh api "repos/$GITHUB_REPOSITORY/issues" -f title="$title" -f body="$body" -f "labels[]=ready-for-agent" --jq .number)"
            # GITHUB_TOKEN で立てた Issue は lock-conversations.yml を起こさないので、ここでロックする
            gh api --method PUT "repos/$GITHUB_REPOSITORY/issues/$number/lock" > /dev/null
          }

          failures="${FAILURES:-[]}"
          if [ "$(jq length <<< "$failures")" -eq 0 ]; then
            comment_on_or_create_issue "$TITLE" ""
            exit 0
          fi
          jq -c '.[]' <<< "$failures" | while read -r failure; do
            test_name="$(jq -r .test <<< "$failure")"
            details="$(jq -r '"\n```text\n" + (.texts | join("\n")) + "\n```"' <<< "$failure")"
            comment_on_or_create_issue "$TEST_TITLE_PREFIX$test_name" "$details"
          done
