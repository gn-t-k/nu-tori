name: 会話をロックする

on:
  issues:
    types: [opened]
  pull_request:
    types: [opened]

permissions:
  issues: write
  pull-requests: write

jobs:
  lock:
    runs-on: ubuntu-latest
    # 通った回は 1 分かからない。止まった回を既定の 6 時間残さない
    timeout-minutes: 5
    steps:
      - run: gh api --method PUT "repos/$GITHUB_REPOSITORY/issues/$NUMBER/lock"
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
