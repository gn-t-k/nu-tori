# deploy.yml から環境ごとに呼ぶ
name: deploy-worker

on:
  workflow_call:
    inputs:
      environment:
        description: GitHub の Environment の名前
        required: true
        type: string
      wrangler-env:
        description: wrangler.jsonc の環境の名前（上の階層は空）
        required: false
        default: ""
        type: string
      url:
        description: 出した Worker の URL
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment }}
      url: ${{ inputs.url }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_ENV: ${{ inputs.wrangler-env }}
    defaults:
      run:
        shell: bash
        working-directory: server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: server/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: server/.node-version
          cache: pnpm
          cache-dependency-path: server/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: D1 の移行を当てる
        run: |
          # 最初の移行を置くまではディレクトリが無く、wrangler は無いと失敗する
          if [ -d d1-migrations ]; then
            pnpm exec wrangler d1 migrations apply DB --remote --env "$WRANGLER_ENV"
          else
            echo "d1-migrations が無いので飛ばす"
          fi
      - name: Worker を出す
        run: pnpm exec wrangler deploy --env "$WRANGLER_ENV"
