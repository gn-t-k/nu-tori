name: check

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # 必須のチェックを保留のまま残さないよう、ワークフローの paths ではなくジョブの条件で飛ばす（docs/agents/tooling.md）
  changes:
    runs-on: ubuntu-latest
    outputs:
      ios: ${{ steps.changed.outputs.ios }}
      server: ${{ steps.changed.outputs.server }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: changed
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if ! files="$(git diff --name-only "$BASE" "$GITHUB_SHA")"; then
            echo "ios=true" >> "$GITHUB_OUTPUT"
            echo "server=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # 文書（*.md）だけの変更では、確かめるものが無いのでジョブを飛ばす
          files="$(grep -vE '\.md$' <<< "$files" || true)"
          for target in ios server; do
            paths="$target/|shared/|scripts/check\$|\.github/workflows/check\.yml\$"
            # アプリの API のクライアントは、サーバーの OpenAPI の文書から生成する
            if [ "$target" = ios ]; then paths="$paths|server/openapi\.json\$"; fi
            if grep -qE "^($paths)" <<< "$files"; then
              echo "$target=true" >> "$GITHUB_OUTPUT"
            else
              echo "$target=false" >> "$GITHUB_OUTPUT"
            fi
          done

  ios:
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: ubuntu-latest
    container: swift:6.4.0-noble@sha256:64bab762bc73a3fda6d9ebc559258bd6d7660c10a705bb25ecacad2f99d066f9
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: apt-get update && apt-get install -y --no-install-recommends curl ca-certificates
      # API のクライアントの生成器のビルド（数分）を毎回しないため
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ios/OpenAPIGenerator/.build
          key: openapi-generator-${{ hashFiles('ios/.swift-version', 'ios/OpenAPIGenerator/Package.resolved') }}
      - run: scripts/check ios

  # 必須にしない。xcode-27 がプレビューを抜けたら、必須にするかを決め直す
  # UI テストは ios-ui-test.yml で回し、main への push ではそちらがビルドもする
  ios-app:
    needs: changes
    if: needs.changes.outputs.ios == 'true' && github.event_name == 'pull_request'
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: scripts/check ios-app

  server:
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: server/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: server/.node-version
          cache: pnpm
          cache-dependency-path: server/pnpm-lock.yaml
      - run: scripts/check server
