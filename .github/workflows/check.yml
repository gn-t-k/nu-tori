name: check

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # 必須のチェックを保留のまま残さないよう、ワークフローの paths ではなくジョブの条件で飛ばす（docs/agents/tooling.md）
  changes:
    runs-on: ubuntu-latest
    # 通った回は 1 分かからない。止まった回を既定の 6 時間残さない
    timeout-minutes: 5
    outputs:
      ios: ${{ steps.changed.outputs.ios }}
      server: ${{ steps.changed.outputs.server }}
      site: ${{ steps.changed.outputs.site }}
      scripts: ${{ steps.changed.outputs.scripts }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: changed
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if ! files="$(git diff --name-only --no-renames "$BASE" "$GITHUB_SHA")"; then
            echo "ios=true" >> "$GITHUB_OUTPUT"
            echo "server=true" >> "$GITHUB_OUTPUT"
            echo "site=true" >> "$GITHUB_OUTPUT"
            echo "scripts=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # どのパスがどの対象に当たるかは、手元と同じ決まりを scripts/check に置く
          scripts/check --pick-targets <<< "$files" >> "$GITHUB_OUTPUT"

  ios:
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: ubuntu-latest
    # 通った回は長くて 6 分。止まった回を既定の 6 時間残さない
    timeout-minutes: 15
    container: swift:6.4.0-noble@sha256:64bab762bc73a3fda6d9ebc559258bd6d7660c10a705bb25ecacad2f99d066f9
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: apt-get update && apt-get install -y --no-install-recommends curl ca-certificates
      # API のクライアントの生成器のビルド（数分）を毎回しないため
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ios/OpenAPIGenerator/.build
          key: openapi-generator-${{ hashFiles('ios/.swift-version', 'ios/OpenAPIGenerator/Package.resolved') }}
      - run: scripts/check ios

  # 必須にしない。xcode-27 がプレビューを抜けたら、必須にするかを決め直す
  # UI テストは ios-ui-test.yml で回し、main への push ではそちらがビルドもする
  ios-app:
    needs: changes
    if: needs.changes.outputs.ios == 'true' && github.event_name == 'pull_request'
    runs-on: xcode-27
    # 通った回は長くて 8 分。async のテストで止まった回が 1 時間残った（#606）
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: scripts/check ios-app

  server:
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    # 通った回は長くて 11 分。止まった回を既定の 6 時間残さない
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: server/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: server/.node-version
          cache: pnpm
          cache-dependency-path: server/pnpm-lock.yaml
      - run: scripts/check server

  site:
    needs: changes
    if: needs.changes.outputs.site == 'true'
    runs-on: ubuntu-latest
    # 合成のコマンドのテストのために Chromium とそのライブラリを入れるので、1 分では済まない。止まった回を既定の 6 時間残さない
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: site/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: site/.node-version
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml
      # Lint は server の独自のルール（server/oxlint-plugin.js）を読むが、server の依存は要らない
      - run: scripts/check site

  scripts:
    needs: changes
    if: needs.changes.outputs.scripts == 'true'
    runs-on: ubuntu-latest
    # 通った回は 1 分かからない。止まった回を既定の 6 時間残さない
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: scripts/check scripts
