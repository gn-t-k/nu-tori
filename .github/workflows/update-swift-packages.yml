# Dependabot は Swift Package を上げられない（Swift 6.4 のマニフェストを読めず、Xcode のプロジェクトの Package.resolved と生成したクライアントも揃えない）ので、ここで上げる
# 今の major の中の新しい版は1つの PR に、新しい major は依存ごとの Issue にする。PR と Issue は App のトークンで出す。GITHUB_TOKEN で出した PR には check が走らないため
name: update-swift-packages

on:
  schedule:
    # 毎週月曜 9:00（日本時間）。Dependabot と同じ曜日と時刻
    - cron: "0 0 * * 1"
  # 脆弱性が見つかったときに、月曜を待たずに上げるため。main 以外で始めると、PR と Issue を出さずに prepare の成果物だけを残す
  workflow_dispatch:

concurrency:
  group: update-swift-packages
  cancel-in-progress: false

permissions:
  contents: read

env:
  OUT: .scratch/swift-updates

jobs:
  # 依存のコード（生成器とテスト）を動かすので、App のトークンを渡さない
  prepare:
    runs-on: ubuntu-latest
    container: swift:6.4.0-noble@sha256:64bab762bc73a3fda6d9ebc559258bd6d7660c10a705bb25ecacad2f99d066f9
    timeout-minutes: 60
    outputs:
      updates: ${{ steps.result.outputs.updates }}
      majors: ${{ steps.result.outputs.majors }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: apt-get update && apt-get install -y --no-install-recommends curl ca-certificates
      # check.yml の ios が main に残したキャッシュを使う。上げたあとの生成器を、上げる前の鍵で保存しないよう、読むだけにする
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ios/OpenAPIGenerator/.build
          key: openapi-generator-${{ hashFiles('ios/.swift-version', 'ios/OpenAPIGenerator/Package.resolved') }}
      - run: scripts/update-swift-packages "$OUT"
      - id: result
        name: 差分を、版の書き換えと生成し直しに分けて書き出す
        env:
          GENERATED: ios/NuToriCore/Sources/NuToriAPI/Generated
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git add -A
          git diff --cached --binary -- . ":(exclude)$GENERATED" > "$OUT/versions.patch"
          git diff --cached --binary -- "$GENERATED" > "$OUT/generated.patch"
          if [ -f "$OUT/pull-request.md" ]; then echo "updates=true"; else echo "updates=false"; fi >> "$GITHUB_OUTPUT"
          if [ -f "$OUT/majors.tsv" ]; then echo "majors=true"; else echo "majors=false"; fi >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: swift-updates
          path: ${{ env.OUT }}
          retention-days: 7

  publish:
    needs: prepare
    if: >-
      github.ref == 'refs/heads/main' &&
      (needs.prepare.outputs.updates == 'true' || needs.prepare.outputs.majors == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # App の ID と秘密鍵を、main からだけ使える Environment から読む（ADR-0010）
    environment: dependency-updates
    env:
      BRANCH: update-swift-packages
      TITLE: Swift Package の依存の patch/minor を上げる
    steps:
      - id: token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.DEPENDENCY_APP_ID }}
          private-key: ${{ secrets.DEPENDENCY_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.token.outputs.token }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: swift-updates
          path: ${{ env.OUT }}
      - name: 新しい major を Issue で知らせる
        if: needs.prepare.outputs.majors == 'true'
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          while IFS=$'\t' read -r name current latest release; do
            export ISSUE_TITLE="Swift Package の $name に新しい major の版 ${latest%%.*} が出た"
            number="$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues?state=open&per_page=100" \
              --jq '.[] | select(.title == env.ISSUE_TITLE and .pull_request == null) | .number' | head -n 1)"
            if [ -n "$number" ]; then
              echo "#$number が開いているので立てない: $ISSUE_TITLE"
              continue
            fi
            body="$(cat << BODY
          $name の新しい major の版 $latest が出た。今は $current。Swift を上げるワークフローは major を上げないので、上げるかを決める。

          - リリース: $release
          - 上げるときは、変更履歴で API の変わったところを確かめ、docs/agents/dependencies.md の手順で上げる

          同じ題の Issue が開いているあいだは、ワークフローは新しく立てない。
          BODY
            )"
            gh api "repos/$GITHUB_REPOSITORY/issues" -f title="$ISSUE_TITLE" -f body="$body" -f "labels[]=needs-triage" > /dev/null
          done < "$OUT/majors.tsv"
      - name: 上げた版を PR に出す
        if: needs.prepare.outputs.updates == 'true'
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          BOT: ${{ steps.token.outputs.app-slug }}[bot]
        run: |
          git config user.name "$BOT"
          git config user.email "$(gh api "users/$BOT" --jq .id)+$BOT@users.noreply.github.com"
          git checkout -q -B "$BRANCH"
          git apply --index "$OUT/versions.patch"
          git commit -q -F - << MESSAGE
          $TITLE

          $(grep '^- ' "$OUT/pull-request.md")
          MESSAGE
          # 生成し直しただけの差分は別のコミットにする（docs/agents/dependencies.md）
          if [ -s "$OUT/generated.patch" ]; then
            git apply --index "$OUT/generated.patch"
            git commit -q -m "生成したクライアントを生成し直す"
          fi

          # 前の週の PR が開いていれば、ブランチを今週の内容で上書きして同じ PR を使い続ける。中身が同じなら check を回し直さない
          if git fetch -q --depth 1 origin "$BRANCH" 2> /dev/null && git diff --quiet FETCH_HEAD HEAD; then
            echo "ブランチの中身が今週と同じなので push しない"
          else
            git push -q --force origin "HEAD:refs/heads/$BRANCH"
          fi
          number="$(gh api "repos/$GITHUB_REPOSITORY/pulls?state=open&head=$GITHUB_REPOSITORY_OWNER:$BRANCH" --jq '.[0].number // empty')"
          if [ -n "$number" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/pulls/$number" -f title="$TITLE" -F body=@"$OUT/pull-request.md" > /dev/null
          else
            gh api "repos/$GITHUB_REPOSITORY/pulls" -f title="$TITLE" -f head="$BRANCH" -f base=main -F body=@"$OUT/pull-request.md" > /dev/null
          fi
